        '<div class="seg-tabs">' +
          '<button type="button" class="seg-tab ' + (sub === 0 ? 'active' : '') + '" data-action="set-card-tab" data-sub="0">1st: ' + escapeHtml(i1.battingTeam) + '</button>' +
          '<button type="button" class="seg-tab ' + (sub === 1 ? 'active' : '') + '" data-action="set-card-tab" data-sub="1">2nd: ' + escapeHtml(i2.battingTeam) + '</button>' +
          '<button type="button" class="seg-tab ' + (sub === 2 ? 'active' : '') + '" data-action="set-card-tab" data-sub="2">Over Log</button>' +
        '</div>' +

        (sub === 0 ? renderInningsCardHtml(i1) : '') +
        (sub === 1 ? renderInningsCardHtml(i2) : '') +
        (sub === 2 ? renderOverLogHtml(match) : '')
      );
    }

    function renderInningsCardHtml(inn) {
      if (inn.batters.length === 0 && inn.legalBalls === 0 && inn.runs === 0) {
        return '<div class="card card-pad text-center muted text-sm">Innings has not started yet.</div>';
      }
      return (
        '<div class="card">' +
          '<div class="card-header">' +
            '<span class="card-header-title">' + escapeHtml(inn.battingTeam) + ' Batting</span>' +
            '<span class="font-extrabold text-sm">' + inn.runs + '/' + inn.wickets + ' <span class="text-xs muted">(' + formatOvers(inn.legalBalls) + ' ov)</span></span>' +
          '</div>' +
          '<div class="table-wrap"><table>' +
            '<thead><tr><th>Batter</th><th class="num">R</th><th class="num">B</th><th class="num">4s</th><th class="num">6s</th><th class="num">SR</th></tr></thead>' +
            '<tbody>' +
              inn.batters.map(b =>
                '<tr>' +
                  '<td><div class="player-name">' + escapeHtml(b.name) + (!b.isOut ? '*' : '') + '</div><div class="player-dismissal">' + escapeHtml(b.dismissalText || (b.isOut ? 'out' : 'not out')) + '</div></td>' +
                  '<td class="num font-extrabold">' + b.runs + '</td>' +
                  '<td class="num muted">' + b.balls + '</td>' +
                  '<td class="num muted">' + b.fours + '</td>' +
                  '<td class="num muted">' + b.sixes + '</td>' +
                  '<td class="num muted">' + calcStrikeRate(b.runs, b.balls) + '</td>' +
                '</tr>'
              ).join('') +
              '<tr style="background:rgba(255,255,255,0.02);"><td class="font-bold muted">Extras</td><td colspan="5" class="num text-xs muted"><strong style="color:#fff;">' + inn.extras.total + '</strong> (wd ' + inn.extras.wd + ', nb ' + inn.extras.nb + ', b ' + inn.extras.b + ', lb ' + inn.extras.lb + ')</td></tr>' +
              '<tr style="background:rgba(16,185,129,0.08);"><td class="font-extrabold">Total</td><td colspan="5" class="num font-extrabold">' + inn.runs + '/' + inn.wickets + ' <span class="text-xs muted">(' + formatOvers(inn.legalBalls) + ' ov, RR ' + calcRunRate(inn.runs, inn.legalBalls) + ')</span></td></tr>' +
            '</tbody>' +
          '</table></div>' +
        '</div>' +

        (inn.fow.length > 0
          ? '<div class="card card-pad stack-sm"><div class="card-header-title">Fall of Wickets</div><div class="row-wrap">' +
              inn.fow.map(f => '<span style="background:var(--bg-input); border:1px solid var(--border); padding:4px 9px; border-radius:8px; font-size:11.5px;"><strong>' + f.wicketNum + '-' + f.runs + '</strong> (' + escapeHtml(f.batterName) + ', ' + escapeHtml(f.overs) + ')</span>').join('') +
            '</div></div>'
          : '') +

        '<div class="card">' +
          '<div class="card-header"><span class="card-header-title">' + escapeHtml(inn.bowlingTeam) + ' Bowling</span></div>' +
          '<div class="table-wrap"><table>' +
            '<thead><tr><th>Bowler</th><th class="num">O</th><th class="num">M</th><th class="num">R</th><th class="num">W</th><th class="num">Econ</th></tr></thead>' +
            '<tbody>' +
              inn.bowlers.map(bw =>
                '<tr>' +
                  '<td class="player-name">' + escapeHtml(bw.name) + '</td>' +
                  '<td class="num font-bold">' + formatOvers(bw.legalBalls) + '</td>' +
                  '<td class="num muted">' + bw.maidens + '</td>' +
                  '<td class="num">' + bw.runsConceded + '</td>' +
                  '<td class="num font-extrabold text-emerald">' + bw.wickets + '</td>' +
                  '<td class="num muted">' + calcEconomy(bw.runsConceded, bw.legalBalls) + '</td>' +
                '</tr>'
              ).join('') +
            '</tbody>' +
          '</table></div>' +
        '</div>'
      );
    }

    function renderOverLogHtml(match) {
      const inn = match.innings[match.currentInningsIndex];
      const hasOvers = inn.oversLog.length > 0 || inn.currentOverBalls.length > 0;
      return (
        '<div class="card">' +
          '<div class="card-header"><span class="card-header-title">Over-by-Over (' + escapeHtml(inn.battingTeam) + ')</span></div>' +
          (!hasOvers
            ? '<div class="card-pad text-center text-xs muted">No overs bowled yet.</div>'
            : '<div class="stack-sm" style="padding:12px;">' +
                (inn.currentOverBalls.length > 0
                  ? '<div style="padding:10px; border-radius:12px; background:var(--emerald-bg); border:1px solid var(--emerald-border);">' +
                      '<div class="row-between text-xs font-bold text-emerald" style="margin-bottom:6px;"><span>Over ' + (Math.floor(inn.legalBalls / 6) + 1) + ' (In Progress)</span><span>' + inn.runs + '/' + inn.wickets + '</span></div>' +
                      '<div class="ball-pills-wrap">' + inn.currentOverBalls.map(renderBallPill).join('') + '</div>' +
                    '</div>'
                  : '') +
                inn.oversLog.map(ov =>
                  '<div style="padding:10px; border-radius:12px; background:var(--bg-input); border:1px solid var(--border);">' +
                    '<div class="row-between text-xs" style="margin-bottom:6px;"><span><strong>Over ' + ov.overNum + '</strong> • <span class="muted">' + escapeHtml(ov.bowlerName) + '</span></span><span><strong>' + ov.runsInOver + ' runs</strong> <span class="muted">(' + escapeHtml(ov.scoreAtEnd) + ')</span></span></div>' +
                    '<div class="ball-pills-wrap">' + ov.balls.map(renderBallPill).join('') + '</div>' +
                  '</div>'
                ).join('') +
              '</div>') +
        '</div>' +

        '<div class="card">' +
          '<div class="card-header"><span class="card-header-title">Ball-by-Ball Commentary</span></div>' +
          (inn.commentary.length === 0
            ? '<div class="card-pad text-center text-xs muted">Commentary will appear here as balls are bowled.</div>'
            : '<div style="max-height:360px; overflow-y:auto;">' +
                inn.commentary.map(c =>
                  '<div style="padding:10px 14px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:10px; font-size:12px;">' +
                    '<span style="font-family:monospace; font-weight:700; color:var(--text-dim); width:34px; flex-shrink:0; padding-top:4px;">' + escapeHtml(c.overBall) + '</span>' +
                    renderBallPill({ label: c.badge, type: c.type }) +
                    '<div style="flex:1; padding-top:3px;"><span class="muted font-bold">' + escapeHtml(c.bowler) + ' to ' + escapeHtml(c.batter) + ':</span> ' + escapeHtml(c.text) + '</div>' +
                  '</div>'
                ).join('') +
              '</div>') +
        '</div>'
      );
    }

    /* ---------- VIEW 3: MATCH HISTORY ---------- */
    function renderHistoryView() {
      const admin = isAdmin();
      const q = state.historySearch.trim().toLowerCase();
      const filter = state.historyFilter;

      const filtered = state.matches.filter(m => {
        if (filter === 'live' && m.status === 'completed') return false;
        if (filter === 'completed' && m.status !== 'completed') return false;
        if (!q) return true;
        return (m.title + ' ' + m.venue + ' ' + m.team1 + ' ' + m.team2 + ' ' + m.date).toLowerCase().includes(q);
      });

      return (
        '<div class="card card-pad stack-sm">' +
          '<div class="row-between" style="flex-wrap:wrap; gap:8px;">' +
            '<div>' +
              '<div style="font-size:17px; font-weight:900;">Match History (' + state.matches.length + ')</div>' +
              '<div class="text-xs muted">' + (state.mode === 'cloud' ? 'Synced live across all TCP phones.' : 'Saved locally on this device.') + '</div>' +
            '</div>' +
            '<div class="row-wrap">' +
              '<button type="button" class="btn btn-xs btn-subtle" data-action="export-json">' + ICONS.download + '<span>Export</span></button>' +
              (admin ? '<button type="button" class="btn btn-xs btn-subtle" data-action="import-json">' + ICONS.upload + '<span>Import</span></button>' : '') +
              (admin ? '<button type="button" class="btn btn-xs btn-primary" data-action="nav" data-tab="setup">' + ICONS.plus + '<span>New</span></button>' : '') +
            '</div>' +
          '</div>' +
          '<input id="history-search-input" type="search" class="field-input field-input-sm" value="' + escapeHtml(state.historySearch) + '" placeholder="Search by team, series, or venue..." />' +
          '<div class="row-wrap">' +
            '<button type="button" class="filter-chip ' + (filter === 'all' ? 'active' : '') + '" data-action="set-history-filter" data-filter="all">All (' + state.matches.length + ')</button>' +
            '<button type="button" class="filter-chip ' + (filter === 'live' ? 'active' : '') + '" data-action="set-history-filter" data-filter="live">Active</button>' +
            '<button type="button" class="filter-chip ' + (filter === 'completed' ? 'active' : '') + '" data-action="set-history-filter" data-filter="completed">Completed</button>' +
          '</div>' +
        '</div>' +

        (filtered.length === 0
          ? '<div class="card card-pad text-center stack-sm" style="padding:32px 16px; align-items:center;">' +
              '<div style="font-size:15px; font-weight:800;">' + (state.matches.length === 0 ? 'No Matches Yet' : 'No Matching Matches') + '</div>' +
              '<div class="text-xs muted">' + (admin ? 'Start a new match or load the demo T20 chase.' : 'Matches scored by TCP Admins will appear here.') + '</div>' +
              (admin && state.matches.length === 0
                ? '<div class="row-wrap" style="justify-content:center; margin-top:4px;"><button type="button" class="btn btn-primary btn-sm" data-action="nav" data-tab="setup">New Match</button><button type="button" class="btn btn-subtle btn-sm" data-action="load-demo">' + ICONS.spark + '<span>Load Demo</span></button></div>'
                : '') +
            '</div>'
          : filtered.map(m => {
              const i1 = m.innings[0], i2 = m.innings[1];
              const isActive = m.id === (getActiveMatch() && getActiveMatch().id);
              const eq = getEquation(m);
              const statusBadge = m.status === 'live'
                ? '<span class="badge badge-live"><span class="live-dot"></span>LIVE</span>'
                : (m.status === 'completed' ? '<span class="badge badge-done">COMPLETED</span>' : '<span class="badge badge-break">INNINGS BREAK</span>');
              const openTab = m.status === 'completed' ? 'scorecard' : 'live';
              const openLabel = m.status === 'completed' ? 'Open Card' : (admin ? 'Resume Live' : 'Watch Live');

              return (
                '<div class="card card-pad stack-sm" style="' + (isActive ? 'border-color:var(--emerald); box-shadow:0 0 0 1px rgba(16,185,129,0.25);' : '') + '">' +
                  '<div class="row-between" style="align-items:flex-start;">' +
                    '<div style="min-width:0;">' +
                      '<div class="row-wrap" style="gap:6px;"><span class="font-extrabold text-sm">' + escapeHtml(m.title) + '</span>' + statusBadge + (isActive ? '<span class="badge badge-active-match">LOADED</span>' : '') + '</div>' +
                      '<div class="text-xs muted" style="margin-top:3px;">' + escapeHtml(m.venue) + ' • ' + escapeHtml(m.date) + ' • ' + m.oversPerInnings + ' Overs</div>' +
                    '</div>' +
                    (admin ? '<button type="button" class="icon-btn" data-action="delete-match" data-id="' + escapeHtml(m.id) + '" title="Delete match">' + ICONS.trash + '</button>' : '') +
                  '</div>' +
                  '<div style="background:var(--bg-input); border:1px solid var(--border); border-radius:12px; padding:10px 12px;" class="stack-sm">' +
                    '<div class="row-between text-sm"><span class="font-bold">' + escapeHtml(i1.battingTeam) + '</span><span class="font-extrabold">' + i1.runs + '/' + i1.wickets + ' <span class="text-xs muted">(' + formatOvers(i1.legalBalls) + ' ov)</span></span></div>' +
                    '<div class="row-between text-sm"><span class="font-bold">' + escapeHtml(i2.battingTeam) + '</span><span class="font-extrabold">' + (i2.legalBalls > 0 || i2.runs > 0 ? (i2.runs + '/' + i2.wickets + ' <span class="text-xs muted">(' + formatOvers(i2.legalBalls) + ' ov)</span>') : '<span class="text-xs muted">Yet to bat</span>') + '</span></div>' +
                  '</div>' +
                  '<div class="text-xs font-bold text-emerald">' + escapeHtml(eq.text) + '</div>' +
                  '<div class="row-wrap" style="margin-top:2px;">' +
                    '<button type="button" class="btn btn-xs btn-primary" style="flex:1;" data-action="load-match" data-id="' + escapeHtml(m.id) + '" data-tab="' + openTab + '">' + openLabel + '</button>' +
                    (admin ? '<button type="button" class="btn btn-xs btn-subtle" style="flex:1;" data-action="open-edit-match" data-id="' + escapeHtml(m.id) + '">' + ICONS.edit + '<span>Edit Details</span></button>' : '') +
                    '<button type="button" class="btn btn-xs btn-wa" data-action="open-share" data-id="' + escapeHtml(m.id) + '" data-tab="quick">' + ICONS.wa + '<span>WhatsApp</span></button>' +
                  '</div>' +
                '</div>'
              );
            }).join(''))
      );
    }

    /* ---------- VIEW 4: NEW MATCH SETUP (ADMIN ONLY) ---------- */
    function renderSetupView() {
      const t1 = setupDraft.team1.trim() || 'Team A';
      const t2 = setupDraft.team2.trim() || 'Team B';
      const presets = [5, 10, 20, 50];

      return (
        '<div class="scoreboard">' +
          '<div class="row-between" style="flex-wrap:wrap; gap:10px;">' +
            '<div>' +
              '<div class="text-xs font-extrabold text-emerald" style="letter-spacing:0.05em; text-transform:uppercase; margin-bottom:2px;">Tamarind Cricket Players (TCP)</div>' +
              '<div style="font-size:18px; font-weight:900;">New Cricket Match</div>' +
              '<div class="text-xs muted" style="margin-top:2px;">Set teams, overs, toss &amp; openers. Syncs live to all viewers.</div>' +
            '</div>' +
            '<button type="button" class="btn btn-sm btn-emerald-soft" data-action="load-demo">' + ICONS.spark + '<span>Load Demo Match</span></button>' +
          '</div>' +
        '</div>' +

        '<form id="setup-form" class="stack">' +
          '<div class="card card-pad stack">' +
            '<div class="card-header-title">Teams &amp; Match Info</div>' +
            '<div class="form-grid-2">' +
              '<div><label class="field-label" for="inp-team1">Team A Name *</label><input id="inp-team1" name="team1" type="text" required class="field-input" value="' + escapeHtml(setupDraft.team1) + '" /></div>' +
              '<div><label class="field-label" for="inp-team2">Team B Name *</label><input id="inp-team2" name="team2" type="text" required class="field-input" value="' + escapeHtml(setupDraft.team2) + '" /></div>' +
            '</div>' +
            '<div class="form-grid-3">' +
              '<div><label class="field-label" for="inp-title">Series / Match Title</label><input id="inp-title" name="title" type="text" class="field-input" value="' + escapeHtml(setupDraft.title) + '" placeholder="e.g., TCP Sunday Cup" /></div>' +
              '<div><label class="field-label" for="inp-venue">Venue / Ground</label><input id="inp-venue" name="venue" type="text" class="field-input" value="' + escapeHtml(setupDraft.venue) + '" placeholder="e.g., Tamarind Ground" /></div>' +
              '<div><label class="field-label" for="inp-date">Date</label><input id="inp-date" name="date" type="date" class="field-input" value="' + escapeHtml(setupDraft.date) + '" /></div>' +
            '</div>' +
          '</div>' +

          '<div class="card card-pad stack">' +
            '<div class="card-header-title">Format &amp; Toss</div>' +
            '<div>' +
              '<label class="field-label">Overs per Innings</label>' +
              '<div class="row-wrap">' +
                presets.map(ov => '<button type="button" class="pill-choice ' + (Number(setupDraft.overs) === ov ? 'active' : '') + '" data-action="set-overs" data-overs="' + ov + '">' + ov + ' Ov</button>').join('') +
                '<div class="row" style="margin-left:auto;"><span class="text-xs muted font-bold">Custom:</span><input id="inp-overs" name="overs" type="number" min="1" max="100" required class="field-input field-input-sm" style="width:70px; text-align:center; font-weight:800;" value="' + setupDraft.overs + '" /></div>' +
              '</div>' +
            '</div>' +
            '<div class="form-grid-2">' +
              '<div><label class="field-label">Toss Won By</label><div class="info-grid">' +
                '<button type="button" id="toss-t1-btn" class="pill-choice ' + (setupDraft.tossWinner === 'team1' ? 'active' : '') + '" data-action="set-toss-winner" data-val="team1" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + escapeHtml(t1) + '</button>' +
                '<button type="button" id="toss-t2-btn" class="pill-choice ' + (setupDraft.tossWinner === 'team2' ? 'active' : '') + '" data-action="set-toss-winner" data-val="team2" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + escapeHtml(t2) + '</button>' +
              '</div></div>' +
              '<div><label class="field-label">Elected To</label><div class="info-grid">' +
                '<button type="button" class="pill-choice ' + (setupDraft.tossDecision === 'bat' ? 'active' : '') + '" data-action="set-toss-decision" data-val="bat">Bat First</button>' +
                '<button type="button" class="pill-choice ' + (setupDraft.tossDecision === 'bowl' ? 'active' : '') + '" data-action="set-toss-decision" data-val="bowl">Bowl First</button>' +
              '</div></div>' +
            '</div>' +
          '</div>' +

          '<div class="card card-pad stack">' +
            '<div class="card-header-title">Opening Players</div>' +
            '<div class="form-grid-3">' +
              '<div><label class="field-label" for="inp-striker">Opening Striker *</label><input id="inp-striker" name="striker" type="text" required class="field-input" value="' + escapeHtml(setupDraft.striker) + '" /></div>' +
              '<div><label class="field-label" for="inp-nonstriker">Opening Non-Striker *</label><input id="inp-nonstriker" name="nonStriker" type="text" required class="field-input" value="' + escapeHtml(setupDraft.nonStriker) + '" /></div>' +
              '<div><label class="field-label" for="inp-bowler">Opening Bowler *</label><input id="inp-bowler" name="bowler" type="text" required class="field-input" value="' + escapeHtml(setupDraft.bowler) + '" /></div>' +
            '</div>' +
          '</div>' +

          '<button type="submit" class="btn btn-primary btn-full" style="padding:13px; font-size:15px;">' + ICONS.play + '<span>Start Match</span></button>' +
        '</form>'
      );
    }

    /* ---------- VIEW 5: ADMIN MANAGEMENT PANEL (ADMIN ONLY) ---------- */
    function renderAdminsView() {
      if (state.mode === 'local') {
        return (
          '<div class="card card-pad stack">' +
            '<div class="row">' +
              '<div style="width:38px; height:38px; border-radius:11px; background:var(--sky-bg); color:var(--sky); display:flex; align-items:center; justify-content:center; border:1px solid var(--sky-border);">' + ICONS.shield + '</div>' +
              '<div><div style="font-size:16px; font-weight:900;">Admin Access &amp; Cloud Sync</div><div class="text-xs muted">Currently running in Local Mode</div></div>' +
            '</div>' +
            '<div class="text-sm muted">Once you paste your free Firebase project config into <code>FIREBASE_CONFIG</code> at the top of this file, this panel lets you add or remove authorized TCP Admin email addresses in real time.</div>' +
            '<div class="row-wrap">' +
              '<button type="button" class="btn btn-sm btn-sky-soft" data-action="toggle-local-role">' + (isAdmin() ? 'Preview Read-Only Viewer Mode' : 'Switch Back to Admin Mode') + '</button>' +
            '</div>' +
          '</div>'
        );
      }

      const myEmail = state.user && state.user.email ? state.user.email.toLowerCase() : '';
      return (
        '<div class="scoreboard">' +
          '<div class="row-between">' +
            '<div>' +
              '<div class="text-xs font-extrabold text-emerald">ADMIN MANAGEMENT</div>' +
              '<div style="font-size:17px; font-weight:900;">Authorized TCP Scorers</div>' +
              '<div class="text-xs muted" style="margin-top:2px;">Signed in as <strong style="color:#fff;">' + escapeHtml(myEmail) + '</strong></div>' +
            '</div>' +
            '<button type="button" class="btn btn-xs btn-subtle" data-action="sign-out">Sign Out</button>' +
          '</div>' +
        '</div>' +

        '<form id="add-admin-form" class="card card-pad stack-sm">' +
          '<div class="card-header-title">Grant Admin Access</div>' +
          '<div class="text-xs muted">Add a player\'s email address below. When they sign in with Google or Email/Password using that email, they get full scoring &amp; edit access.</div>' +
          '<div class="row">' +
            '<input id="new-admin-email" type="email" required class="field-input field-input-sm" style="flex:1;" placeholder="player@gmail.com" />' +
            '<button type="submit" class="btn btn-sm btn-primary">' + ICONS.plus + '<span>Add Admin</span></button>' +
          '</div>' +
        '</form>' +

        '<div class="card">' +
          '<div class="card-header"><span class="card-header-title">Current Admins (' + state.adminEmails.length + ')</span></div>' +
          '<div class="stack-sm" style="padding:12px;">' +
            state.adminEmails.map(email => {
              const isMe = email === myEmail;
              const isPrimary = email === state.primaryAdminEmail;
              return (
                '<div class="row-between" style="padding:10px 12px; border-radius:12px; background:var(--bg-input); border:1px solid var(--border);">' +
                  '<div class="stack-sm" style="gap:2px; min-width:0;">' +
                    '<span class="font-bold text-sm" style="word-break:break-all;">' + escapeHtml(email) + '</span>' +
                    '<div class="row-wrap">' +
                      (isPrimary ? '<span class="badge badge-live">PRIMARY ADMIN</span>' : '<span class="badge badge-active-match">ADMIN</span>') +
                      (isMe ? '<span class="text-xs muted">(You)</span>' : '') +
                    '</div>' +
                  '</div>' +
                  (!isMe && !isPrimary
                    ? '<button type="button" class="btn btn-xs btn-rose" data-action="remove-admin" data-email="' + escapeHtml(email) + '">Revoke</button>'
                    : '') +
                '</div>'
              );
            }).join('') +
          '</div>' +
        '</div>'
      );
    }

    /*************************************************************************
     * 8. AUTH MODAL (GOOGLE + EMAIL/PASSWORD)
     *************************************************************************/
    function openAuthModal() {
      if (state.mode === 'local') {
        openModal(
          '<div class="modal-head">' +
            '<div style="font-size:15.5px; font-weight:900;">Role &amp; Cloud Status</div>' +
            '<button type="button" class="icon-btn" data-action="close-modal">' + ICONS.close + '</button>' +

    function openEditMatchModal(matchId) {
      if (!isAdmin()) return;
      const match = getMatchById(matchId) || getActiveMatch();
      if (!match) return;
      state.editState = {
        matchId: match.id,
        tab: 'info',
        innIdx: match.currentInningsIndex,
        draft: JSON.parse(JSON.stringify(match))
      };
      renderEditMatchModal();
    }

    function syncEditInputsToDraft() {
      const es = state.editState;
      if (!es) return;
      const d = es.draft;

      if (es.tab === 'info') {
        const gv = id => { const el = document.getElementById(id); return el ? el.value : null; };
        const oldT1 = d.team1, oldT2 = d.team2;
        if (gv('ed-title') !== null) d.title = gv('ed-title').trim() || d.title;
        if (gv('ed-venue') !== null) d.venue = gv('ed-venue').trim() || 'Tamarind Ground';
        if (gv('ed-date')) d.date = gv('ed-date');
        if (gv('ed-overs') !== null) d.oversPerInnings = Math.max(1, parseInt(gv('ed-overs'), 10) || 20);
        const cleanT1 = gv('ed-team1') !== null ? (gv('ed-team1').trim() || oldT1) : oldT1;
        const cleanT2 = gv('ed-team2') !== null ? (gv('ed-team2').trim() || oldT2) : oldT2;
        if (cleanT1 !== oldT1 || cleanT2 !== oldT2) {
          d.innings.forEach(inn => {
            if (inn.battingTeam === oldT1) inn.battingTeam = cleanT1;
            else if (inn.battingTeam === oldT2) inn.battingTeam = cleanT2;
            if (inn.bowlingTeam === oldT1) inn.bowlingTeam = cleanT1;
            else if (inn.bowlingTeam === oldT2) inn.bowlingTeam = cleanT2;
          });
          if (d.tossWinner === oldT1) d.tossWinner = cleanT1;
          else if (d.tossWinner === oldT2) d.tossWinner = cleanT2;
          d.team1 = cleanT1; d.team2 = cleanT2;
        }
        if (gv('ed-toss-win') === 'team1') d.tossWinner = d.team1;
        else if (gv('ed-toss-win') === 'team2') d.tossWinner = d.team2;
        if (gv('ed-toss-dec') === 'bat' || gv('ed-toss-dec') === 'bowl') d.tossDecision = gv('ed-toss-dec');
        if (gv('ed-status')) d.status = gv('ed-status');
        if (gv('ed-result') !== null) d.resultText = gv('ed-result').trim();
      } else if (es.tab === 'batters') {
        const inn = d.innings[es.innIdx];
        inn.batters.forEach((b, idx) => {
          const g = p => document.getElementById('ed-bat-' + p + '-' + idx);
          if (g('name')) b.name = g('name').value.trim() || b.name;
          if (g('r')) b.runs = Math.max(0, parseInt(g('r').value, 10) || 0);
          if (g('b')) b.balls = Math.max(0, parseInt(g('b').value, 10) || 0);
          if (g('4')) b.fours = Math.max(0, parseInt(g('4').value, 10) || 0);
          if (g('6')) b.sixes = Math.max(0, parseInt(g('6').value, 10) || 0);
          if (g('out')) b.isOut = g('out').value === 'out';
          if (g('dis')) b.dismissalText = g('dis').value.trim() || (b.isOut ? 'out' : 'not out');
        });
        const ge = id => document.getElementById(id);
        if (ge('ed-ex-wd')) inn.extras.wd = Math.max(0, parseInt(ge('ed-ex-wd').value, 10) || 0);
        if (ge('ed-ex-nb')) inn.extras.nb = Math.max(0, parseInt(ge('ed-ex-nb').value, 10) || 0);
        if (ge('ed-ex-b')) inn.extras.b = Math.max(0, parseInt(ge('ed-ex-b').value, 10) || 0);
        if (ge('ed-ex-lb')) inn.extras.lb = Math.max(0, parseInt(ge('ed-ex-lb').value, 10) || 0);
        inn.extras.total = inn.extras.wd + inn.extras.nb + inn.extras.b + inn.extras.lb;
        if (ge('ed-inn-runs')) inn.runs = Math.max(0, parseInt(ge('ed-inn-runs').value, 10) || 0);
        if (ge('ed-inn-wkts')) inn.wickets = Math.max(0, Math.min(10, parseInt(ge('ed-inn-wkts').value, 10) || 0));
        if (ge('ed-inn-overs')) inn.legalBalls = parseOversToBalls(ge('ed-inn-overs').value);
      } else if (es.tab === 'bowlers') {
        const inn = d.innings[es.innIdx];
        inn.bowlers.forEach((bw, idx) => {
          const g = p => document.getElementById('ed-bwl-' + p + '-' + idx);
          if (g('name')) bw.name = g('name').value.trim() || bw.name;
          if (g('o')) bw.legalBalls = parseOversToBalls(g('o').value);
          if (g('m')) bw.maidens = Math.max(0, parseInt(g('m').value, 10) || 0);
          if (g('r')) bw.runsConceded = Math.max(0, parseInt(g('r').value, 10) || 0);
          if (g('w')) bw.wickets = Math.max(0, parseInt(g('w').value, 10) || 0);
        });
      }
    }

    async function saveEditMatchChanges() {
      const es = state.editState;
      if (!es) return;
      syncEditInputsToDraft();
      const updated = sanitizeMatch(es.draft);
      if (!updated) return;

      updated.innings.forEach(inn => {
        if (inn.batters.length > 0) {
          if (!getBatter(inn, inn.strikerId)) {
            const notOut = inn.batters.find(b => !b.isOut);
            inn.strikerId = notOut ? notOut.id : inn.batters[0].id;
          }
          if (!getBatter(inn, inn.nonStrikerId) || inn.nonStrikerId === inn.strikerId) {
            const other = inn.batters.find(b => !b.isOut && b.id !== inn.strikerId);
            inn.nonStrikerId = other ? other.id : null;
          }
        }
        if (inn.bowlers.length > 0 && !getBowler(inn, inn.currentBowlerId)) {
          inn.currentBowlerId = inn.bowlers[0].id;
        }
      });

      state.editState = null;
      await persistMatch(updated);
      closeModal();
      render();
      showToast('Match details saved!');
    }

    function openModal(html, wide) {

      const box = document.getElementById('modal-box');
      if (!backdrop || !box) return;
      box.className = 'modal-box' + (wide ? ' wide' : '');
      box.innerHTML = html;
      backdrop.classList.add('open');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      if (backdrop) backdrop.classList.remove('open');
      state.editState = null;
    }

    function openExtraModal(type) {
      const titles = { wd: 'Wide Ball (WD)', nb: 'No Ball (NB)', b: 'Byes (B)', lb: 'Leg Byes (LB)' };
      const isPenalty = type === 'wd' || type === 'nb';
      const opts = isPenalty ? [0, 1, 2, 3, 4, 6] : [1, 2, 3, 4];

      openModal(
        '<div class="modal-head"><div style="font-size:15.5px; font-weight:800;">' + titles[type] + '</div><button type="button" class="icon-btn" data-action="close-modal">' + ICONS.close + '</button></div>' +
        '<div class="modal-scroll">' +
          (type === 'nb'
            ? '<div style="background:var(--bg-input); border:1px solid var(--border); border-radius:12px; padding:10px 12px;"><div class="field-label" style="margin-bottom:6px;">Additional Runs Source</div><div class="info-grid"><label class="row text-xs font-bold"><input type="radio" name="nb-source" value="bat" checked /> Off the Bat</label><label class="row text-xs font-bold"><input type="radio" name="nb-source" value="bye" /> Byes / Leg Byes</label></div></div>'
            : '') +
          '<div class="text-xs muted font-bold">' + (isPenalty ? 'Select additional runs (+1 penalty run):' : 'Select runs scored:') + '</div>' +

    function compactPlayerName(name) {
      const clean = String(name || '').trim();
      const parts = clean.split(/\s+/);
      if (parts.length <= 1 || clean.length <= 14) return clean;
      return parts[0].charAt(0).toUpperCase() + '. ' + parts.slice(1).join(' ');
    }

    function getEquation(match) {
      const i1 = match.innings[0], i2 = match.innings[1];
      if (match.status === 'completed') return { emoji: '🏆', text: match.resultText || computeAutoResult(match) };
      if (match.status === 'innings_break') return { emoji: '🎯', text: i2.battingTeam + ' need ' + (i1.runs + 1) + ' runs in ' + match.oversPerInnings + ' overs' };
      if (match.currentInningsIndex === 1) {
        const needed = Math.max(0, (i1.runs + 1) - i2.runs);
        const ballsLeft = Math.max(0, (match.oversPerInnings * 6) - i2.legalBalls);
        const rrr = ballsLeft > 0 ? ((needed / ballsLeft) * 6).toFixed(2) : '—';
        return { emoji: '🔥', text: i2.battingTeam + ' need ' + needed + ' run' + (needed !== 1 ? 's' : '') + ' in ' + ballsLeft + ' ball' + (ballsLeft !== 1 ? 's' : '') + ' (RRR: ' + rrr + ')' };
      }
      return { emoji: '🔴', text: '1st Innings Live • CRR: ' + calcRunRate(i1.runs, i1.legalBalls) };
    }

    function getTopPerformers(inn, isLive) {
      let batters = [];
      if (isLive) {
        const activeIds = [inn.strikerId, inn.nonStrikerId].filter(Boolean);
        const active = activeIds.map(id => getBatter(inn, id)).filter(Boolean);
        const restBat = inn.batters.filter(b => !activeIds.includes(b.id)).sort((a, b) => (b.runs - a.runs) || (a.balls - b.balls));
        batters = active.concat(restBat).slice(0, 2);
      } else {
        batters = inn.batters.slice().sort((a, b) => (b.runs - a.runs) || (a.balls - b.balls)).slice(0, 2);
      }

      let bowlers = [];
      if (isLive && inn.currentBowlerId) {
        const curr = getBowler(inn, inn.currentBowlerId);
        const restBwl = inn.bowlers.filter(b => b.id !== inn.currentBowlerId).sort((a, b) => (b.wickets - a.wickets) || (a.runsConceded - b.runsConceded));
        bowlers = (curr ? [curr].concat(restBwl) : restBwl).slice(0, 2);
      } else {
        bowlers = inn.bowlers.slice().sort((a, b) => (b.wickets - a.wickets) || (a.runsConceded - b.runsConceded)).slice(0, 2);
      }
      return { batters, bowlers };
    }

    function buildQuickWhatsApp(match) {
      const DIV = '──────────────';
      const i1 = match.innings[0], i2 = match.innings[1];
      const eq = getEquation(match);
      const hasInn2 = i2.legalBalls > 0 || i2.runs > 0 || match.currentInningsIndex === 1;

      const lines = [
        '🏏 *Tamarind Cricket Players (TCP)*',
        '*' + match.title.toUpperCase() + '*',
        '📍 _' + match.venue + ' • ' + match.date + '_',
        DIV,
        '*' + i1.battingTeam.toUpperCase() + ':* *' + i1.runs + '/' + i1.wickets + '* (' + formatOvers(i1.legalBalls) + ' ov)'
      ];
      if (hasInn2) lines.push('*' + i2.battingTeam.toUpperCase() + ':* *' + i2.runs + '/' + i2.wickets + '* (' + formatOvers(i2.legalBalls) + ' ov)');
      lines.push('');
      lines.push(eq.emoji + ' *' + eq.text + '*');

      if (match.status === 'live') {
        const activeInn = match.innings[match.currentInningsIndex];
        if (activeInn.partnership.balls > 0 || activeInn.partnership.runs > 0) {
          lines.push('🤝 Partnership: ' + activeInn.partnership.runs + ' (' + activeInn.partnership.balls + ')');
        }
        if (activeInn.currentOverBalls.length > 0) {
          lines.push('🎯 This Over: ' + activeInn.currentOverBalls.map(b => b.label).join(' '));
        } else if (activeInn.oversLog.length > 0) {
          const last = activeInn.oversLog[0];
          lines.push('🎯 Last Over (' + last.overNum + '): ' + last.balls.map(b => b.label).join(' ') + ' (' + last.runsInOver + 'r)');
        }
      }

      lines.push(DIV);
      function pushHighlights(inn, isLive) {
        const top = getTopPerformers(inn, isLive);
        if (top.batters.length > 0) {
          lines.push('*Batting (' + inn.battingTeam + '):*');
          top.batters.forEach(b => {
            const notOut = !b.isOut ? '✱' : '';
            const bdry = (b.fours > 0 || b.sixes > 0) ? ' _(' + b.fours + '×4, ' + b.sixes + '×6)_' : '';
            lines.push('• *' + compactPlayerName(b.name) + notOut + '* — ' + b.runs + ' (' + b.balls + ')' + bdry);
          });
        }
        if (top.bowlers.length > 0) {
          lines.push('');
          lines.push('*Bowling (' + inn.bowlingTeam + '):*');
          top.bowlers.forEach(bw => {
            lines.push('• *' + compactPlayerName(bw.name) + '* — ' + formatOvers(bw.legalBalls) + '-' + bw.maidens + '-' + bw.runsConceded + '-' + bw.wickets + ' _(Econ ' + calcEconomy(bw.runsConceded, bw.legalBalls) + ')_');
          });
        }
      }

      if (match.status === 'completed' && hasInn2) {
        pushHighlights(i1, false);
        lines.push(DIV);
        pushHighlights(i2, false);
      } else {
        pushHighlights(match.innings[match.currentInningsIndex], match.status === 'live');
      }

      lines.push(DIV);
      lines.push('_Scored via Tamarind Cricket Players (TCP)_');
      return lines.join('\n');
    }

    function buildFullWhatsApp(match) {
      const DIV = '──────────────';
      const eq = getEquation(match);
      const lines = [
        '🏏 *Tamarind Cricket Players (TCP)*',
        '*' + match.title.toUpperCase() + '*',
        '📍 _' + match.venue + ' • ' + match.date + ' • ' + match.oversPerInnings + ' Overs_',
        '🪙 _Toss: ' + match.tossWinner + ' elected to ' + match.tossDecision + '_',
        eq.emoji + ' *' + eq.text + '*'
      ];

      match.innings.forEach((inn, idx) => {
        if (inn.batters.length === 0 && inn.legalBalls === 0 && inn.runs === 0) return;
        lines.push('');
        lines.push(DIV);
        lines.push('📋 *' + (idx === 0 ? '1ST' : '2ND') + ' INNINGS — ' + inn.battingTeam.toUpperCase() + '*');
        lines.push('*Total: ' + inn.runs + '/' + inn.wickets + '* _(' + formatOvers(inn.legalBalls) + ' ov | RR: ' + calcRunRate(inn.runs, inn.legalBalls) + ')_');
        lines.push('');
        lines.push('*BATTING:*');
        inn.batters.forEach(b => {
          lines.push('• *' + b.name + (!b.isOut ? '✱' : '') + '* — ' + b.runs + ' (' + b.balls + ') | 4s: ' + b.fours + ', 6s: ' + b.sixes);
          if (b.isOut && b.dismissalText) lines.push('  _' + b.dismissalText + '_');
        });
        lines.push('• *Extras:* ' + inn.extras.total + ' _(wd ' + inn.extras.wd + ', nb ' + inn.extras.nb + ', b ' + inn.extras.b + ', lb ' + inn.extras.lb + ')_');
        if (inn.fow.length > 0) {
          lines.push('');
          lines.push('*FALL OF WICKETS:*');
          lines.push('_' + inn.fow.map(f => f.wicketNum + '-' + f.runs + ' (' + compactPlayerName(f.batterName) + ', ' + f.overs + ')').join(' • ') + '_');
        }
        if (inn.bowlers.length > 0) {
          lines.push('');
          lines.push('*BOWLING (' + inn.bowlingTeam + '):*');
          inn.bowlers.forEach(bw => {
            lines.push('• *' + bw.name + '* — ' + formatOvers(bw.legalBalls) + '-' + bw.maidens + '-' + bw.runsConceded + '-' + bw.wickets + ' | Econ: ' + calcEconomy(bw.runsConceded, bw.legalBalls));
          });
        }
      });

      lines.push(DIV);
      lines.push('_Scored via Tamarind Cricket Players (TCP)_');
      return lines.join('\n');
    }

    function copyTextToClipboard(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { showToast('Copied for WhatsApp!'); return; }
      } catch (e) { /* fallback */ }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied for WhatsApp!')).catch(() => showToast('Could not copy', true));
      }
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
    }

    function drawScorecardCanvas(match) {
      const canvas = document.getElementById('share-scorecard-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = 1080, H = 1350;

      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#020617'); bg.addColorStop(0.55, '#0f172a'); bg.addColorStop(1, '#064e3b');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.09)'; ctx.lineWidth = 3;
      roundRectPath(ctx, 32, 32, W - 64, H - 64, 36); ctx.stroke();

      ctx.fillStyle = '#10b981'; roundRectPath(ctx, 72, 76, 62, 52, 14); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.font = '900 24px -apple-system, BlinkMacSystemFont, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('TCP', 103, 110);

      ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff'; ctx.font = '800 25px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText('TAMARIND CRICKET PLAYERS (TCP)', 150, 112);

      const sLabel = match.status === 'completed' ? 'FINAL RESULT' : (match.status === 'innings_break' ? 'INNINGS BREAK' : 'LIVE MATCH');
      ctx.fillStyle = match.status === 'completed' ? 'rgba(56, 189, 248, 0.22)' : 'rgba(16, 185, 129, 0.22)';

      const canvas = document.getElementById('share-scorecard-canvas');

      try {

        link.download = 'TCP_Scorecard.png';
        link.href = canvas.toDataURL('image/png');

    function shareCanvasPng() {
      const canvas = document.getElementById('share-scorecard-canvas');
      const match = getMatchById(state.shareMatchId) || getActiveMatch();
      if (!canvas || !match) return;
      canvas.toBlob(blob => {
        if (!blob) { downloadCanvasPng(); return; }
        try {
          const file = new File([blob], 'TCP_Scorecard.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ title: 'TCP — ' + match.title, text: '🏏 Tamarind Cricket Players (TCP) — ' + match.title, files: [file] })
              .catch(err => { if (err && err.name !== 'AbortError') downloadCanvasPng(); });
          } else { downloadCanvasPng(); }
        } catch (e) { downloadCanvasPng(); }
      }, 'image/png');
    }

    /*************************************************************************
     * 12. JSON BACKUP & TOAST
     *************************************************************************/
    function exportHistoryJson() {
      if (state.matches.length === 0) { showToast('No matches to export', true); return; }
      try {
        const blob = new Blob([JSON.stringify(state.matches, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'tcp_cricket_matches_backup.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Exported ' + state.matches.length + ' match(es)');
      } catch (err) { showToast('Export failed', true); }
    }

    function handleImportFile(file) {
      if (!file || !isAdmin()) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const parsed = JSON.parse(String(reader.result || ''));
          const list = Array.isArray(parsed) ? parsed : [parsed];
          const valid = list.map(sanitizeMatch).filter(Boolean);
          if (valid.length === 0) { showToast('No valid matches in file', true); return; }
          for (const m of valid) await persistMatch(m);
          if (!state.activeMatchId && state.matches.length > 0) state.activeMatchId = state.matches[0].id;
          render();
          showToast('Imported ' + valid.length + ' match(es)');
        } catch (err) { showToast('Invalid JSON file', true); }
      };
      reader.readAsText(file);
    }

    function showToast(msg, isError) {
      const el = document.getElementById('toast');
      const txt = document.getElementById('toast-msg');
      if (!el || !txt) return;

      el.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

        if (!fb.auth || !fb.api) return;

          if (state.authMode === 'signup') {

        if (!isAdmin()) return;
        const t1 = String(setupDraft.team1 || '').trim() || 'Team A';

        const tossWin = setupDraft.tossWinner === 'team1' ? t1 : t2;
        const other = setupDraft.tossWinner === 'team1' ? t2 : t1;
        const batFirst = setupDraft.tossDecision === 'bat' ? tossWin : other;
        const bowlFirst = batFirst === t1 ? t2 : t1;

        const i1 = createEmptyInnings(batFirst, bowlFirst);
        const i2 = createEmptyInnings(bowlFirst, batFirst);
        const s = addBatter(i1, setupDraft.striker);
        const ns = addBatter(i1, setupDraft.nonStriker);
        const bw = findOrCreateBowler(i1, setupDraft.bowler);
        i1.strikerId = s.id; i1.nonStrikerId = ns.id; i1.currentBowlerId = bw.id;

        const match = {
          id: uid('match'),
          title: String(setupDraft.title || '').trim() || (t1 + ' vs ' + t2),
          venue: String(setupDraft.venue || '').trim() || 'Tamarind Cricket Ground',
          date: setupDraft.date || todayStr,
          oversPerInnings: Math.max(1, parseInt(setupDraft.overs, 10) || 20),
          team1: t1, team2: t2, tossWinner: tossWin, tossDecision: setupDraft.tossDecision,
          status: 'live', resultText: '', currentInningsIndex: 0,
          innings: [i1, i2], createdAt: Date.now(), updatedAt: Date.now()
        };

        state.activeMatchId = match.id;
        state.currentTab = 'live';
        setupDraft = createDefaultDraft();
        await persistMatch(match);
        render();
        showToast('Match started!');
      } else if (form.id === 'wicket-form') {
        const m = getActiveMatch();
        if (!m || !isAdmin()) return;
        const inn = m.innings[m.currentInningsIndex];
        const dType = document.getElementById('wkt-type').value;
        const fielder = (document.getElementById('wkt-fielder') || {}).value || '';
        const outBatterId = dType === 'Run Out' ? ((document.getElementById('wkt-batter') || {}).value || inn.strikerId) : inn.strikerId;
        const runsOffBat = dType === 'Run Out' ? (parseInt((document.getElementById('wkt-runs') || {}).value, 10) || 0) : 0;
        const nextBat = (document.getElementById('wkt-next') || {}).value || '';
        closeModal();
        await recordBall({ isWicket: true, runsOffBat, dismissalType: dType, fielderName: fielder, outBatterId, nextBatterName: nextBat });
      } else if (form.id === 'bowler-form') {
        const m = getActiveMatch();
        if (!m || !isAdmin()) return;
        const inn = m.innings[m.currentInningsIndex];
        const bwl = findOrCreateBowler(inn, (document.getElementById('new-bowler-name') || {}).value || '');
        inn.currentBowlerId = bwl.id;
        await persistMatch(m);
        closeModal(); render(); showToast(bwl.name + ' into the attack');
      } else if (form.id === 'second-inn-form') {
        const m = getActiveMatch();
        if (!m || !isAdmin()) return;
        pushUndo(m);
        const i2 = m.innings[1];
        const s2 = addBatter(i2, document.getElementById('i2-striker').value);
        const ns2 = addBatter(i2, document.getElementById('i2-nonstriker').value);
        const bw2 = findOrCreateBowler(i2, document.getElementById('i2-bowler').value);
        i2.strikerId = s2.id; i2.nonStrikerId = ns2.id; i2.currentBowlerId = bw2.id;
        m.currentInningsIndex = 1; m.status = 'live';
        await persistMatch(m);
        closeModal(); render(); showToast('2nd Innings underway!');
      } else if (form.id === 'rename-form') {
        const m = getActiveMatch();
        if (!m || !isAdmin()) return;
        const inn = m.innings[m.currentInningsIndex];
        const player = form.getAttribute('data-role') === 'batter' ? getBatter(inn, form.getAttribute('data-id')) : getBowler(inn, form.getAttribute('data-id'));
        const newName = ((document.getElementById('rename-input') || {}).value || '').trim();
        if (player && newName) {
          player.name = newName;
          await persistMatch(m);
          closeModal(); render(); showToast('Name updated');
        }
      }
    });

    /*************************************************************************
     * 14. CRASH-PROOF STARTUP
     *************************************************************************/
    initFirebaseIfConfigured();
  </script>
</body>
</html>
