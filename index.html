<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tamarind Cricket Players (TCP) — Cricket Scorer</title>
  <style>
    /* =========================================================================
       TAMARIND CRICKET PLAYERS (TCP) — DARK BROADCAST THEME
       100% Self-Contained CSS (Zero External CDNs, Zero External Fonts)
       ========================================================================= */
    :root {
      --bg-page: #0b1120;
      --bg-card: #111827;
      --bg-card-2: #1a2335;
      --bg-input: #0d1526;
      --bg-subtle: #1f2937;
      --border: #243045;
      --border-light: #334155;
      --text-main: #f8fafc;
      --text-sec: #cbd5e1;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --emerald-dark: #059669;
      --emerald-bg: rgba(16, 185, 129, 0.14);
      --emerald-border: rgba(16, 185, 129, 0.36);
      --amber: #f59e0b;
      --amber-bright: #fbbf24;
      --amber-bg: rgba(245, 158, 11, 0.16);
      --amber-border: rgba(245, 158, 11, 0.36);
      --rose: #e11d48;
      --rose-bright: #fb7185;
      --rose-bg: rgba(225, 29, 72, 0.16);
      --rose-border: rgba(225, 29, 72, 0.38);
      --sky: #38bdf8;
      --sky-bg: rgba(56, 189, 248, 0.16);
      --indigo-bg: rgba(99, 102, 241, 0.22);
      --indigo-text: #a5b4fc;
      --indigo-border: rgba(129, 140, 248, 0.38);
      --wa-green: #25d366;
      --wa-green-dark: #1ebe5d;
      --wa-bubble: #005c4b;
      --wa-bubble-border: #0a725e;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.4;
      overscroll-behavior-y: none;
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ==================== STATIC STICKY COMPACT HEADER ==================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 17, 32, 0.97);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .header-inner {
      max-width: 780px;
      margin: 0 auto;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .brand-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      text-align: left;
      min-width: 0;
      flex-shrink: 1;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, #10b981, #047857);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.35);
      flex-shrink: 0;
    }

    .brand-text-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-top-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .brand-title {
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.02em;
      line-height: 1.05;
      color: var(--emerald-bright);
    }

    .brand-sub {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-sec);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 118px;
      margin-top: 1px;
    }

    .save-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 8.5px;
      font-weight: 700;
      color: var(--emerald-bright);
      background: var(--emerald-bg);
      border: 1px solid var(--emerald-border);
      padding: 1px 5px;
      border-radius: 999px;
      line-height: 1.25;
      flex-shrink: 0;
    }

    .save-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--emerald-bright);
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--bg-card);
      padding: 3px;
      border-radius: 11px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .nav-tab {
      padding: 6px 7px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .nav-tab:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-tab.active {
      background: var(--emerald-dark);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
    }

    .nav-tab svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    .nav-badge {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 999px;
      min-width: 16px;
      text-align: center;
      line-height: 1.3;
    }

    .nav-tab.active .nav-badge {
      background: rgba(0, 0, 0, 0.25);
    }

    @media (max-width: 410px) {
      .header-inner { padding: 7px 8px; gap: 4px; }
      .brand-icon { width: 26px; height: 26px; border-radius: 8px; }
      .brand-title { font-size: 13px; }
      .brand-sub { font-size: 8px; max-width: 90px; }
      .save-pill { font-size: 8px; padding: 1px 4px; }
      .nav-tab { padding: 5px 6px; font-size: 10.5px; gap: 3px; }
      .nav-tab svg { display: none; }
    }

    /* ==================== MAIN LAYOUT & UTILITIES ==================== */
    .app-main {
      max-width: 780px;
      margin: 0 auto;
      padding: 12px 10px 80px;
    }

    .stack { display: flex; flex-direction: column; gap: 12px; }
    .stack-sm { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .hidden { display: none !important; }

    .text-xs { font-size: 11.5px; }
    .text-sm { font-size: 13px; }
    .text-center { text-align: center; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .muted { color: var(--text-muted); }
    .text-emerald { color: var(--emerald-bright); }
    .text-amber { color: var(--amber-bright); }
    .text-rose { color: var(--rose-bright); }

    /* ==================== CARDS & BROADCAST SCOREBOARD ==================== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .card-pad { padding: 14px; }

    .card-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255, 255, 255, 0.02);
    }

    .card-header-title {
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .scoreboard {
      background: linear-gradient(145deg, #13203b 0%, #0f172a 55%, #073b2f 100%);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sb-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sb-match-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-sec);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .sb-main {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
    }

    .sb-team {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
    }

    .sb-score-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 2px;
    }

    .sb-score {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #ffffff;
    }

    .sb-overs {
      font-size: 13px;
      font-weight: 700;
      color: var(--emerald-bright);
    }

    .sb-crr-box {
      background: rgba(11, 17, 32, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 6px 11px;
      text-align: center;
      flex-shrink: 0;
    }

    .sb-crr-label {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .sb-crr-val {
      font-size: 17px;
      font-weight: 900;
      color: var(--emerald-bright);
      line-height: 1.15;
    }

    .sb-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
      color: var(--text-sec);
    }

    .target-pill {
      background: var(--amber-bg);
      color: var(--amber-bright);
      border: 1px solid var(--amber-border);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }

    /* ==================== BADGES & BANNERS ==================== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .badge-live { background: var(--emerald-bg); color: var(--emerald-bright); border: 1px solid var(--emerald-border); }
    .badge-break { background: var(--amber-bg); color: var(--amber-bright); border: 1px solid var(--amber-border); }
    .badge-done { background: var(--sky-bg); color: var(--sky); border: 1px solid rgba(56, 189, 248, 0.35); }
    .badge-active-match { background: var(--indigo-bg); color: var(--indigo-text); border: 1px solid var(--indigo-border); }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald-bright);
      animation: pulse-dot 1.4s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .banner {
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .banner-amber { background: var(--amber-bg); border: 1px solid var(--amber-border); }
    .banner-emerald { background: var(--emerald-bg); border: 1px solid var(--emerald-border); }
    .banner-error { background: var(--rose-bg); border: 1px solid var(--rose-border); color: #ffe4e6; border-radius: var(--radius-md); padding: 14px; }

    /* ==================== INFO PILLS ==================== */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .info-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .info-pill-label { font-size: 11px; font-weight: 700; color: var(--text-muted); }
    .info-pill-val { font-size: 13px; font-weight: 800; color: var(--text-main); }
    .info-pill-val span { font-size: 11px; font-weight: 600; color: var(--text-muted); }

    /* ==================== BUTTONS ==================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .btn-sm { padding: 8px 12px; font-size: 12.5px; border-radius: 10px; }
    .btn-xs { padding: 5px 9px; font-size: 11.5px; border-radius: 8px; gap: 4px; }
    .btn-full { width: 100%; }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-subtle {
      background: var(--bg-subtle);
      color: var(--text-main);
      border: 1px solid var(--border-light);
    }

    .btn-emerald-soft {
      background: var(--emerald-bg);
      color: var(--emerald-bright);
      border: 1px solid var(--emerald-border);
    }

    .btn-rose {
      background: var(--rose);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
    }

    .btn-wa {
      background: var(--wa-green);
      color: #052e16;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.28);
    }

    .btn-wa-soft {
      background: rgba(37, 211, 102, 0.14);
      color: #4ade80;
      border: 1px solid rgba(37, 211, 102, 0.35);
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }

    .icon-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.1); }

    /* ==================== TABLES ==================== */
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }

    thead th {
      text-align: left;
      padding: 8px 10px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody td {
      padding: 9px 10px;
      border-bottom: 1px solid rgba(36, 48, 69, 0.7);
      vertical-align: middle;
    }

    tbody tr:last-child td { border-bottom: none; }
    th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .striker-row { background: rgba(16, 185, 129, 0.07); }
    .player-cell { display: flex; align-items: center; gap: 6px; min-width: 110px; }
    .striker-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--emerald-bright); flex-shrink: 0; box-shadow: 0 0 8px rgba(52, 211, 153, 0.8); }
    .nonstriker-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-light); flex-shrink: 0; }
    .player-name { font-weight: 700; color: var(--text-main); }
    .player-name-btn { font-weight: 700; color: var(--text-main); text-align: left; padding: 2px 0; }
    .player-name-btn:hover { color: var(--emerald-bright); }
    .player-dismissal { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

    /* ==================== THIS OVER PILLS ==================== */
    .over-strip {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(11, 17, 32, 0.45);
    }

    .over-strip-label {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .ball-pills { display: flex; align-items: center; gap: 5px; overflow-x: auto; padding-bottom: 1px; }
    .ball-pills-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }

    .ball-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 27px;
      height: 27px;
      padding: 0 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .pill-dot { background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border-light); }
    .pill-run { background: #1e3a5f; color: #e0f2fe; border: 1px solid rgba(56, 189, 248, 0.35); }
    .pill-four { background: var(--emerald-dark); color: #ffffff; }
    .pill-six { background: #7c3aed; color: #ffffff; }
    .pill-wicket { background: var(--rose); color: #ffffff; }
    .pill-extra { background: var(--amber-bg); color: var(--amber-bright); border: 1px solid var(--amber-border); }

    /* ==================== SCORING KEYPAD ==================== */
    .keypad-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-shadow: var(--shadow-sm);
    }

    .keypad-runs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }

    .key-run {
      height: 50px;
      border-radius: 13px;
      background: var(--bg-card-2);
      border: 1px solid var(--border-light);
      color: var(--text-main);
      font-size: 19px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .key-four { background: rgba(16, 185, 129, 0.22); border-color: var(--emerald); color: var(--emerald-bright); }
    .key-six { background: rgba(124, 58, 237, 0.24); border-color: #8b5cf6; color: #ddd6fe; }

    .keypad-extras { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }

    .key-extra {
      height: 42px;
      border-radius: 11px;
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      color: var(--amber-bright);
      font-size: 12.5px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .key-bye { background: var(--sky-bg); border-color: rgba(56, 189, 248, 0.35); color: var(--sky); }
    .key-out { background: var(--rose); border-color: #f43f5e; color: #ffffff; box-shadow: 0 3px 10px rgba(225, 29, 72, 0.35); }
    .keypad-utils { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }

    /* ==================== FORMS & INPUTS ==================== */
    .field-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; }
    .mini-label { display: block; font-size: 10px; font-weight: 700; color: var(--text-dim); margin-bottom: 3px; }

    .field-input, .field-select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 13.5px;
      color: var(--text-main);
      outline: none;
    }

    .field-input:focus, .field-select:focus {
      border-color: var(--emerald);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.22);
    }

    .field-input-sm { padding: 7px 9px; font-size: 12.5px; border-radius: 9px; }

    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    @media (max-width: 520px) {
      .form-grid-3 { grid-template-columns: 1fr; }
    }

    .pill-choice {
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border-light);
      color: var(--text-sec);
      font-size: 12.5px;
      font-weight: 800;
      text-align: center;
    }

    .pill-choice.active {
      background: var(--emerald-bg);
      border-color: var(--emerald);
      color: var(--emerald-bright);
    }

    /* ==================== SEGMENTED TABS & FILTER CHIPS ==================== */
    .seg-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
    }

    .seg-tabs-2 { grid-template-columns: repeat(2, 1fr); }

    .seg-tab {
      padding: 8px 6px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .seg-tab.active { background: var(--emerald-dark); color: #ffffff; }

    .filter-chip {
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--bg-input);
      border: 1px solid var(--border-light);
      color: var(--text-muted);
    }

    .filter-chip.active { background: var(--emerald-bg); border-color: var(--emerald); color: var(--emerald-bright); }

    /* ==================== EDIT MATCH PLAYER CARDS ==================== */
    .edit-player-card {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .edit-stats-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .edit-stats-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

    /* ==================== MODALS ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(2, 6, 23, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 18px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-box.wide { max-width: 560px; }

    .modal-head {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .modal-scroll {
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .modal-foot {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(11, 17, 32, 0.45);
      flex-shrink: 0;
    }

    /* ==================== WHATSAPP PREVIEW & CANVAS ==================== */
    .wa-wallpaper {
      background: #0b141a;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 10px;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .wa-bubble-wrap { display: flex; justify-content: flex-end; }

    .wa-bubble {
      background: var(--wa-bubble);
      border: 1px solid var(--wa-bubble-border);
      color: #e9edef;
      border-radius: 12px 2px 12px 12px;
      padding: 10px 12px 6px;
      font-size: 12.5px;
      line-height: 1.45;
      max-width: 96%;
      word-break: break-word;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .wa-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      font-size: 10px;
      color: rgba(233, 237, 239, 0.65);
      margin-top: 4px;
    }

    .canvas-stage {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      display: flex;
      justify-content: center;
    }

    #share-scorecard-canvas {
      width: 100%;
      max-width: 340px;
      height: auto;
      border-radius: 10px;
      display: block;
    }

    /* ==================== TOAST NOTIFICATION ==================== */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translate(-50%, 16px);
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid var(--emerald);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 800;
      box-shadow: var(--shadow-md);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 90;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { border-color: var(--rose); color: #ffe4e6; }
  </style>
</head>
<body>

  <!-- ==================== STATIC ALWAYS-VISIBLE STICKY HEADER ==================== -->
  <header class="app-header">
    <div class="header-inner">

  <!-- ==================== MAIN CONTENT CONTAINER ==================== -->
  <main id="app-main" class="app-main">
    <div class="card card-pad text-center muted text-sm">Loading Tamarind Cricket Players (TCP)...</div>
  </main>

  <!-- Hidden file input for JSON History Import -->
  <input id="import-json-input" type="file" accept=".json,application/json" class="hidden" />

  <!-- ==================== MODAL OVERLAY ==================== -->

  <!-- ==================== TOAST NOTIFICATION ==================== -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toast-msg">Done</span>
  </div>

  <!-- ==================== SINGLE SYNCHRONOUS SCRIPT (ZERO EXTERNAL DEPS) ==================== -->
  <script>
    (function () {
      'use strict';

      /***********************************************************************
       * 1. SAFE STORAGE (LOCALSTORAGE + IN-MEMORY FALLBACK)
       ***********************************************************************/
      var STORAGE_KEY = 'tcp_cricket_matches';
      var LEGACY_KEYS = ['cricpulse_matches', 'cricpulse_v2_matches', 'cricpulse_matches_v2', 'cricpulse_matches_v1'];
      var ACTIVE_KEY = 'tcp_cricket_active_v1';
      var LEGACY_ACTIVE_KEY = 'cricpulse_active_v2';
      var memoryStore = {};
      var storageMode = 'Saved';

      function safeGetItem(key) {
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            return window.localStorage.getItem(key);
          }
        } catch (e) {
          storageMode = 'Session';
        }
        return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null;
      }

      function safeSetItem(key, val) {
        memoryStore[key] = val;
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            window.localStorage.setItem(key, val);
            storageMode = 'Saved';
          }
        } catch (e) {
          storageMode = 'Session';
        }
      }

      function safeRemoveItem(key) {
        delete memoryStore[key];
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            window.localStorage.removeItem(key);
          }
        } catch (e) { /* ignore */ }
      }

      function setSaveStatus(text) {
        var el = document.getElementById('save-status-text');
        if (el) el.textContent = text;
      }

      /***********************************************************************
       * 2. INLINE SVG ICONS
       ***********************************************************************/
      var ICONS = {
        wa: '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.03 2C6.51 2 2.02 6.49 2.02 12.02c0 1.76.46 3.49 1.34 5.01L2 22l5.11-1.34a9.97 9.97 0 0 0 4.92 1.3h.01c5.52 0 10.01-4.49 10.01-10.02A9.96 9.96 0 0 0 12.03 2zm5.82 14.23c-.25.69-1.43 1.33-1.98 1.41-.5.07-1.16.11-1.87-.12-.43-.14-.98-.32-1.69-.63-2.98-1.29-4.92-4.29-5.07-4.49-.15-.2-1.21-1.61-1.21-3.07 0-1.46.77-2.18 1.04-2.48.27-.3.59-.37.79-.37h.57c.18.01.43-.07.67.51.25.6.84 2.06.92 2.21.07.15.12.32.02.52-.1.2-.15.32-.3.5-.15.17-.31.39-.45.52-.15.15-.3.31-.13.61.17.3.77 1.27 1.65 2.06 1.14 1.01 2.1 1.33 2.39 1.48.3.15.47.12.64-.07.17-.2.74-.87.94-1.17.2-.3.4-.25.67-.15.27.1 1.73.82 2.03.97.3.15.5.22.57.35.08.12.08.72-.17 1.41z"/></svg>',
        edit: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>',
        swap: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/></svg>',
        refresh: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>',
        undo: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M9 14L4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>',
        flag: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>',
        copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
        share: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>',
        download: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
        upload: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
        trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
        close: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
        play: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>',
        spark: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/></svg>',
        plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
        trophy: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>'
      };

      /***********************************************************************
       * 3. STATE & DATA SANITIZATION
       ***********************************************************************/
      var todayStr = (function () {
        try {
          return new Date().toISOString().split('T')[0];
        } catch (e) {
          return '2026-11-22';
        }
      })();

      var state = {
        matches: [],
        activeMatchId: null,
        currentTab: 'setup',      // 'live' | 'scorecard' | 'setup' | 'history'
        scorecardSubTab: 0,       // 0 = 1st Inn, 1 = 2nd Inn, 2 = Over Log
        historySearch: '',
        historyFilter: 'all',     // 'all' | 'live' | 'completed'
        shareTab: 'quick',        // 'quick' | 'full' | 'image'
        shareMatchId: null,
        editState: null,          // { matchId, tab: 'info'|'batters'|'bowlers', innIdx: 0|1, draft: Match }
        undoStacks: {}
      };

      function createDefaultDraft() {
        return {
          title: '',
          venue: '',
          date: todayStr,
          team1: 'TCP Strikers',
          team2: 'TCP Challengers',
          overs: 20,
          tossWinner: 'team1',
          tossDecision: 'bat',
          striker: 'Rohit Sharma',
          nonStriker: 'Shubman Gill',
          bowler: 'Jasprit Bumrah'
        };
      }

      var setupDraft = createDefaultDraft();

      function uid(prefix) {
        return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      function createEmptyInnings(battingTeam, bowlingTeam) {
        return {
          battingTeam: String(battingTeam || 'Team A'),
          bowlingTeam: String(bowlingTeam || 'Team B'),
          runs: 0,
          wickets: 0,
          legalBalls: 0,
          extras: { wd: 0, nb: 0, b: 0, lb: 0, total: 0 },
          batters: [],
          bowlers: [],
          strikerId: null,
          nonStrikerId: null,
          currentBowlerId: null,
          partnership: { runs: 0, balls: 0 },
          fow: [],
          currentOverBalls: [],
          oversLog: [],
          commentary: []
        };
      }

      function sanitizeMatch(m) {
        if (!m || typeof m !== 'object') return null;
        if (!Array.isArray(m.innings) || m.innings.length < 2) return null;

        function cleanInn(inn, fallbackBat, fallbackBowl) {
          var base = createEmptyInnings((inn && inn.battingTeam) || fallbackBat, (inn && inn.bowlingTeam) || fallbackBowl);
          if (!inn || typeof inn !== 'object') return base;
          var wd = Number(inn.extras && inn.extras.wd) || 0;
          var nb = Number(inn.extras && inn.extras.nb) || 0;
          var b = Number(inn.extras && inn.extras.b) || 0;
          var lb = Number(inn.extras && inn.extras.lb) || 0;
          var exTotal = Number(inn.extras && inn.extras.total);
          return {
            battingTeam: String(inn.battingTeam || fallbackBat),
            bowlingTeam: String(inn.bowlingTeam || fallbackBowl),
            runs: Math.max(0, Number(inn.runs) || 0),
            wickets: Math.max(0, Math.min(10, Number(inn.wickets) || 0)),
            legalBalls: Math.max(0, Number(inn.legalBalls) || 0),
            extras: { wd: wd, nb: nb, b: b, lb: lb, total: isNaN(exTotal) ? (wd + nb + b + lb) : exTotal },
            batters: Array.isArray(inn.batters) ? inn.batters : [],
            bowlers: Array.isArray(inn.bowlers) ? inn.bowlers : [],
            strikerId: inn.strikerId || null,
            nonStrikerId: inn.nonStrikerId || null,
            currentBowlerId: inn.currentBowlerId || null,
            partnership: {
              runs: Number(inn.partnership && inn.partnership.runs) || 0,
              balls: Number(inn.partnership && inn.partnership.balls) || 0
            },
            fow: Array.isArray(inn.fow) ? inn.fow : [],
            currentOverBalls: Array.isArray(inn.currentOverBalls) ? inn.currentOverBalls : [],
            oversLog: Array.isArray(inn.oversLog) ? inn.oversLog : [],
            commentary: Array.isArray(inn.commentary) ? inn.commentary : []
          };
        }

        var t1 = String(m.team1 || 'Team A');
        var t2 = String(m.team2 || 'Team B');
        return {
          id: String(m.id || uid('match')),
          title: String(m.title || (t1 + ' vs ' + t2)),
          venue: String(m.venue || 'Tamarind Ground'),
          date: String(m.date || todayStr),
          oversPerInnings: Math.max(1, parseInt(m.oversPerInnings, 10) || 20),
          team1: t1,
          team2: t2,
          tossWinner: String(m.tossWinner || t1),
          tossDecision: m.tossDecision === 'bowl' ? 'bowl' : 'bat',
          status: ['live', 'innings_break', 'completed'].indexOf(m.status) >= 0 ? m.status : 'live',
          resultText: String(m.resultText || ''),
          currentInningsIndex: m.currentInningsIndex === 1 ? 1 : 0,
          innings: [cleanInn(m.innings[0], t1, t2), cleanInn(m.innings[1], t2, t1)],
          createdAt: Number(m.createdAt) || Date.now(),
          updatedAt: Number(m.updatedAt) || Date.now()
        };
      }

      function sortMatches() {
        state.matches.sort(function (a, b) {
          return (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0);
        });
      }

      function loadState() {
        try {
          var raw = safeGetItem(STORAGE_KEY);
          var migratedFromLegacy = false;
          if (!raw) {
            for (var i = 0; i < LEGACY_KEYS.length; i++) {
              var legacyRaw = safeGetItem(LEGACY_KEYS[i]);
              if (legacyRaw) {
                raw = legacyRaw;
                migratedFromLegacy = true;
                break;
              }
            }
          }
          if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              state.matches = parsed.map(sanitizeMatch).filter(Boolean);
              sortMatches();
              if (migratedFromLegacy && state.matches.length > 0) {
                safeSetItem(STORAGE_KEY, JSON.stringify(state.matches));
              }
            }
          }
          var savedId = safeGetItem(ACTIVE_KEY) || safeGetItem(LEGACY_ACTIVE_KEY);
          if (savedId && state.matches.some(function (m) { return m.id === savedId; })) {
            state.activeMatchId = savedId;
            if (!safeGetItem(ACTIVE_KEY)) safeSetItem(ACTIVE_KEY, savedId);
            state.currentTab = 'live';
          } else if (state.matches.length > 0) {
            state.activeMatchId = state.matches[0].id;
            state.currentTab = 'live';
          } else {
            state.activeMatchId = null;
            state.currentTab = 'setup';
          }
        } catch (err) {
          state.matches = [];
          state.activeMatchId = null;
          state.currentTab = 'setup';
        }
        setSaveStatus(storageMode);
      }

      function saveState() {
        sortMatches();
        try {
          safeSetItem(STORAGE_KEY, JSON.stringify(state.matches));
          if (state.activeMatchId) safeSetItem(ACTIVE_KEY, state.activeMatchId);
          else safeRemoveItem(ACTIVE_KEY);
          setSaveStatus(storageMode);
        } catch (err) {
          setSaveStatus('Session');
        }
      }

      function resetAllSavedData() {
        safeRemoveItem(STORAGE_KEY);
        safeRemoveItem(ACTIVE_KEY);
        for (var i = 0; i < LEGACY_KEYS.length; i++) {
          safeRemoveItem(LEGACY_KEYS[i]);
        }
        safeRemoveItem(LEGACY_ACTIVE_KEY);
        state.matches = [];
        state.activeMatchId = null;
        state.currentTab = 'setup';
        state.undoStacks = {};
        setupDraft = createDefaultDraft();
        render();
        showToast('Saved data cleared');
      }

      function getActiveMatch() {
        if (!state.activeMatchId) return null;
        return state.matches.find(function (m) { return m.id === state.activeMatchId; }) || null;
      }

      function getMatchById(id) {
        return state.matches.find(function (m) { return m.id === id; }) || null;
      }

      /***********************************************************************
       * 4. CRICKET CALCULATIONS & HELPERS
       ***********************************************************************/
      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatOvers(legalBalls) {
        var b = Math.max(0, Number(legalBalls) || 0);
        return Math.floor(b / 6) + '.' + (b % 6);
      }

      function parseOversToBalls(val) {
        var str = String(val == null ? '0' : val).trim();
        if (!str) return 0;
        var parts = str.split('.');
        var ov = Math.max(0, parseInt(parts[0], 10) || 0);
        var rem = Math.max(0, Math.min(5, parseInt(parts[1] || '0', 10) || 0));
        return ov * 6 + rem;
      }

      function calcRunRate(runs, legalBalls) {
        if (!legalBalls || legalBalls <= 0) return '0.00';
        return ((runs / legalBalls) * 6).toFixed(2);
      }

      function calcStrikeRate(runs, balls) {
        if (!balls || balls <= 0) return '0.0';
        return ((runs / balls) * 100).toFixed(1);
      }

      function calcEconomy(runsConceded, legalBalls) {
        if (!legalBalls || legalBalls <= 0) return '0.00';
        return ((runsConceded / legalBalls) * 6).toFixed(2);
      }

      function getBatter(inn, id) {
        return inn.batters.find(function (b) { return b.id === id; }) || null;
      }

      function getBowler(inn, id) {
        return inn.bowlers.find(function (b) { return b.id === id; }) || null;
      }

      function addBatter(inn, name) {
        var clean = String(name || '').trim() || ('Batter ' + (inn.batters.length + 1));
        var batter = {
          id: uid('bat'),
          name: clean,
          runs: 0,
          balls: 0,
          fours: 0,
          sixes: 0,
          isOut: false,
          dismissalText: 'not out'
        };
        inn.batters.push(batter);
        return batter;
      }

      function findOrCreateBowler(inn, name) {
        var clean = String(name || '').trim() || ('Bowler ' + (inn.bowlers.length + 1));
        var existing = inn.bowlers.find(function (b) { return b.name.toLowerCase() === clean.toLowerCase(); });
        if (existing) return existing;
        var bwl = {
          id: uid('bwl'),
          name: clean,
          legalBalls: 0,
          maidens: 0,
          runsConceded: 0,
          wickets: 0,
          currentOverRuns: 0,
          currentOverLegalBalls: 0
        };
        inn.bowlers.push(bwl);
        return bwl;
      }

      function computeAutoResult(match) {
        var i1 = match.innings[0];
        var i2 = match.innings[1];
        if (i2.runs > i1.runs) {
          var w = Math.max(1, 10 - i2.wickets);
          return i2.battingTeam + ' won by ' + w + ' wicket' + (w !== 1 ? 's' : '');
        }
        if (i1.runs > i2.runs) {
          var r = i1.runs - i2.runs;
          return i1.battingTeam + ' won by ' + r + ' run' + (r !== 1 ? 's' : '');
        }
        return 'Match Tied';
      }

      function pushUndo(match) {
        if (!match) return;
        if (!state.undoStacks[match.id]) state.undoStacks[match.id] = [];
        var stack = state.undoStacks[match.id];
        stack.push(JSON.stringify({
          status: match.status,
          resultText: match.resultText,
          currentInningsIndex: match.currentInningsIndex,
          innings: match.innings
        }));
        if (stack.length > 40) stack.shift();
      }

      function undoLastBall() {
        var match = getActiveMatch();
        if (!match) return;
        var stack = state.undoStacks[match.id];
        if (!stack || stack.length === 0) {
          showToast('Nothing to undo', true);
          return;
        }
        try {
          var prev = JSON.parse(stack.pop());
          match.status = prev.status;
          match.resultText = prev.resultText;
          match.currentInningsIndex = prev.currentInningsIndex;
          match.innings = prev.innings;
          match.updatedAt = Date.now();
          saveState();
          render();
          showToast('Last delivery undone');
        } catch (err) {
          showToast('Could not undo', true);
        }
      }

      function archivePartialOver(inn, bowler) {
        var runsInOver = inn.currentOverBalls.reduce(function (s, b) { return s + (b.runs || 0); }, 0);
        inn.oversLog.unshift({
          overNum: Math.floor(inn.legalBalls / 6) + 1,
          bowlerName: bowler ? bowler.name : 'Bowler',
          runsInOver: runsInOver,
          balls: inn.currentOverBalls.slice(),
          scoreAtEnd: inn.runs + '/' + inn.wickets
        });
        inn.currentOverBalls = [];
      }

      /***********************************************************************
       * 5. BALL-BY-BALL SCORING ENGINE
       ***********************************************************************/
      function recordBall(opts) {
        var match = getActiveMatch();
        if (!match || match.status !== 'live') return;

        var inn = match.innings[match.currentInningsIndex];
        var striker = getBatter(inn, inn.strikerId);
        var bowler = getBowler(inn, inn.currentBowlerId);
        if (!striker || !bowler) {
          showToast('Set active batters & bowler first', true);
          return;
        }

        pushUndo(match);

        var extraType = opts.extraType || null;
        var runsOffBat = Number(opts.runsOffBat) || 0;
        var extraRuns = Number(opts.extraRuns) || 0;
        var isWicket = Boolean(opts.isWicket);

        var isLegal = true;
        var totalRuns = 0;
        var bowlerRuns = 0;
        var batterFaced = true;
        var rotateRuns = 0;
        var pillLabel = '';
        var pillType = 'run';
        var commentary = '';

        if (extraType === 'wd') {
          isLegal = false;
          batterFaced = false;
          var wdTotal = 1 + extraRuns;
          totalRuns = wdTotal;
          bowlerRuns = wdTotal;
          inn.extras.wd += wdTotal;
          inn.extras.total += wdTotal;
          rotateRuns = extraRuns;
          pillLabel = extraRuns > 0 ? 'WD+' + extraRuns : 'WD';
          pillType = 'extra';
          commentary = 'Wide ball' + (extraRuns > 0 ? ' (+' + extraRuns + ')' : '');
        } else if (extraType === 'nb') {
          isLegal = false;
          batterFaced = true;
          totalRuns = 1 + runsOffBat + extraRuns;
          bowlerRuns = 1 + runsOffBat;
          inn.extras.nb += 1;
          if (extraRuns > 0) inn.extras.b += extraRuns;
          inn.extras.total += (1 + extraRuns);
          rotateRuns = runsOffBat + extraRuns;
          var addSum = runsOffBat + extraRuns;
          pillLabel = addSum > 0 ? 'NB+' + addSum : 'NB';
          pillType = 'extra';
          commentary = 'No ball' + (runsOffBat > 0 ? ', ' + runsOffBat + ' off bat' : extraRuns > 0 ? ', ' + extraRuns + ' bye(s)' : '');
        } else if (extraType === 'b' || extraType === 'lb') {
          isLegal = true;
          batterFaced = true;
          totalRuns = extraRuns;
          bowlerRuns = 0;
          inn.extras[extraType] += extraRuns;
          inn.extras.total += extraRuns;
          rotateRuns = extraRuns;
          pillLabel = extraRuns + extraType.toUpperCase();
          pillType = 'extra';
          commentary = extraRuns + ' ' + (extraType === 'b' ? 'Bye' : 'Leg Bye') + (extraRuns > 1 ? 's' : '');
        } else {
          isLegal = true;
          batterFaced = true;
          totalRuns = runsOffBat;
          bowlerRuns = runsOffBat;
          rotateRuns = runsOffBat;
          if (runsOffBat === 0) {
            pillLabel = '0';
            pillType = 'dot';
            commentary = 'No run';
          } else if (runsOffBat === 4) {
            pillLabel = '4';
            pillType = 'four';
            commentary = 'FOUR! Cracked to the boundary';
          } else if (runsOffBat === 6) {
            pillLabel = '6';
            pillType = 'six';
            commentary = 'SIX! Smashed over the ropes';
          } else {
            pillLabel = String(runsOffBat);
            pillType = 'run';
            commentary = runsOffBat + ' run' + (runsOffBat > 1 ? 's' : '');
          }
        }

        inn.runs += totalRuns;
        inn.partnership.runs += totalRuns;

        if (batterFaced) striker.balls += 1;
        if (runsOffBat > 0) {
          striker.runs += runsOffBat;
          if (runsOffBat === 4) striker.fours += 1;
          if (runsOffBat === 6) striker.sixes += 1;
        }

        bowler.runsConceded += bowlerRuns;
        bowler.currentOverRuns += bowlerRuns;

        if (isLegal) {
          inn.legalBalls += 1;
          inn.partnership.balls += 1;
          bowler.legalBalls += 1;
          bowler.currentOverLegalBalls += 1;
        }

        var overStamp = isLegal
          ? Math.floor((inn.legalBalls - 1) / 6) + '.' + (((inn.legalBalls - 1) % 6) + 1)
          : Math.floor(inn.legalBalls / 6) + '.' + ((inn.legalBalls % 6) + 1) + '*';

        if (isWicket) {
          inn.wickets += 1;
          pillType = 'wicket';
          pillLabel = totalRuns > 0 ? 'W+' + totalRuns : 'W';

          var dType = opts.dismissalType || 'Bowled';
          var fielder = String(opts.fielderName || '').trim();
          var outBatter = getBatter(inn, opts.outBatterId || inn.strikerId) || striker;
          outBatter.isOut = true;

          if (dType === 'Bowled') outBatter.dismissalText = 'b ' + bowler.name;
          else if (dType === 'Caught') outBatter.dismissalText = fielder ? ('c ' + fielder + ' b ' + bowler.name) : ('c & b ' + bowler.name);
          else if (dType === 'LBW') outBatter.dismissalText = 'lbw b ' + bowler.name;
          else if (dType === 'Stumped') outBatter.dismissalText = fielder ? ('st ' + fielder + ' b ' + bowler.name) : ('st b ' + bowler.name);
          else if (dType === 'Hit Wicket') outBatter.dismissalText = 'hit wicket b ' + bowler.name;
          else if (dType === 'Run Out') outBatter.dismissalText = fielder ? ('run out (' + fielder + ')') : 'run out';
          else outBatter.dismissalText = dType.toLowerCase();

          if (dType !== 'Run Out') bowler.wickets += 1;

          inn.fow.push({
            wicketNum: inn.wickets,
            runs: inn.runs,
            overs: formatOvers(inn.legalBalls),
            batterName: outBatter.name
          });

          commentary = 'OUT! ' + outBatter.name + ' (' + outBatter.dismissalText + ') — ' + outBatter.runs + '(' + outBatter.balls + ')';
          inn.partnership = { runs: 0, balls: 0 };

          if (inn.wickets < 10) {
            var nextBat = addBatter(inn, opts.nextBatterName);
            if (outBatter.id === inn.strikerId) inn.strikerId = nextBat.id;
            else inn.nonStrikerId = nextBat.id;
          } else {
            if (outBatter.id === inn.strikerId) inn.strikerId = null;
            else inn.nonStrikerId = null;
          }
        } else if (rotateRuns % 2 === 1 && inn.strikerId && inn.nonStrikerId) {
          var tmp = inn.strikerId;
          inn.strikerId = inn.nonStrikerId;
          inn.nonStrikerId = tmp;
        }

        inn.currentOverBalls.push({ label: pillLabel, type: pillType, runs: totalRuns, isLegal: isLegal });
        inn.commentary.unshift({
          overBall: overStamp,
          bowler: bowler.name,
          batter: striker.name,
          text: commentary,
          badge: pillLabel,
          type: pillType
        });

        var overJustCompleted = false;
        if (isLegal && inn.legalBalls > 0 && inn.legalBalls % 6 === 0) {
          overJustCompleted = true;
          if (bowler.currentOverRuns === 0 && bowler.currentOverLegalBalls >= 6) {
            bowler.maidens += 1;
          }
          var completedOverNum = inn.legalBalls / 6;
          var runsInOver = inn.currentOverBalls.reduce(function (s, b) { return s + (b.runs || 0); }, 0);
          inn.oversLog.unshift({
            overNum: completedOverNum,
            bowlerName: bowler.name,
            runsInOver: runsInOver,
            balls: inn.currentOverBalls.slice(),
            scoreAtEnd: inn.runs + '/' + inn.wickets
          });
          inn.currentOverBalls = [];
          bowler.currentOverRuns = 0;
          bowler.currentOverLegalBalls = 0;

          if (inn.strikerId && inn.nonStrikerId) {
            var tmpEnd = inn.strikerId;
            inn.strikerId = inn.nonStrikerId;
            inn.nonStrikerId = tmpEnd;
          }
        }

        var maxBalls = match.oversPerInnings * 6;
        var inningsEnded = false;
        var matchEnded = false;

        if (match.currentInningsIndex === 0) {
          if (inn.wickets >= 10 || inn.legalBalls >= maxBalls) {
            inningsEnded = true;
            match.status = 'innings_break';
            if (!overJustCompleted && inn.currentOverBalls.length > 0) archivePartialOver(inn, bowler);
          }
        } else {
          var target = match.innings[0].runs + 1;
          if (inn.runs >= target) {
            matchEnded = true;
            match.status = 'completed';
            match.resultText = computeAutoResult(match);
            if (!overJustCompleted && inn.currentOverBalls.length > 0) archivePartialOver(inn, bowler);
          } else if (inn.wickets >= 10 || inn.legalBalls >= maxBalls) {
            matchEnded = true;
            match.status = 'completed';
            match.resultText = computeAutoResult(match);
            if (!overJustCompleted && inn.currentOverBalls.length > 0) archivePartialOver(inn, bowler);
          }
        }

        match.updatedAt = Date.now();
        saveState();
        render();

        if (matchEnded) {
          showToast(match.resultText);
        } else if (inningsEnded) {
          showToast('1st Innings complete! Ready for 2nd Innings.');
        } else if (overJustCompleted) {
          openChangeBowlerModal(true);
        }
      }

      function swapStrike() {
        var match = getActiveMatch();
        if (!match || match.status !== 'live') return;
        var inn = match.innings[match.currentInningsIndex];
        if (!inn.strikerId || !inn.nonStrikerId) return;
        var tmp = inn.strikerId;
        inn.strikerId = inn.nonStrikerId;
        inn.nonStrikerId = tmp;
        match.updatedAt = Date.now();
        saveState();
        render();
        showToast('Strike rotated');
      }
