<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tamarind Cricket Players (TCP) — Live Cricket Scorer</title>
  <!-- Firebase v10.14.1 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --card: #111827;
      --card-2: #1a2335;
      --input: #0d1526;
      --subtle: #1f2937;
      --border: #243045;
      --border-light: #334155;
      --text: #f8fafc;
      --text-sec: #cbd5e1;
      --muted: #94a3b8;
      --dim: #64748b;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --emerald-dark: #059669;
      --emerald-bg: rgba(16, 185, 129, 0.14);
      --emerald-border: rgba(16, 185, 129, 0.36);
      --amber: #f59e0b;
      --amber-bright: #fbbf24;
      --amber-bg: rgba(245, 158, 11, 0.16);
      --amber-border: rgba(245, 158, 11, 0.36);
      --rose: #e11d48;
      --rose-bright: #fb7185;
      --rose-bg: rgba(225, 29, 72, 0.16);
      --rose-border: rgba(225, 29, 72, 0.38);
      --sky: #38bdf8;
      --sky-bg: rgba(56, 189, 248, 0.16);
      --sky-border: rgba(56, 189, 248, 0.36);
      --purple: #8b5cf6;
      --wa-green: #25d366;
      --wa-bubble: #005c4b;
      --wa-bubble-border: #0a725e;
      --radius-md: 14px;
      --radius-lg: 18px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.4;
      overflow-x: hidden;
    }
    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    button {
      cursor: pointer; border: none; background: none;
      transition: transform 0.1s ease, background-color 0.15s ease, opacity 0.15s ease;
    }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    a { text-decoration: none; color: inherit; }

    /* ================= HEADER ================= */
    .app-header {
      position: sticky; top: 0; z-index: 30;
      background: rgba(11, 17, 32, 0.97);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .header-inner {
      max-width: 820px; margin: 0 auto; padding: 8px 10px 7px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .brand-btn { display: flex; align-items: center; gap: 8px; text-align: left; min-width: 0; flex-shrink: 1; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #047857);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4); flex-shrink: 0;
      border: 2px solid rgba(167, 243, 208, 0.45);
    }
    .brand-text-col { display: flex; flex-direction: column; min-width: 0; }
    .brand-top-row { display: flex; align-items: center; gap: 6px; }
    .brand-title { font-weight: 900; font-size: 15px; letter-spacing: 0.02em; line-height: 1.05; color: var(--emerald-bright); }
    .brand-sub { font-size: 10px; font-weight: 700; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .sync-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 9.5px; font-weight: 800; padding: 2px 7px; border-radius: 999px; flex-shrink: 0; }
    .sync-cloud { color: var(--emerald-bright); background: var(--emerald-bg); border: 1px solid var(--emerald-border); }
    .sync-working { color: var(--amber-bright); background: var(--amber-bg); border: 1px solid var(--amber-border); }
    .sync-local { color: var(--sky); background: var(--sky-bg); border: 1px solid var(--sky-border); }
    .sync-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .auth-pill-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 11px; border-radius: 10px; font-size: 11px; font-weight: 800;
      white-space: nowrap; flex-shrink: 0;
    }
    .auth-pill-viewer { background: var(--card-2); color: var(--text-sec); border: 1px solid var(--border-light); }
    .auth-pill-admin { background: var(--emerald-bg); color: var(--emerald-bright); border: 1px solid var(--emerald-border); }
    .auth-pill-preview { background: var(--amber-bg); color: var(--amber-bright); border: 1px solid var(--amber-border); }

    .nav-tabs {
      display: flex; align-items: center; gap: 4px;
      background: var(--card); padding: 3px; border-radius: 12px;
      border: 1px solid var(--border); width: 100%;
      overflow-x: auto; scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-tab {
      flex: 1 0 auto; padding: 7px 8px; border-radius: 9px;
      font-size: 11.5px; font-weight: 700; color: var(--muted);
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      white-space: nowrap; min-width: 60px;
    }
    .nav-tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }
    .nav-tab.active { background: var(--emerald-dark); color: #ffffff; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35); }
    .nav-tab svg { width: 13px; height: 13px; flex-shrink: 0; }
    .nav-badge {
      background: rgba(255, 255, 255, 0.14); color: #ffffff;
      font-size: 9.5px; font-weight: 800; padding: 1px 5px;
      border-radius: 999px; min-width: 16px; text-align: center;
    }
    .nav-tab.active .nav-badge { background: rgba(0, 0, 0, 0.25); }

    /* ================= LAYOUT ================= */
    .app-main { max-width: 820px; margin: 0 auto; padding: 12px 10px 90px; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .stack-sm { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .hidden { display: none !important; }
    .text-xs { font-size: 11.5px; }
    .text-sm { font-size: 13px; }
    .text-center { text-align: center; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .muted { color: var(--muted); }
    .text-emerald { color: var(--emerald-bright); }
    .text-amber { color: var(--amber-bright); }
    .text-rose { color: var(--rose-bright); }
    .text-sky { color: var(--sky); }

    /* ================= CARDS & SCOREBOARD ================= */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm);
    }
    .card-pad { padding: 14px; }
    .card-header {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: rgba(255, 255, 255, 0.02);
    }
    .card-header-title {
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted);
    }

    .scoreboard {
      background: linear-gradient(145deg, #13203b 0%, #0f172a 55%, #073b2f 100%);
      border: 1px solid rgba(52, 211, 153, 0.32);
      border-radius: var(--radius-lg); padding: 14px; box-shadow: var(--shadow-md);
      display: flex; flex-direction: column; gap: 10px;
    }
    .sb-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .sb-match-title { font-size: 12px; font-weight: 800; color: var(--text-sec); min-width: 0; }
    .sb-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
    .sb-team { font-size: 14px; font-weight: 800; color: var(--text); }
    .sb-score-line { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
    .sb-score { font-size: 36px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; color: #ffffff; }
    .sb-overs { font-size: 13px; font-weight: 700; color: var(--emerald-bright); }
    .sb-crr-box {
      background: rgba(11, 17, 32, 0.68); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px; padding: 6px 11px; text-align: center; flex-shrink: 0;
    }
    .sb-crr-label { font-size: 9.5px; font-weight: 800; letter-spacing: 0.08em; color: var(--muted); }
    .sb-crr-val { font-size: 17px; font-weight: 900; color: var(--emerald-bright); line-height: 1.15; }
    .sb-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 9px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 6px; font-size: 12px; color: var(--text-sec);
    }
    .target-pill {
      background: var(--amber-bg); color: var(--amber-bright);
      border: 1px solid var(--amber-border); padding: 2px 8px;
      border-radius: 999px; font-size: 11px; font-weight: 800;
    }

    /* ================= BADGES, CHIPS & BANNERS ================= */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 8px; border-radius: 999px; font-size: 10px;
      font-weight: 800; letter-spacing: 0.04em; white-space: nowrap;
    }
    .badge-live { background: var(--emerald-bg); color: var(--emerald-bright); border: 1px solid var(--emerald-border); }
    .badge-break { background: var(--amber-bg); color: var(--amber-bright); border: 1px solid var(--amber-border); }
    .badge-done { background: var(--sky-bg); color: var(--sky); border: 1px solid var(--sky-border); }
    .badge-out { background: var(--rose-bg); color: var(--rose-bright); border: 1px solid var(--rose-border); }
    .badge-muted { background: var(--subtle); color: var(--muted); border: 1px solid var(--border-light); }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--emerald-bright); animation: pulse-dot 1.4s infinite; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }

    .banner {
      border-radius: var(--radius-md); padding: 11px 13px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    .banner-amber { background: var(--amber-bg); border: 1px solid var(--amber-border); }
    .banner-emerald { background: var(--emerald-bg); border: 1px solid var(--emerald-border); }
    .banner-sky { background: var(--sky-bg); border: 1px solid var(--sky-border); }

    .player-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 999px;
      background: var(--card-2); border: 1px solid var(--border-light);
      font-size: 12px; font-weight: 700; color: var(--text-sec);
    }
    .player-chip-remove {
      width: 17px; height: 17px; border-radius: 50%;
      background: rgba(225, 29, 72, 0.22); color: var(--rose-bright);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 900; line-height: 1;
    }
    .player-chip-remove:hover { background: var(--rose); color: #ffffff; }

    /* ================= INFO PILLS ================= */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .info-pill {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 9px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .info-pill-label { font-size: 11px; font-weight: 700; color: var(--muted); }
    .info-pill-val { font-size: 13px; font-weight: 800; color: var(--text); }
    .info-pill-val span { font-size: 11px; font-weight: 600; color: var(--muted); }

    /* ================= BUTTONS ================= */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 14px; border-radius: 11px; font-size: 13px; font-weight: 800; white-space: nowrap;
    }
    .btn-sm { padding: 8px 12px; font-size: 12.5px; border-radius: 10px; }
    .btn-xs { padding: 5px 9px; font-size: 11.5px; border-radius: 8px; gap: 4px; }
    .btn-full { width: 100%; }
    .btn-primary { background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    .btn-subtle { background: var(--subtle); color: var(--text); border: 1px solid var(--border-light); }
    .btn-emerald-soft { background: var(--emerald-bg); color: var(--emerald-bright); border: 1px solid var(--emerald-border); }
    .btn-amber-soft { background: var(--amber-bg); color: var(--amber-bright); border: 1px solid var(--amber-border); }
    .btn-rose-soft { background: var(--rose-bg); color: var(--rose-bright); border: 1px solid var(--rose-border); }
    .btn-sky-soft { background: var(--sky-bg); color: var(--sky); border: 1px solid var(--sky-border); }
    .btn-rose { background: var(--rose); color: #ffffff; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); }
    .btn-wa { background: var(--wa-green); color: #052e16; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.28); }
    .btn-wa-soft { background: rgba(37, 211, 102, 0.14); color: #4ade80; border: 1px solid rgba(37, 211, 102, 0.35); }
    .btn-google { background: #ffffff; color: #0f172a; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
    .icon-btn {
      width: 28px; height: 28px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--muted); background: rgba(255, 255, 255, 0.06); flex-shrink: 0;
    }

    /* ================= TABLES ================= */
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    thead th {
      text-align: left; padding: 8px 10px; font-size: 10.5px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    tbody td { padding: 9px 10px; border-bottom: 1px solid rgba(36, 48, 69, 0.7); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .striker-row { background: rgba(16, 185, 129, 0.07); }
    .player-cell { display: flex; align-items: center; gap: 6px; min-width: 110px; }
    .striker-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--emerald-bright); flex-shrink: 0; }
    .nonstriker-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-light); flex-shrink: 0; }
    .player-name { font-weight: 700; color: var(--text); }
    .player-name-btn { font-weight: 700; color: var(--text); text-align: left; padding: 2px 0; text-decoration: underline dotted rgba(148, 163, 184, 0.45); text-underline-offset: 3px; }
    .player-name-btn:hover { color: var(--emerald-bright); }
    .player-dismissal { font-size: 11px; color: var(--muted); margin-top: 1px; }

    /* ================= OVER PILLS ================= */
    .over-strip {
      padding: 10px 14px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; background: rgba(11, 17, 32, 0.45);
    }
    .over-strip-label { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); white-space: nowrap; }
    .ball-pills { display: flex; align-items: center; gap: 5px; overflow-x: auto; padding-bottom: 1px; }
    .ball-pills-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .ball-pill {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 27px; height: 27px; padding: 0 7px;
      border-radius: 999px; font-size: 11px; font-weight: 800; flex-shrink: 0;
    }
    .pill-dot { background: var(--subtle); color: var(--muted); border: 1px solid var(--border-light); }
    .pill-run { background: #1e3a5f; color: #e0f2fe; border: 1px solid rgba(56, 189, 248, 0.35); }
    .pill-four { background: var(--emerald-dark); color: #ffffff; }
    .pill-six { background: #7c3aed; color: #ffffff; }
    .pill-wicket { background: var(--rose); color: #ffffff; }
    .pill-extra { background: var(--amber-bg); color: var(--amber-bright); border: 1px solid var(--amber-border); }

    /* ================= KEYPAD & CONTROLS ================= */
    .keypad-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 12px;
      display: flex; flex-direction: column; gap: 9px; box-shadow: var(--shadow-sm);
    }
    .keypad-runs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
    .key-run {
      height: 50px; border-radius: 13px; background: var(--card-2);
      border: 1px solid var(--border-light); color: var(--text);
      font-size: 19px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    }
    .key-four { background: rgba(16, 185, 129, 0.22); border-color: var(--emerald); color: var(--emerald-bright); }
    .key-six { background: rgba(124, 58, 237, 0.24); border-color: var(--purple); color: #ddd6fe; }
    .keypad-extras { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .key-extra {
      height: 44px; border-radius: 11px; background: var(--amber-bg);
      border: 1px solid var(--amber-border); color: var(--amber-bright);
      font-size: 12.5px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    }
    .key-bye { background: var(--sky-bg); border-color: var(--sky-border); color: var(--sky); }
    .key-out { background: var(--rose); border-color: #f43f5e; color: #ffffff; }
    .keypad-utils { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .match-controls-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .match-controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* ================= FORMS & SQUAD BUILDER ================= */
    .field-label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    .mini-label { display: block; font-size: 10px; font-weight: 700; color: var(--dim); margin-bottom: 3px; }
    .field-input, .field-select, .field-textarea {
      width: 100%; background: var(--input); border: 1px solid var(--border-light);
      border-radius: 10px; padding: 9px 11px; font-size: 13.5px; color: var(--text); outline: none;
    }
    .field-textarea { resize: vertical; min-height: 74px; line-height: 1.45; }
    .field-input:focus, .field-select:focus, .field-textarea:focus { border-color: var(--emerald); }
    .field-input-sm { padding: 7px 9px; font-size: 12.5px; border-radius: 9px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 560px) {
      .form-grid-3 { grid-template-columns: 1fr; }
      .form-grid-2-sm-1 { grid-template-columns: 1fr; }
    }
    .squad-box {
      background: rgba(13, 21, 38, 0.72); border: 1px solid var(--border);
      border-radius: 14px; padding: 11px; display: flex; flex-direction: column; gap: 9px;
    }
    .squad-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .squad-grid-2 { grid-template-columns: 1fr; } }

    .pill-choice {
      padding: 6px 10px; border-radius: 9px; background: var(--input);
      border: 1px solid var(--border-light); color: var(--text-sec);
      font-size: 11.5px; font-weight: 800; text-align: center;
    }
    .pill-choice.active { background: var(--emerald-bg); border-color: var(--emerald); color: var(--emerald-bright); }
    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--text-sec); cursor: pointer; }
    .checkbox-row input { width: 16px; height: 16px; accent-color: var(--emerald); }

    /* ================= TABS, FILTERS, RADIO CARDS ================= */
    .seg-tabs {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
      background: var(--input); border: 1px solid var(--border);
      border-radius: 12px; padding: 4px;
    }
    .seg-tabs-2 { grid-template-columns: repeat(2, 1fr); }
    .seg-tab {
      padding: 8px 6px; border-radius: 9px; font-size: 11.5px; font-weight: 800;
      color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .seg-tab.active { background: var(--emerald-dark); color: #ffffff; }
    .filter-chip {
      padding: 5px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
      background: var(--input); border: 1px solid var(--border-light); color: var(--muted);
    }
    .filter-chip.active { background: var(--emerald-bg); border-color: var(--emerald); color: var(--emerald-bright); }
    .edit-player-card {
      background: var(--input); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .edit-stats-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .option-card {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
      border-radius: 12px; background: var(--input); border: 1px solid var(--border-light);
      cursor: pointer;
    }
    .option-card input[type="radio"] { margin-top: 3px; accent-color: var(--emerald); }
    .bowler-pick-btn {
      width: 100%; padding: 10px 12px; border-radius: 11px;
      background: var(--input); border: 1px solid var(--border-light);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      text-align: left;
    }
    .bowler-pick-btn:hover { border-color: var(--emerald); background: rgba(16, 185, 129, 0.08); }
    .squad-row-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 7px 9px; border-radius: 9px; background: rgba(13, 21, 38, 0.6);
      border: 1px solid rgba(36, 48, 69, 0.8); font-size: 12.5px;
    }

    /* ================= MODALS ================= */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; background: rgba(2, 6, 23, 0.84);
      display: none; align-items: center; justify-content: center; padding: 12px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      width: 100%; max-width: 460px; max-height: 90vh;
      background: var(--card); border: 1px solid var(--border-light);
      border-radius: 18px; box-shadow: var(--shadow-lg);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-box.wide { max-width: 580px; }
    .modal-head {
      padding: 13px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0;
    }
    .modal-scroll { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .modal-foot {
      padding: 12px 16px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
      background: rgba(11, 17, 32, 0.45); flex-shrink: 0;
    }

    /* ================= WHATSAPP PREVIEW ================= */
    .wa-wallpaper { background: #0b141a; border: 1px solid var(--border); border-radius: 14px; padding: 14px 10px; }
    .wa-bubble-wrap { display: flex; justify-content: flex-end; }
    .wa-bubble {
      background: var(--wa-bubble); border: 1px solid var(--wa-bubble-border);
      color: #e9edef; border-radius: 12px 2px 12px 12px; padding: 10px 12px 6px;
      font-size: 12.5px; line-height: 1.45; max-width: 96%; word-break: break-word;
    }
    .wa-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 10px; color: rgba(233, 237, 239, 0.65); margin-top: 4px; }
    .canvas-stage { background: #020617; border: 1px solid var(--border); border-radius: 14px; padding: 8px; display: flex; justify-content: center; }
    #share-scorecard-canvas { width: 100%; max-width: 340px; height: auto; border-radius: 10px; display: block; }

    /* ================= TOAST ================= */
    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 16px);
      background: #0f172a; color: #f8fafc; border: 1px solid var(--emerald);
      padding: 10px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 800;
      box-shadow: var(--shadow-md); opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease; z-index: 90;
      max-width: 92vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { border-color: var(--rose); color: #ffe4e6; }
  </style>
</head>

  <main id="app-main" class="app-main"></main>
  <input id="import-json-input" type="file" accept=".json,application/json" class="hidden" />
  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true">
    <div id="modal-box" class="modal-box"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"><span id="toast-msg">Done</span></div>

  <script>
    (function () {
      'use strict';

      /* ======================== FIREBASE CONFIGURATION ======================== */
      var FIREBASE_CONFIG = {
        apiKey: "AIzaSyDgiZi07d4CT-YDixcVx2JQwL2HioGx93A",
        authDomain: "tcp-cricket.firebaseapp.com",
        projectId: "tcp-cricket",
        storageBucket: "tcp-cricket.firebasestorage.app",
        messagingSenderId: "556014037332",
        appId: "1:556014037332:web:c95deb36613e33168dc0c1"
      };

      var LOCAL_STATE_KEY = 'tcp_cricket_state_v3';
      var LOCAL_TEAMS_KEY = 'tcp_cricket_teams_v3';

      /* ======================== SAMPLE TCP TEAMS ======================== */
      var SAMPLE_TEAMS = [
        {
          id: 'team_tcp_strikers',
          name: 'TCP Strikers',
          players: ['Pradeep', 'Ravi', 'Arjun', 'Vikram', 'Nikhil', 'Harish', 'Deepak', 'Sandeep', 'Varun', 'Teja', 'Ajay'],
          updatedAt: Date.now()
        },
        {
          id: 'team_tcp_warriors',
          name: 'TCP Warriors',
          players: ['Kiran', 'Sai', 'Ramesh', 'Karthik', 'Suresh', 'Manoj', 'Naveen', 'Pavan', 'Lokesh', 'Mahesh', 'Tarun'],
          updatedAt: Date.now()
        }
      ];

      /* ======================== GLOBAL APP STATE ======================== */
      var state = {
        matches: [],
        teams: [],
        activeMatchId: null,
        currentTab: 'live',
        scorecardInn: 0,
        historySearch: '',
        historyFilter: 'all',
        mode: 'local', // 'local' | 'cloud'
        syncState: 'local', // 'local' | 'syncing' | 'cloud'
        user: null,
        primaryAdmin: '',
        admins: [],
        previewViewer: false,
        authFormMode: 'signin', // 'signin' | 'signup'
        shareMatchId: null,
        shareTab: 'quick', // 'quick' | 'full' | 'image'
        // Setup Match Draft State
        setup: null,
        // Saved Team Editor Draft State
        teamEditor: null, // { id, name, players: [], showBulk: false }
        // Edit Match Modal Draft State
        editDraft: null,
        editTab: 'info', // 'info' | 'squads' | 'innings'
        editInn: 0
      };

      var fb = { enabled: false, app: null, auth: null, db: null };

      /* ======================== UTILITY HELPERS ======================== */
      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function uid(prefix) {
        return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }
      function todayStr() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }
      function fmtOvers(balls) {
        var b = Math.max(0, Number(balls) || 0);
        return Math.floor(b / 6) + '.' + (b % 6);
      }
      function calcRR(runs, balls) {
        if (!balls) return '0.00';
        return ((runs / balls) * 6).toFixed(2);
      }
      function calcSR(runs, balls) {
        if (!balls) return '0.0';
        return ((runs / balls) * 100).toFixed(1);
      }
      function clone(obj) {
        return JSON.parse(JSON.stringify(obj));
      }
      function showToast(msg, isErr) {
        var el = document.getElementById('toast');
        var txt = document.getElementById('toast-msg');
        if (!el || !txt) return;
        txt.textContent = msg;
        el.className = 'toast show' + (isErr ? ' error' : '');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () { el.className = 'toast'; }, 2900);
      }

      /* Clean and deduplicate player names (case-insensitive) */
      function cleanName(raw) {
        return String(raw || '')
          .replace(/^\s*(?:\d+[\.\)\-:\s]+|[-•*▪▫►➤]+\s*)/, '')
          .replace(/\s+/g, ' ')
          .trim();
      }
      function parseBulkPlayers(rawText) {
        return String(rawText || '')
          .split(/[\n\r,;]+/)
          .map(cleanName)
          .filter(Boolean);
      }
      function addUniquePlayers(list, incoming) {
        var arr = Array.isArray(list) ? list.slice() : [];
        var seen = {};
        arr.forEach(function (p) { seen[p.toLowerCase()] = true; });
        var addedCount = 0;
        (Array.isArray(incoming) ? incoming : [incoming]).forEach(function (raw) {
          var name = cleanName(raw);
          if (name && !seen[name.toLowerCase()]) {
            seen[name.toLowerCase()] = true;
            arr.push(name);
            addedCount++;
          }
        });
        return { list: arr, addedCount: addedCount };
      }

      /* Auth Role Checks */
      function hasRealAdminRights() {
        if (state.mode === 'local') return true;
        if (!state.user || !state.user.email) return false;
        var em = state.user.email.toLowerCase();
        if (state.primaryAdmin && em === state.primaryAdmin.toLowerCase()) return true;
        return state.admins.map(function (a) { return a.toLowerCase(); }).indexOf(em) >= 0;
      }
      function isAdmin() {
        if (state.previewViewer) return false;
        return hasRealAdminRights();
      }

      /* Normalize match structure so legacy matches seamlessly support squads */
      function normalizeMatch(m) {
        if (!m) return m;
        if (!m.squads) m.squads = { A: [], B: [] };
        if (!Array.isArray(m.squads.A)) m.squads.A = [];
        if (!Array.isArray(m.squads.B)) m.squads.B = [];
        if (!m.innings || m.innings.length < 2) return m;

        m.innings.forEach(function (inn, idx) {
          if (!inn.battingSide) {
            inn.battingSide = inn.battingTeam === m.teamA ? 'A' : (inn.battingTeam === m.teamB ? 'B' : (idx === 0 ? 'A' : 'B'));
          }
          if (!inn.bowlingSide) {
            inn.bowlingSide = inn.battingSide === 'A' ? 'B' : 'A';
          }
          if (typeof inn.lastOverBowler !== 'string') inn.lastOverBowler = '';
          if (!Array.isArray(inn.batters)) inn.batters = [];
          if (!Array.isArray(inn.bowlers)) inn.bowlers = [];
          if (!Array.isArray(inn.fow)) inn.fow = [];
          if (!Array.isArray(inn.oversLog)) inn.oversLog = [];
          if (!Array.isArray(inn.currentOverBalls)) inn.currentOverBalls = [];
          if (!inn.extras) inn.extras = { wd: 0, nb: 0, b: 0, lb: 0 };

          // Ensure any existing batters/bowlers appear in the match squads
          var batNames = inn.batters.map(function (b) { return b.name; });
          var bowlNames = inn.bowlers.map(function (bw) { return bw.name; });
          m.squads[inn.battingSide] = addUniquePlayers(m.squads[inn.battingSide], batNames).list;
          m.squads[inn.bowlingSide] = addUniquePlayers(m.squads[inn.bowlingSide], bowlNames).list;
        });

        if (!m.wicketsLimit || m.wicketsLimit < 1) {
          var maxSquad = Math.max(m.squads.A.length, m.squads.B.length);
          m.wicketsLimit = maxSquad >= 2 ? Math.min(10, maxSquad - 1) : 10;
        }
        return m;
      }

      function getActiveMatch() {
        if (!state.matches.length) return null;
        for (var i = 0; i < state.matches.length; i++) {
          if (state.matches[i].id === state.activeMatchId) return state.matches[i];
        }
        return state.matches[0];
      }
      function sortMatches() {
        state.matches.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
      }
      function getInningsSquads(m, innIdx) {
        var inn = m.innings[innIdx];
        return {
          batting: (m.squads && m.squads[inn.battingSide]) ? m.squads[inn.battingSide] : [],
          bowling: (m.squads && m.squads[inn.bowlingSide]) ? m.squads[inn.bowlingSide] : [],
          battingSide: inn.battingSide,
          bowlingSide: inn.bowlingSide
        };
      }
      function getYetToBatPlayers(m, innIdx) {
        var inn = m.innings[innIdx];
        var sq = getInningsSquads(m, innIdx).batting;
        var used = {};
        inn.batters.forEach(function (b) {
          if (b && b.name) used[b.name.toLowerCase()] = true;
        });
        return sq.filter(function (name) { return !used[name.toLowerCase()]; });
      }

      /* ======================== SETUP DRAFT MANAGEMENT ======================== */
      function initSetupDraft() {
        var defaultA = state.teams[0] ? state.teams[0].name : 'TCP Strikers';
        var defaultB = state.teams[1] ? state.teams[1].name : 'TCP Warriors';
        var playersA = state.teams[0] ? state.teams[0].players.slice() : ['Pradeep', 'Ravi', 'Arjun', 'Vikram', 'Nikhil'];
        var playersB = state.teams[1] ? state.teams[1].players.slice() : ['Kiran', 'Sai', 'Ramesh', 'Karthik', 'Suresh'];
        state.setup = {
          title: 'TCP Weekend Match',
          venue: 'Tamarind Ground',
          date: todayStr(),
          oversLimit: 10,
          wicketsLimit: Math.min(10, Math.max(1, playersA.length - 1)),
          wicketsManual: false,
          teamA: defaultA,
          teamB: defaultB,
          playersA: playersA,
          playersB: playersB,
          showBulkA: false,
          showBulkB: false,
          saveToLibrary: true,
          tossWinner: 'A', // 'A' | 'B'
          tossDecision: 'bat', // 'bat' | 'bowl'
          striker: playersA[0] || '',
          nonStriker: playersA[1] || '',
          bowler: playersB[0] || '',
          customStriker: false,
          customNonStriker: false,
          customBowler: false
        };
      }

      function getSetupBattingBowling() {
        var s = state.setup;
        var batFirstSide = s.tossDecision === 'bat' ? s.tossWinner : (s.tossWinner === 'A' ? 'B' : 'A');
        var bowlFirstSide = batFirstSide === 'A' ? 'B' : 'A';
        return {
          batSide: batFirstSide,
          bowlSide: bowlFirstSide,
          batTeam: batFirstSide === 'A' ? s.teamA : s.teamB,
          bowlTeam: bowlFirstSide === 'A' ? s.teamA : s.teamB,
          batPlayers: batFirstSide === 'A' ? s.playersA : s.playersB,
          bowlPlayers: bowlFirstSide === 'A' ? s.playersA : s.playersB
        };
      }

      function syncSetupOpeners() {
        var s = state.setup;
        if (!s) return;
        var bb = getSetupBattingBowling();
        if (!s.customStriker) {
          if (bb.batPlayers.indexOf(s.striker) < 0) s.striker = bb.batPlayers[0] || '';
        }
        if (!s.customNonStriker) {
          if (bb.batPlayers.indexOf(s.nonStriker) < 0 || s.nonStriker === s.striker) {
            s.nonStriker = bb.batPlayers.find(function (p) { return p !== s.striker; }) || '';
          }
        }
        if (!s.customBowler) {
          if (bb.bowlPlayers.indexOf(s.bowler) < 0) s.bowler = bb.bowlPlayers[0] || '';
        }
        if (!s.wicketsManual) {
          var sqLen = Math.max(s.playersA.length, s.playersB.length);
          s.wicketsLimit = sqLen >= 2 ? Math.min(10, sqLen - 1) : 10;
        }
      }

      /* ======================== STORAGE & FIREBASE SYNC ======================== */
      function loadLocal() {
        try {
          var raw = localStorage.getItem(LOCAL_STATE_KEY) || localStorage.getItem('tcp_cricket_matches');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              state.matches = parsed.map(normalizeMatch);
            } else if (parsed && Array.isArray(parsed.matches)) {
              state.matches = parsed.matches.map(normalizeMatch);
              if (parsed.activeMatchId) state.activeMatchId = parsed.activeMatchId;
            }
          }
          var rawTeams = localStorage.getItem(LOCAL_TEAMS_KEY);
          if (rawTeams) {
            var pt = JSON.parse(rawTeams);
            if (Array.isArray(pt)) state.teams = pt;
          }
        } catch (e) {}
        sortMatches();
      }

      function saveLocalState() {
        try {
          localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify({
            matches: state.matches,
            activeMatchId: state.activeMatchId
          }));
        } catch (e) {}
      }

      function saveLocalTeams() {
        try {
          localStorage.setItem(LOCAL_TEAMS_KEY, JSON.stringify(state.teams));
        } catch (e) {}
      }

      async function persistState() {
        var active = getActiveMatch();
        if (active) active.updatedAt = Date.now();
        sortMatches();
        saveLocalState();
        if (state.mode === 'cloud' && fb.enabled && fb.db) {
          if (!hasRealAdminRights()) {
            showToast('Admin login required to save changes', true);
            return;
          }
          try {
            state.syncState = 'syncing';
            updateHeader();
            await fb.db.collection('tcp_cricket').doc('state').set({
              matches: state.matches,
              activeMatchId: state.activeMatchId,
              updatedAt: Date.now()
            });
            state.syncState = 'cloud';
            updateHeader();
          } catch (err) {
            state.syncState = 'cloud';
            updateHeader();
            showToast('Cloud sync failed: ' + (err.message || 'Check Firestore rules'), true);
          }
        }
      }

      async function persistTeams() {
        saveLocalTeams();
        if (state.mode === 'cloud' && fb.enabled && fb.db) {
          if (!hasRealAdminRights()) return;
          try {
            state.syncState = 'syncing';
            updateHeader();
            await fb.db.collection('tcp_cricket').doc('teams').set({
              teams: state.teams,
              updatedAt: Date.now()
            });
            state.syncState = 'cloud';
            updateHeader();
          } catch (err) {
            state.syncState = 'cloud';
            updateHeader();
            showToast('Teams cloud sync failed: ' + (err.message || ''), true);
          }
        }
      }

      async function saveAdminsCloud(primaryAdmin, adminsList) {
        if (!fb.enabled || !fb.db) return;
        try {
          state.syncState = 'syncing';
          updateHeader();
          await fb.db.collection('tcp_cricket').doc('admins').set({
            primaryAdmin: primaryAdmin,
            admins: adminsList,
            updatedAt: Date.now()
          });
          // Keep legacy doc in sync if accessible
          fb.db.collection('tcp_config').doc('admins').set({
            primaryAdmin: primaryAdmin,
            admins: adminsList,
            updatedAt: Date.now()
          }).catch(function () {});
          state.syncState = 'cloud';
          updateHeader();
        } catch (err) {
          state.syncState = 'cloud';
          updateHeader();
          showToast('Admin save failed: ' + (err.message || ''), true);
        }
      }

      function initFirebaseAsync() {
        if (typeof firebase === 'undefined') {
          state.mode = 'local';
          state.syncState = 'local';
          updateHeader();
          return;
        }
        try {
          state.syncState = 'syncing';
          updateHeader();
          fb.app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
          fb.auth = firebase.auth();
          fb.db = firebase.firestore();
          fb.enabled = true;
          state.mode = 'cloud';

          fb.auth.getRedirectResult().catch(function () {});

          fb.auth.onAuthStateChanged(function (user) {
            state.user = user && !user.isAnonymous ? user : null;
            if (!isAdmin() && ['setup', 'teams', 'admins'].indexOf(state.currentTab) >= 0) {
              state.currentTab = 'live';
            }
            render();
          });

          // 1. Admins Listener (tcp_cricket/admins with fallback to legacy tcp_config/admins)
          fb.db.collection('tcp_cricket').doc('admins').onSnapshot(
            function (snap) {
              if (snap.exists) {
                var d = snap.data() || {};
                state.primaryAdmin = String(d.primaryAdmin || '').trim().toLowerCase();
                state.admins = Array.isArray(d.admins)
                  ? d.admins.map(function (e) { return String(e).trim().toLowerCase(); }).filter(Boolean)
                  : [];
                render();
              } else {
                fb.db.collection('tcp_config').doc('admins').get().then(function (oldSnap) {
                  if (oldSnap.exists) {
                    var od = oldSnap.data() || {};
                    state.primaryAdmin = String(od.primaryAdmin || '').trim().toLowerCase();
                    state.admins = Array.isArray(od.admins)
                      ? od.admins.map(function (e) { return String(e).trim().toLowerCase(); }).filter(Boolean)
                      : [];
                    render();
                  }
                }).catch(function () {});
              }
            },
            function () {}
          );

          // 2. Teams Listener (tcp_cricket/teams)
          fb.db.collection('tcp_cricket').doc('teams').onSnapshot(
            function (snap) {
              if (snap.exists) {
                var d = snap.data() || {};
                if (Array.isArray(d.teams)) {
                  state.teams = d.teams;
                  saveLocalTeams();
                  render();
                }
              }
            },
            function () {}
          );

          // 3. Matches State Listener (tcp_cricket/state)
          fb.db.collection('tcp_cricket').doc('state').onSnapshot(
            function (snap) {
              if (snap.exists) {
                var d = snap.data() || {};
                if (Array.isArray(d.matches)) {
                  state.matches = d.matches.map(normalizeMatch);
                }
                if (d.activeMatchId) state.activeMatchId = d.activeMatchId;
                sortMatches();
                saveLocalState();
              }
              state.syncState = 'cloud';
              render();
            },
            function () {
              state.mode = 'local';
              state.syncState = 'local';
              render();
            }
          );
        } catch (err) {
          state.mode = 'local';
          state.syncState = 'local';
          render();
        }
      }

          battingTeam: battingTeam,
          bowlingTeam: bowlingTeam,
          battingSide: battingSide,
          bowlingSide: bowlingSide,
          runs: 0,
          wickets: 0,
          balls: 0,
          extras: { wd: 0, nb: 0, b: 0, lb: 0 },
          batters: [
            { name: strikerName || 'Batter 1', runs: 0, balls: 0, fours: 0, sixes: 0, out: false, retiredHurt: false, dismissal: '' },
            { name: nonStrikerName || 'Batter 2', runs: 0, balls: 0, fours: 0, sixes: 0, out: false, retiredHurt: false, dismissal: '' }
          ],
          bowlers: [
            { name: bowlerName || 'Bowler 1', balls: 0, maidens: 0, runs: 0, wickets: 0 }
          ],
          strikerIdx: 0,
          nonStrikerIdx: 1,
          bowlerIdx: 0,
          lastOverBowler: '',
          fow: [],
          oversLog: [],
          currentOverBalls: [],
          currentOverRuns: 0,
          partnershipRuns: 0,

      function createNewMatch(opts) {
        var batFirstSide = opts.tossDecision === 'bat' ? opts.tossWinner : (opts.tossWinner === 'A' ? 'B' : 'A');

        var teamA = opts.teamA || 'TCP Strikers';
        var teamB = opts.teamB || 'TCP Warriors';
        var batFirstTeam = batFirstSide === 'A' ? teamA : teamB;
        var bowlFirstTeam = bowlFirstSide === 'A' ? teamA : teamB;

        var sqA = addUniquePlayers(opts.playersA || [], []).list;
        var sqB = addUniquePlayers(opts.playersB || [], []).list;

        // Guarantee openers are in their respective squads
        if (batFirstSide === 'A') {
          sqA = addUniquePlayers(sqA, [opts.striker, opts.nonStriker]).list;
          sqB = addUniquePlayers(sqB, [opts.bowler]).list;
        } else {
          sqB = addUniquePlayers(sqB, [opts.striker, opts.nonStriker]).list;
          sqA = addUniquePlayers(sqA, [opts.bowler]).list;
        }

        var secondOpeners = bowlFirstSide === 'A' ? sqA : sqB;
        var secondBowlers = batFirstSide === 'A' ? sqA : sqB;

        return normalizeMatch({
          id: uid('m'),
          title: opts.title || 'TCP Weekend Match',
          venue: opts.venue || 'Tamarind Ground',
          date: opts.date || todayStr(),
          oversLimit: Math.max(1, Number(opts.oversLimit) || 10),
          wicketsLimit: Math.max(1, Number(opts.wicketsLimit) || 10),
          teamA: teamA,
          teamB: teamB,
          squads: { A: sqA, B: sqB },
          tossWinner: opts.tossWinner === 'A' ? teamA : teamB,
          tossDecision: opts.tossDecision || 'bat',
          status: 'live',
          result: '',
          target: null,
          currentInnings: 0,
          innings: [
            createInnings(batFirstTeam, bowlFirstTeam, batFirstSide, bowlFirstSide, opts.striker, opts.nonStriker, opts.bowler),
            createInnings(bowlFirstTeam, batFirstTeam, bowlFirstSide, batFirstSide, secondOpeners[0] || 'Opener 1', secondOpeners[1] || 'Opener 2', secondBowlers[0] || 'Bowler 1')

          updatedAt: Date.now()

      function computeResult(m) {
        var i1 = m.innings[0], i2 = m.innings[1];
        if (m.currentInnings === 0 && i2.balls === 0 && i2.runs === 0) {
          return 'No Result (Ended in 1st Innings)';
        }
        var target = m.target || (i1.runs + 1);
        var wLimit = m.wicketsLimit || 10;
        if (i2.runs >= target) {
          var wktsLeft = Math.max(1, wLimit - i2.wickets);
          return i2.battingTeam + ' won by ' + wktsLeft + ' wicket' + (wktsLeft === 1 ? '' : 's');
        }
        if (i1.runs > i2.runs) {
          var margin = i1.runs - i2.runs;
          return i1.battingTeam + ' won by ' + margin + ' run' + (margin === 1 ? '' : 's');
        }
        return 'Match Tied';
      }

      function pushUndoSnapshot(inn) {
        var snap = clone(inn);
        snap.history = [];
        inn.history.push(snap);
        if (inn.history.length > 35) inn.history.shift();
      }

      function scoreBall(type, runsVal, wicketInfo) {
        var m = getActiveMatch();
        if (!m || m.status !== 'live' || !isAdmin()) return;
        var inn = m.innings[m.currentInnings];
        pushUndoSnapshot(inn);

        var striker = inn.batters[inn.strikerIdx];
        var bowler = inn.bowlers[inn.bowlerIdx];
        var r = Number(runsVal) || 0;
        var legal = true;
        var label = String(r);
        var wLimit = m.wicketsLimit || 10;

        if (type === 'run') {
          inn.runs += r;
          striker.runs += r;
          striker.balls += 1;
          if (r === 4) striker.fours += 1;
          if (r === 6) striker.sixes += 1;
          bowler.runs += r;
          inn.partnershipRuns += r;
          inn.partnershipBalls += 1;
          inn.currentOverRuns += r;
        } else if (type === 'wd') {
          legal = false;
          var wTot = 1 + r;
          inn.runs += wTot;
          inn.extras.wd += wTot;
          bowler.runs += wTot;
          inn.partnershipRuns += wTot;
          inn.currentOverRuns += wTot;
          label = r > 0 ? 'Wd+' + r : 'Wd';
        } else if (type === 'nb') {
          legal = false;
          var nTot = 1 + r;
          inn.runs += nTot;
          inn.extras.nb += 1;
          striker.runs += r;
          if (r === 4) striker.fours += 1;
          if (r === 6) striker.sixes += 1;
          bowler.runs += nTot;
          inn.partnershipRuns += nTot;
          inn.currentOverRuns += nTot;
          label = r > 0 ? 'Nb+' + r : 'Nb';
        } else if (type === 'b' || type === 'lb') {
          inn.runs += r;
          inn.extras[type] += r;
          striker.balls += 1;
          inn.partnershipRuns += r;
          inn.partnershipBalls += 1;
          inn.currentOverRuns += r;
          label = r + type.toUpperCase();
        } else if (type === 'wicket') {
          var isRetired = wicketInfo.kind === 'Retired Hurt';
          var outIdx = wicketInfo.outRole === 'nonstriker' ? inn.nonStrikerIdx : inn.strikerIdx;
          var outBatter = inn.batters[outIdx];
          if (isRetired) {
            legal = false;
            outBatter.out = true;
            outBatter.retiredHurt = true;
            outBatter.dismissal = 'retired hurt';
            label = 'RH';
          } else {
            inn.runs += r;
            striker.runs += r;
            striker.balls += 1;
            bowler.runs += r;
            inn.wickets += 1;
            if (wicketInfo.kind !== 'Run Out') bowler.wickets += 1;
            outBatter.out = true;
            outBatter.dismissal = wicketInfo.dismissalText || wicketInfo.kind;
            inn.fow.push(inn.runs + '/' + inn.wickets + ' (' + fmtOvers(inn.balls + 1) + ', ' + outBatter.name + ')');
            inn.partnershipRuns = 0;
            inn.partnershipBalls = 0;
            inn.currentOverRuns += r;
            label = r > 0 ? 'W+' + r : 'W';
          }

          // Bring in new batter if innings continues
          if ((isRetired || inn.wickets < wLimit) && wicketInfo.newBatter) {
            var newName = cleanName(wicketInfo.newBatter);
            m.squads[inn.battingSide] = addUniquePlayers(m.squads[inn.battingSide], [newName]).list;
            var existingIdx = inn.batters.findIndex(function (b) { return b.name.toLowerCase() === newName.toLowerCase(); });
            if (existingIdx >= 0 && inn.batters[existingIdx].retiredHurt) {
              inn.batters[existingIdx].out = false;
              inn.batters[existingIdx].retiredHurt = false;
              inn.batters[existingIdx].dismissal = '';
              if (outIdx === inn.strikerIdx) inn.strikerIdx = existingIdx;
              else inn.nonStrikerIdx = existingIdx;
            } else {
              inn.batters.push({ name: newName, runs: 0, balls: 0, fours: 0, sixes: 0, out: false, retiredHurt: false, dismissal: '' });
              if (outIdx === inn.strikerIdx) inn.strikerIdx = inn.batters.length - 1;
              else inn.nonStrikerIdx = inn.batters.length - 1;
            }
          }
        }

        if (label !== 'RH') inn.currentOverBalls.push(label);
        if (legal) {
          inn.balls += 1;
          bowler.balls += 1;
        }

        // Rotate strike on odd runs
        if (r % 2 === 1 && type !== 'wicket') {
          var tmp = inn.strikerIdx;
          inn.strikerIdx = inn.nonStrikerIdx;
          inn.nonStrikerIdx = tmp;
        }

        var overEnded = false;
        if (legal && inn.balls % 6 === 0) {
          overEnded = true;
          if (inn.currentOverRuns === 0) bowler.maidens += 1;
          inn.oversLog.unshift({
            over: Math.floor(inn.balls / 6),
            bowler: bowler.name,
            runs: inn.currentOverRuns,
            balls: inn.currentOverBalls.slice()
          });
          inn.lastOverBowler = bowler.name;
          inn.currentOverBalls = [];
          inn.currentOverRuns = 0;
          var tmp2 = inn.strikerIdx;
          inn.strikerIdx = inn.nonStrikerIdx;
          inn.nonStrikerIdx = tmp2;
        }

        var maxBalls = m.oversLimit * 6;
        var target = m.currentInnings === 1 ? (m.target || (m.innings[0].runs + 1)) : null;
        var inningsOver = inn.wickets >= wLimit || inn.balls >= maxBalls;
        if (target !== null && inn.runs >= target) inningsOver = true;

        if (inningsOver) {
          if (m.currentInnings === 0) {
            m.target = inn.runs + 1;
            m.status = 'break';
          } else {
            m.status = 'completed';
            m.result = computeResult(m);
          }
        }

        persistState();
        render();

        if (overEnded && !inningsOver) {
          openBowlerModal(true);
        }
      }

      function undoLastBall() {
        var m = getActiveMatch();
        if (!m || !isAdmin()) return;
        var inn = m.innings[m.currentInnings];
        if (!inn.history || !inn.history.length) {
          showToast('Nothing to undo', true);
          return;
        }
        var prev = inn.history.pop();
        prev.history = inn.history;
        m.innings[m.currentInnings] = prev;
        m.status = 'live';
        m.result = '';
        persistState();
        render();
        showToast('Last ball undone');
      }

      /* Rename a player everywhere in a match (squad + batters + bowlers + oversLog + FOW) */
      function renamePlayerInMatch(m, side, oldName, newName) {
        var clean = cleanName(newName);
        if (!clean || clean === oldName) return false;
        var sq = m.squads[side] || [];
        var idx = sq.findIndex(function (p) { return p === oldName; });
        if (idx >= 0) sq[idx] = clean;

        m.innings.forEach(function (inn) {
          if (inn.battingSide === side) {
            inn.batters.forEach(function (b) { if (b.name === oldName) b.name = clean; });
            inn.fow = inn.fow.map(function (f) { return f.split(oldName).join(clean); });
          }
          if (inn.bowlingSide === side) {
            inn.bowlers.forEach(function (bw) { if (bw.name === oldName) bw.name = clean; });
            inn.oversLog.forEach(function (o) { if (o.bowler === oldName) o.bowler = clean; });
            if (inn.lastOverBowler === oldName) inn.lastOverBowler = clean;
            inn.batters.forEach(function (b) {
              if (b.dismissal) b.dismissal = b.dismissal.split(oldName).join(clean);
            });
          }
        });
        return true;
      }

      function isPlayerUsedInMatch(m, side, name) {
        var used = false;
        m.innings.forEach(function (inn) {
          if (inn.battingSide === side && inn.batters.some(function (b) { return b.name === name; })) used = true;
          if (inn.bowlingSide === side && inn.bowlers.some(function (bw) { return bw.name === name; })) used = true;
        });
        return used;
      }

      /* ======================== WHATSAPP SHARING & CANVAS ======================== */
      function buildWhatsAppQuick(m) {
        var i1 = m.innings[0], i2 = m.innings[1];
        var inn = m.innings[m.currentInnings];
        var lines = [];
        lines.push('🏏 *TAMARIND CRICKET PLAYERS (TCP)*');
        lines.push('*' + m.title + '*');
        lines.push('_' + m.venue + ' • ' + m.date + '_');
        lines.push('━━━━━━━━━━━━━━━━━━');

        if (m.status === 'completed') {
          lines.push('🏆 *' + (m.result || computeResult(m)) + '*');
          lines.push('');
        } else if (m.status === 'break') {
          lines.push('⏸️ *Innings Break • Target: ' + (m.target || (i1.runs + 1)) + '*');
          lines.push('');
        }

        lines.push('*' + i1.battingTeam + ':* *' + i1.runs + '/' + i1.wickets + '* (' + fmtOvers(i1.balls) + '/' + m.oversLimit + ' ov)');
        if (m.currentInnings === 1 || i2.balls > 0 || i2.runs > 0) {
          lines.push('*' + i2.battingTeam + ':* *' + i2.runs + '/' + i2.wickets + '* (' + fmtOvers(i2.balls) + '/' + m.oversLimit + ' ov)');
        }
        if (m.status === 'live') {
          lines.push('CRR: ' + calcRR(inn.runs, inn.balls) + ' • Pship: ' + inn.partnershipRuns + '(' + inn.partnershipBalls + ')');
          if (m.currentInnings === 1) {
            var target = m.target || (i1.runs + 1);
            var need = Math.max(0, target - i2.runs);
            var rem = Math.max(0, (m.oversLimit * 6) - i2.balls);
            lines.push('🎯 Need *' + need + '* runs in *' + rem + '* balls (RRR: ' + calcRR(need, rem) + ')');
          }
        }
        lines.push('━━━━━━━━━━━━━━━━━━');
        var topBat = inn.batters.slice().sort(function (a, b) { return b.runs - a.runs; }).slice(0, 3);
        if (topBat.length) {
          lines.push('*Batting:*');
          topBat.forEach(function (b) {
            lines.push('• ' + b.name + ': *' + b.runs + (b.out ? '' : '✱') + '* (' + b.balls + 'b, ' + b.fours + '×4, ' + b.sixes + '×6)');
          });
        }
        var topBowl = inn.bowlers.slice().sort(function (a, b) { return (b.wickets - a.wickets) || (a.runs - b.runs); }).slice(0, 3);
        if (topBowl.length) {
          lines.push('*Bowling:*');
          topBowl.forEach(function (bw) {
            lines.push('• ' + bw.name + ': *' + bw.wickets + '/' + bw.runs + '* (' + fmtOvers(bw.balls) + ' ov)');
          });
        }
        lines.push('');
        lines.push('_Scored live on Tamarind Cricket Players (TCP)_');
        return lines.join('\n');
      }

      function buildWhatsAppFull(m) {
        var lines = [];
        lines.push('🏏 *TAMARIND CRICKET PLAYERS (TCP)*');
        lines.push('*' + m.title + '* (' + m.oversLimit + ' ov)');
        lines.push('_' + m.venue + ' • ' + m.date + '_');
        if (m.result) lines.push('🏆 *' + m.result + '*');
        m.innings.forEach(function (inn, idx) {
          if (idx === 1 && m.currentInnings === 0 && inn.balls === 0 && inn.runs === 0) return;
          lines.push('━━━━━━━━━━━━━━━━━━');
          lines.push('*' + (idx === 0 ? '1st' : '2nd') + ' Inn — ' + inn.battingTeam + ': ' + inn.runs + '/' + inn.wickets + '* (' + fmtOvers(inn.balls) + ' ov)');
          inn.batters.forEach(function (b) {
            lines.push('• ' + b.name + ': *' + b.runs + (b.out ? '' : '✱') + '* (' + b.balls + 'b) ' + (b.out ? '_' + (b.dismissal || 'out') + '_' : '_not out_'));
          });
          var ytb = getYetToBatPlayers(m, idx);
          if (ytb.length) lines.push('Yet to Bat: ' + ytb.join(', '));
          var exTot = inn.extras.wd + inn.extras.nb + inn.extras.b + inn.extras.lb;
          lines.push('Extras: ' + exTot + ' (wd ' + inn.extras.wd + ', nb ' + inn.extras.nb + ', b ' + inn.extras.b + ', lb ' + inn.extras.lb + ')');
          if (inn.fow.length) lines.push('FOW: ' + inn.fow.join(', '));
          lines.push('*Bowling:*');
          inn.bowlers.forEach(function (bw) {
            lines.push('• ' + bw.name + ': ' + fmtOvers(bw.balls) + '-' + bw.maidens + '-' + bw.runs + '-' + bw.wickets);
          });
        });
        lines.push('');
        lines.push('_Tamarind Cricket Players (TCP)_');
        return lines.join('\n');
      }

      function drawShareCanvas(m) {
        var canvas = document.getElementById('share-scorecard-canvas');
        if (!canvas || !m) return;
        var ctx = canvas.getContext('2d');
        var W = 1080, H = 1350;
        canvas.width = W; canvas.height = H;

        var grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, '#0b1120');
        grad.addColorStop(0.55, '#0f172a');
        grad.addColorStop(1, '#064e3b');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#34d399';
        ctx.font = 'bold 34px sans-serif';
        ctx.fillText('TAMARIND CRICKET PLAYERS (TCP)', 70, 95);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 50px sans-serif';
        ctx.fillText(String(m.title || '').slice(0, 32), 70, 165);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '28px sans-serif';
        ctx.fillText(m.venue + '  •  ' + m.date + '  •  ' + m.oversLimit + ' Ov', 70, 215);

        function drawInnBox(inn, y) {
          ctx.fillStyle = 'rgba(17, 24, 39, 0.88)';
          ctx.fillRect(70, y, W - 140, 175);
          ctx.strokeStyle = 'rgba(52, 211, 153, 0.38)';
          ctx.lineWidth = 3;
          ctx.strokeRect(70, y, W - 140, 175);

          ctx.fillStyle = '#cbd5e1';
          ctx.font = 'bold 34px sans-serif';
          ctx.fillText(inn.battingTeam, 105, y + 62);

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 68px sans-serif';
          ctx.fillText(inn.runs + '/' + inn.wickets, 105, y + 142);

          ctx.fillStyle = '#34d399';
          ctx.font = 'bold 36px sans-serif';
          ctx.fillText('(' + fmtOvers(inn.balls) + ' / ' + m.oversLimit + ' ov)', 390, y + 136);
        }

        drawInnBox(m.innings[0], 260);
        drawInnBox(m.innings[1], 465);

        if (m.result) {
          ctx.fillStyle = '#fbbf24';
          ctx.font = 'bold 36px sans-serif';
          ctx.fillText('🏆 ' + m.result, 70, 710);
        } else if (m.status === 'break') {
          ctx.fillStyle = '#fbbf24';
          ctx.font = 'bold 36px sans-serif';
          ctx.fillText('INNINGS BREAK • TARGET: ' + (m.target || (m.innings[0].runs + 1)), 70, 710);
        }

        var inn = m.innings[m.currentInnings];
        ctx.fillStyle = '#34d399';
        ctx.font = 'bold 30px sans-serif';
        ctx.fillText('TOP BATTERS (' + inn.battingTeam + ')', 70, 795);

        var y = 850;
        ctx.fillStyle = '#f8fafc';
        ctx.font = '30px sans-serif';
        inn.batters.slice().sort(function (a, b) { return b.runs - a.runs; }).slice(0, 4).forEach(function (b) {
          ctx.fillText(b.name + ': ' + b.runs + (b.out ? '' : '*') + ' (' + b.balls + 'b, ' + b.fours + 'x4, ' + b.sixes + 'x6)', 70, y);
          y += 50;
        });

        y += 28;
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 30px sans-serif';
        ctx.fillText('TOP BOWLERS', 70, y);
        y += 50;
        ctx.fillStyle = '#f8fafc';
        ctx.font = '30px sans-serif';
        inn.bowlers.slice().sort(function (a, b) { return (b.wickets - a.wickets) || (a.runs - b.runs); }).slice(0, 3).forEach(function (bw) {
          ctx.fillText(bw.name + ': ' + bw.wickets + '/' + bw.runs + ' (' + fmtOvers(bw.balls) + ' ov)', 70, y);
          y += 50;
        });

        ctx.fillStyle = '#64748b';
        ctx.font = '24px sans-serif';
        ctx.fillText('Scored live with Tamarind Cricket Players (TCP)', 70, H - 55);
      }

          if (state.syncState === 'cloud') {
            pill.className = 'sync-pill sync-cloud';
            pillText.textContent = 'Live Cloud';
          } else if (state.syncState === 'syncing') {
            pill.className = 'sync-pill sync-working';
            pillText.textContent = 'Syncing...';
          } else {

          }

        document.getElementById('nav-admins').classList.toggle('hidden', !admin);

      function pillClass(lbl) {
        if (lbl.indexOf('W') === 0 && lbl.indexOf('Wd') !== 0) return 'pill-wicket';
        if (lbl === '4') return 'pill-four';
        if (lbl === '6') return 'pill-six';
        if (lbl === '0') return 'pill-dot';
        if (lbl.indexOf('Wd') >= 0 || lbl.indexOf('Nb') >= 0 || lbl.indexOf('B') >= 0) return 'pill-extra';
        return 'pill-run';
      }

      /* Match History View */
      function renderHistoryView() {
        var admin = isAdmin();
        var q = state.historySearch.trim().toLowerCase();
        var list = state.matches.filter(function (m) {
          if (state.historyFilter === 'active' && m.status === 'completed') return false;
          if (state.historyFilter === 'completed' && m.status !== 'completed') return false;
          if (q) {
            var allPlayers = ((m.squads && m.squads.A) ? m.squads.A : []).concat((m.squads && m.squads.B) ? m.squads.B : []).join(' ');
            var hay = (m.title + ' ' + m.teamA + ' ' + m.teamB + ' ' + m.venue + ' ' + allPlayers).toLowerCase();
            if (hay.indexOf(q) < 0) return false;
          }
          return true;
        });

        return (
          '<div class="stack">' +
            '<div class="card card-pad stack-sm">' +
              '<div class="row-between">' +
                '<div class="font-extrabold text-sm">Match History (' + state.matches.length + ')</div>' +
                '<div class="row">' +
                  (admin ? '<button type="button" class="btn btn-xs btn-subtle" data-action="export-json">Export JSON</button>' : '') +
                  (admin ? '<button type="button" class="btn btn-xs btn-subtle" data-action="import-json">Import</button>' : '') +
                '</div>' +
              '</div>' +
              '<input type="text" id="history-search-input" class="field-input field-input-sm" placeholder="Search by team, player name, venue, or match..." value="' + esc(state.historySearch) + '" />' +
              '<div class="row-wrap">' +
                '<button type="button" class="filter-chip ' + (state.historyFilter === 'all' ? 'active' : '') + '" data-action="hist-filter" data-val="all">All</button>' +
                '<button type="button" class="filter-chip ' + (state.historyFilter === 'active' ? 'active' : '') + '" data-action="hist-filter" data-val="active">Live / Break</button>' +
                '<button type="button" class="filter-chip ' + (state.historyFilter === 'completed' ? 'active' : '') + '" data-action="hist-filter" data-val="completed">Completed</button>' +
              '</div>' +
            '</div>' +
            (list.length
              ? list.map(function (m) {
                  var bClass = m.status === 'completed' ? 'badge-done' : (m.status === 'break' ? 'badge-break' : 'badge-live');
                  return '<div class="card card-pad stack-sm">' +
                    '<div class="row-between">' +
                      '<div><div class="font-extrabold text-sm">' + esc(m.title) + '</div><div class="text-xs muted">' + esc(m.venue) + ' • ' + esc(m.date) + ' • ' + m.oversLimit + ' ov</div></div>' +
                      '<span class="badge ' + bClass + '">' + m.status.toUpperCase() + '</span>' +
                    '</div>' +
                    '<div class="text-sm font-bold">' +
                      esc(m.innings[0].battingTeam) + ': ' + m.innings[0].runs + '/' + m.innings[0].wickets + ' (' + fmtOvers(m.innings[0].balls) + ')<br>' +
                      esc(m.innings[1].battingTeam) + ': ' + m.innings[1].runs + '/' + m.innings[1].wickets + ' (' + fmtOvers(m.innings[1].balls) + ')' +
                    '</div>' +
                    (m.result ? '<div class="text-xs font-extrabold text-emerald">🏆 ' + esc(m.result) + '</div>' : '') +
                    '<div class="row-wrap">' +
                      '<button type="button" class="btn btn-xs btn-primary" data-action="open-match" data-id="' + m.id + '">' + (m.status === 'completed' ? 'View Card' : 'Open / Resume') + '</button>' +
                      '<button type="button" class="btn btn-xs btn-wa-soft" data-action="open-share" data-id="' + m.id + '">WhatsApp</button>' +
                      (admin ? '<button type="button" class="btn btn-xs btn-subtle" data-action="open-edit" data-id="' + m.id + '">Edit</button>' : '') +
                      (admin ? '<button type="button" class="btn btn-xs btn-rose" data-action="confirm-delete" data-id="' + m.id + '">Delete</button>' : '') +
                    '</div>' +
                  '</div>';
                }).join('')
              : '<div class="card card-pad text-center muted text-sm">No matches found.</div>') +
          '</div>'
        );
      }

      /* Match Setup View with Inline Squad Builders & Smart Opener Dropdowns */

        var players = side === 'A' ? s.playersA : s.playersB;
        var showBulk = side === 'A' ? s.showBulkA : s.showBulkB;

        return (
          '<div class="squad-box">' +
            '<div class="row-between">' +
              '<span class="font-extrabold text-xs ' + (side === 'A' ? 'text-emerald' : 'text-sky') + '">Team ' + side + ' Squad <span class="badge badge-muted" style="margin-left:4px;">' + players.length + '</span></span>' +
              '<select class="field-select field-input-sm" style="width:auto; max-width:165px;" data-setup-load-team="' + side + '">' +
                '<option value="">Load Saved Team...</option>' +
                state.teams.map(function (t) { return '<option value="' + t.id + '">' + esc(t.name) + ' (' + t.players.length + ')</option>'; }).join('') +
              '</select>' +
            '</div>' +
            '<input class="field-input field-input-sm" data-setup-field="' + (side === 'A' ? 'teamA' : 'teamB') + '" value="' + esc(teamName) + '" placeholder="Team ' + side + ' Name" />' +

              '<input id="setup-add-inp-' + side + '" class="field-input field-input-sm" placeholder="Add player name..." />' +
              '<button type="button" class="btn btn-xs btn-primary" data-action="setup-add-one" data-side="' + side + '">+ Add</button>' +

                  '<textarea id="setup-bulk-' + side + '" class="field-textarea text-xs" placeholder="Paste WhatsApp list (1. Ravi, 2. Arjun...)"></textarea>' +
                  '<button type="button" class="btn btn-xs btn-emerald-soft" data-action="setup-add-bulk" data-side="' + side + '">Add All to Team ' + side + '</button>' +
                '</div>'
              : '') +
            '<div class="row-wrap">' +
              (players.length
                ? players.map(function (p, idx) {

                : '<span class="text-xs muted">Add players to populate opener & bowler dropdowns.</span>') +

          '</div>'

      function renderSetupView() {
        if (!state.setup) initSetupDraft();

        var bb = getSetupBattingBowling();
        var presets = [6, 8, 10, 12, 15, 20];

        function buildOptions(list, selectedVal, excludeVal) {
          var html = list.filter(function (p) { return !excludeVal || p !== excludeVal; }).map(function (p) {
            return '<option value="' + esc(p) + '" ' + (p === selectedVal ? 'selected' : '') + '>' + esc(p) + '</option>';

          html += '<option value="__NEW__">+ Add new player...</option>';
          return html;
        }

        return (
          '<div class="stack">' +
            '<div class="banner banner-emerald">' +
              '<div>' +
                '<div class="font-extrabold text-sm text-emerald">New Match & Team Squads</div>' +
                '<div class="text-xs muted">Build squads inline or load from Saved Teams</div>' +
              '</div>' +
              '<button type="button" class="btn btn-xs btn-subtle" data-action="load-demo">Load Demo T20 Chase</button>' +
            '</div>' +
            '<form id="new-match-form" class="card card-pad stack">' +
              '<div><label class="field-label">Match Title / Series</label><input class="field-input field-input-sm" data-setup-field="title" value="' + esc(s.title) + '" required /></div>' +

                '<span>Save / update these squads in Saved Teams library</span>' +
              '</label>' +
              '<div class="form-grid-2">' +
                '<div>' +

                '<div><label class="field-label">Toss Winner</label>' +
                  '<select class="field-select field-input-sm" data-setup-field="tossWinner">' +

                '</div>' +
              '</div>' +
              '<button type="submit" class="btn btn-primary btn-full">Start Live Match</button>' +
            '</form>' +

                              ? '<button type="button" class="btn btn-xs btn-rose" data-action="remove-admin" data-email="' + esc(em) + '">Remove</button>'
                              : '<span class="badge badge-live">OWNER</span>') +
                          '</div>';
                        }).join('')
                      : '<div class="text-xs muted">No additional admins added yet.</div>') +
                  '</div>'
                : '<div class="banner banner-sky"><span class="text-xs font-bold">Currently in Local Mode. Use Preview Viewer Mode above to test the Read-Only UI.</span></div>') +
            '</div>' +
          '</div>'
        );
      }

      function render() {
        updateHeader();
        var main = document.getElementById('app-main');
        if (!main) return;
        if (state.currentTab === 'live') main.innerHTML = renderLiveView();
        else if (state.currentTab === 'scorecard') main.innerHTML = renderScorecardView();
        else if (state.currentTab === 'history') main.innerHTML = renderHistoryView();
        else if (state.currentTab === 'setup') main.innerHTML = renderSetupView();
        else if (state.currentTab === 'teams') main.innerHTML = renderTeamsView();
        else if (state.currentTab === 'admins') main.innerHTML = renderAdminsView();
      }

      /* ======================== MODALS ======================== */
      function openModal(html, wide) {
        var bd = document.getElementById('modal-backdrop');
        var box = document.getElementById('modal-box');
        box.className = 'modal-box' + (wide ? ' wide' : '');
        box.innerHTML = html;
        bd.classList.add('open');
      }
      function closeModal() {
        document.getElementById('modal-backdrop').classList.remove('open');
      }

        if (state.previewViewer) {

          render();

          openModal(
            '<div class="modal-head"><span class="font-extrabold">Local Mode</span><button type="button" class="icon-btn" data-action="close-modal">✕</button></div>' +

            '<div class="modal-foot"><button type="button" class="btn btn-primary btn-full" data-action="close-modal">OK</button></div>'
          );
          return;
        }
        if (state.user) {
          openModal(
            '<div class="modal-head"><span class="font-extrabold">Account</span><button type="button" class="icon-btn" data-action="close-modal">✕</button></div>' +
            '<div class="modal-scroll stack-sm">' +
              '<div class="text-sm">Signed in as <strong>' + esc(state.user.email) + '</strong></div>' +
              '<div class="text-xs muted">Role: <strong class="' + (hasRealAdminRights() ? 'text-emerald' : 'text-amber') + '">' + (hasRealAdminRights() ? 'TCP Admin' : 'Viewer (Read-Only)') + '</strong></div>' +

          '<div class="modal-scroll stack">' +
            '<button type="button" class="btn btn-google btn-full" data-action="google-signin">Continue with Google</button>' +
            '<div class="text-center text-xs muted">— or use Email & Password —</div>' +

            '</button>' +
          '</div>'

      function openExtraModal(type) {
        var names = { wd: 'Wide', nb: 'No Ball', b: 'Bye', lb: 'Leg Bye' };
        openModal(
          '<div class="modal-head"><span class="font-extrabold">' + names[type] + ' — Additional Runs</span><button type="button" class="icon-btn" data-action="close-modal">✕</button></div>' +

      /* Squad-Integrated Change Bowler / End of Over Modal */
      function openBowlerModal(isEndOfOver) {
        var m = getActiveMatch();
        if (!m || !isAdmin()) return;
        var inn = m.innings[m.currentInnings];
        var sq = getInningsSquads(m, m.currentInnings);

        var bowlerMap = {};
        inn.bowlers.forEach(function (bw) { bowlerMap[bw.name.toLowerCase()] = bw; });

        var listHtml = sq.bowling.map(function (name) {
          var bw = bowlerMap[name.toLowerCase()];
          var fig = bw ? (fmtOvers(bw.balls) + '-' + bw.maidens + '-' + bw.runs + '-' + bw.wickets) : '0.0-0-0-0';
          var wasLast = inn.lastOverBowler && inn.lastOverBowler.toLowerCase() === name.toLowerCase();
          return '<button type="button" class="bowler-pick-btn" data-action="pick-squad-bowler" data-name="' + esc(name) + '">' +
            '<div><div class="font-bold text-sm">' + esc(name) + '</div><div class="text-xs muted">' + fig + '</div></div>' +
            (wasLast ? '<span class="badge badge-break">Bowled last over</span>' : '<span class="badge badge-live">Select</span>') +
          '</button>';

        openModal(
          '<div class="modal-head"><span class="font-extrabold">' + (isEndOfOver ? 'End of Over — Pick Next Bowler' : 'Change Bowler') + '</span><button type="button" class="icon-btn" data-action="close-modal">✕</button></div>' +
