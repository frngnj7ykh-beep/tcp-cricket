<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tamarind Cricket Players (TCP) — Live Cricket Scorer</title>
  <style>
    /* =========================================================================
       TAMARIND CRICKET PLAYERS (TCP) — DARK BROADCAST THEME
       100% Self-Contained CSS (Zero External CSS/Icon CDNs)
       ========================================================================= */
    :root {
      --bg-page: #0b1120;
      --bg-card: #111827;
      --bg-card-2: #1a2335;
      --bg-input: #0d1526;
      --bg-subtle: #1f2937;
      --border: #243045;
      --border-light: #334155;
      --text-main: #f8fafc;
      --text-sec: #cbd5e1;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --emerald-dark: #059669;
      --emerald-bg: rgba(16, 185, 129, 0.14);
      --emerald-border: rgba(16, 185, 129, 0.36);
      --amber: #f59e0b;
      --amber-bright: #fbbf24;
      --amber-bg: rgba(245, 158, 11, 0.16);
      --amber-border: rgba(245, 158, 11, 0.36);
      --rose: #e11d48;
      --rose-bright: #fb7185;
      --rose-bg: rgba(225, 29, 72, 0.16);
      --rose-border: rgba(225, 29, 72, 0.38);
      --sky: #38bdf8;
      --sky-bg: rgba(56, 189, 248, 0.16);
      --sky-border: rgba(56, 189, 248, 0.36);
      --indigo-bg: rgba(99, 102, 241, 0.22);
      --indigo-text: #a5b4fc;
      --indigo-border: rgba(129, 140, 248, 0.38);
      --wa-green: #25d366;
      --wa-bubble: #005c4b;
      --wa-bubble-border: #0a725e;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.4;
      overscroll-behavior-y: none;
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    a { text-decoration: none; color: inherit; }

    /* ==================== STATIC STICKY COMPACT HEADER ==================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 17, 32, 0.97);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .header-inner {
      max-width: 780px;
      margin: 0 auto;
      padding: 8px 10px 7px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      min-width: 0;
      flex-shrink: 1;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #10b981, #047857);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.35);
      flex-shrink: 0;
    }

    .brand-text-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-top-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title {
      font-weight: 900;
      font-size: 14.5px;
      letter-spacing: 0.02em;
      line-height: 1.05;
      color: var(--emerald-bright);
    }

    .brand-sub {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-sec);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 999px;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .sync-cloud { color: var(--emerald-bright); background: var(--emerald-bg); border: 1px solid var(--emerald-border); }
    .sync-working { color: var(--amber-bright); background: var(--amber-bg); border: 1px solid var(--amber-border); }
    .sync-local { color: var(--sky); background: var(--sky-bg); border: 1px solid var(--sky-border); }

    .sync-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    .auth-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .auth-pill-viewer {
      background: var(--bg-card-2);
      color: var(--text-sec);
      border: 1px solid var(--border-light);
    }

    .auth-pill-admin {
      background: var(--emerald-bg);
      color: var(--emerald-bright);
      border: 1px solid var(--emerald-border);
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 3px;
      background: var(--bg-card);
      padding: 3px;
      border-radius: 11px;
      border: 1px solid var(--border);
      width: 100%;
    }

    .nav-tab {
      flex: 1;
      padding: 6px 4px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      min-width: 0;
    }

    .nav-tab:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }
    .nav-tab.active {
      background: var(--emerald-dark);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
    }

    .nav-tab svg { width: 13px; height: 13px; flex-shrink: 0; }

    .nav-badge {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 999px;
      min-width: 16px;
      text-align: center;
      line-height: 1.3;
    }

    .nav-tab.active .nav-badge { background: rgba(0, 0, 0, 0.25); }

    @media (max-width: 400px) {
      .nav-tab { font-size: 10.5px; gap: 3px; padding: 6px 2px; }
      .nav-tab svg { display: none; }
      .brand-sub { max-width: 135px; }
    }

    /* ==================== MAIN LAYOUT & UTILITIES ==================== */
    .app-main {
      max-width: 780px;
      margin: 0 auto;
      padding: 12px 10px 80px;
    }

    .stack { display: flex; flex-direction: column; gap: 12px; }
    .stack-sm { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .hidden { display: none !important; }

    .text-xs { font-size: 11.5px; }
    .text-sm { font-size: 13px; }
    .text-center { text-align: center; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .muted { color: var(--text-muted); }
    .text-emerald { color: var(--emerald-bright); }
    .text-amber { color: var(--amber-bright); }
    .text-rose { color: var(--rose-bright); }
    .text-sky { color: var(--sky); }

    /* ==================== CARDS & BROADCAST SCOREBOARD ==================== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .card-pad { padding: 14px; }

    .card-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255, 255, 255, 0.02);
    }

    .card-header-title {
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .scoreboard {
      background: linear-gradient(145deg, #13203b 0%, #0f172a 55%, #073b2f 100%);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sb-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sb-match-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-sec);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .sb-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
    .sb-team { font-size: 14px; font-weight: 800; color: var(--text-main); }
    .sb-score-line { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
    .sb-score { font-size: 36px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; color: #ffffff; }
    .sb-overs { font-size: 13px; font-weight: 700; color: var(--emerald-bright); }

    .sb-crr-box {
      background: rgba(11, 17, 32, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 6px 11px;
      text-align: center;
      flex-shrink: 0;
    }

    .sb-crr-label { font-size: 9.5px; font-weight: 800; letter-spacing: 0.08em; color: var(--text-muted); }
    .sb-crr-val { font-size: 17px; font-weight: 900; color: var(--emerald-bright); line-height: 1.15; }

    .sb-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
      color: var(--text-sec);
    }

    .target-pill {
      background: var(--amber-bg);
      color: var(--amber-bright);
      border: 1px solid var(--amber-border);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }

    /* ==================== BADGES & BANNERS ==================== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .badge-live { background: var(--emerald-bg); color: var(--emerald-bright); border: 1px solid var(--emerald-border); }
    .badge-break { background: var(--amber-bg); color: var(--amber-bright); border: 1px solid var(--amber-border); }
    .badge-done { background: var(--sky-bg); color: var(--sky); border: 1px solid var(--sky-border); }
    .badge-active-match { background: var(--indigo-bg); color: var(--indigo-text); border: 1px solid var(--indigo-border); }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald-bright);
      animation: pulse-dot 1.4s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .banner {
      border-radius: var(--radius-md);
      padding: 11px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .banner-amber { background: var(--amber-bg); border: 1px solid var(--amber-border); }
    .banner-emerald { background: var(--emerald-bg); border: 1px solid var(--emerald-border); }
    .banner-sky { background: var(--sky-bg); border: 1px solid var(--sky-border); }
    .banner-error { background: var(--rose-bg); border: 1px solid var(--rose-border); color: #ffe4e6; border-radius: var(--radius-md); padding: 14px; }

    /* ==================== INFO PILLS ==================== */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .info-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .info-pill-label { font-size: 11px; font-weight: 700; color: var(--text-muted); }
    .info-pill-val { font-size: 13px; font-weight: 800; color: var(--text-main); }
    .info-pill-val span { font-size: 11px; font-weight: 600; color: var(--text-muted); }

    /* ==================== BUTTONS ==================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    .btn-sm { padding: 8px 12px; font-size: 12.5px; border-radius: 10px; }
    .btn-xs { padding: 5px 9px; font-size: 11.5px; border-radius: 8px; gap: 4px; }
    .btn-full { width: 100%; }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .btn-subtle { background: var(--bg-subtle); color: var(--text-main); border: 1px solid var(--border-light); }
    .btn-emerald-soft { background: var(--emerald-bg); color: var(--emerald-bright); border: 1px solid var(--emerald-border); }
    .btn-sky-soft { background: var(--sky-bg); color: var(--sky); border: 1px solid var(--sky-border); }
    .btn-rose { background: var(--rose); color: #ffffff; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); }
    .btn-wa { background: var(--wa-green); color: #052e16; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.28); }
    .btn-wa-soft { background: rgba(37, 211, 102, 0.14); color: #4ade80; border: 1px solid rgba(37, 211, 102, 0.35); }
    .btn-google { background: #ffffff; color: #0f172a; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }
    .icon-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.1); }

    /* ==================== TABLES ==================== */
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    thead th {
      text-align: left;
      padding: 8px 10px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody td { padding: 9px 10px; border-bottom: 1px solid rgba(36, 48, 69, 0.7); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .striker-row { background: rgba(16, 185, 129, 0.07); }
    .player-cell { display: flex; align-items: center; gap: 6px; min-width: 110px; }
    .striker-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--emerald-bright); flex-shrink: 0; box-shadow: 0 0 8px rgba(52, 211, 153, 0.8); }
    .nonstriker-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-light); flex-shrink: 0; }
    .player-name { font-weight: 700; color: var(--text-main); }
    .player-name-btn { font-weight: 700; color: var(--text-main); text-align: left; padding: 2px 0; }
    .player-name-btn:hover { color: var(--emerald-bright); }
    .player-dismissal { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

    /* ==================== THIS OVER PILLS ==================== */
    .over-strip {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(11, 17, 32, 0.45);
    }
    .over-strip-label { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); white-space: nowrap; }
    .ball-pills { display: flex; align-items: center; gap: 5px; overflow-x: auto; padding-bottom: 1px; }
    .ball-pills-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .ball-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 27px;
      height: 27px;
      padding: 0 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .pill-dot { background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border-light); }
    .pill-run { background: #1e3a5f; color: #e0f2fe; border: 1px solid rgba(56, 189, 248, 0.35); }
    .pill-four { background: var(--emerald-dark); color: #ffffff; }
    .pill-six { background: #7c3aed; color: #ffffff; }
    .pill-wicket { background: var(--rose); color: #ffffff; }
    .pill-extra { background: var(--amber-bg); color: var(--amber-bright); border: 1px solid var(--amber-border); }

    /* ==================== SCORING KEYPAD ==================== */
    .keypad-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-shadow: var(--shadow-sm);
    }
    .keypad-runs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
    .key-run {
      height: 50px;
      border-radius: 13px;
      background: var(--bg-card-2);
      border: 1px solid var(--border-light);
      color: var(--text-main);
      font-size: 19px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .key-four { background: rgba(16, 185, 129, 0.22); border-color: var(--emerald); color: var(--emerald-bright); }
    .key-six { background: rgba(124, 58, 237, 0.24); border-color: #8b5cf6; color: #ddd6fe; }
    .keypad-extras { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .key-extra {
      height: 42px;
      border-radius: 11px;
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      color: var(--amber-bright);
      font-size: 12.5px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .key-bye { background: var(--sky-bg); border-color: rgba(56, 189, 248, 0.35); color: var(--sky); }
    .key-out { background: var(--rose); border-color: #f43f5e; color: #ffffff; box-shadow: 0 3px 10px rgba(225, 29, 72, 0.35); }
    .keypad-utils { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }

    /* ==================== FORMS & INPUTS ==================== */
    .field-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; }
    .mini-label { display: block; font-size: 10px; font-weight: 700; color: var(--text-dim); margin-bottom: 3px; }
    .field-input, .field-select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 13.5px;
      color: var(--text-main);
      outline: none;
    }
    .field-input:focus, .field-select:focus { border-color: var(--emerald); box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.22); }
    .field-input-sm { padding: 7px 9px; font-size: 12.5px; border-radius: 9px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 520px) { .form-grid-3 { grid-template-columns: 1fr; } }

    .pill-choice {
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border-light);
      color: var(--text-sec);
      font-size: 12.5px;
      font-weight: 800;
      text-align: center;
    }
    .pill-choice.active { background: var(--emerald-bg); border-color: var(--emerald); color: var(--emerald-bright); }

    /* ==================== SEGMENTED TABS & FILTER CHIPS ==================== */
    .seg-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
    }
    .seg-tabs-2 { grid-template-columns: repeat(2, 1fr); }
    .seg-tab {
      padding: 8px 6px;
      border-radius: 9px;

        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')

          commentary: Array.isArray(inn.commentary) ? inn.commentary : []

      }

      const t2 = String(m.team2 || 'Team B');

        team2: t2,
        tossWinner: String(m.tossWinner || t1),
        tossDecision: m.tossDecision === 'bowl' ? 'bowl' : 'bat',
        status: ['live', 'innings_break', 'completed'].includes(m.status) ? m.status : 'live',
        resultText: String(m.resultText || ''),
        currentInningsIndex: m.currentInningsIndex === 1 ? 1 : 0,
        innings: [cleanInn(m.innings[0], t1, t2), cleanInn(m.innings[1], t2, t1)],
        createdAt: Number(m.createdAt) || Date.now(),
        updatedAt: Number(m.updatedAt) || Date.now()
      };
    }

    function sortMatches() {
      state.matches.sort((a, b) => (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0));
    }

    function getActiveMatch() {
      if (!state.activeMatchId) return state.matches[0] || null;
      return state.matches.find(m => m.id === state.activeMatchId) || state.matches[0] || null;
    }

    function getMatchById(id) {
      return state.matches.find(m => m.id === id) || null;
    }

    function formatOvers(legalBalls) {
      const b = Math.max(0, Number(legalBalls) || 0);
      return Math.floor(b / 6) + '.' + (b % 6);
    }

    function parseOversToBalls(val) {
      const str = String(val == null ? '0' : val).trim();
      if (!str) return 0;
      const parts = str.split('.');
      const ov = Math.max(0, parseInt(parts[0], 10) || 0);
      const rem = Math.max(0, Math.min(5, parseInt(parts[1] || '0', 10) || 0));
      return ov * 6 + rem;
    }

    function calcRunRate(runs, legalBalls) {
      if (!legalBalls || legalBalls <= 0) return '0.00';
      return ((runs / legalBalls) * 6).toFixed(2);
    }

    function calcStrikeRate(runs, balls) {
      if (!balls || balls <= 0) return '0.0';
      return ((runs / balls) * 100).toFixed(1);
    }

    function calcEconomy(runsConceded, legalBalls) {
      if (!legalBalls || legalBalls <= 0) return '0.00';
      return ((runsConceded / legalBalls) * 6).toFixed(2);
    }

    function getBatter(inn, id) {
      return inn.batters.find(b => b.id === id) || null;
    }

    function getBowler(inn, id) {
      return inn.bowlers.find(b => b.id === id) || null;
    }

    function addBatter(inn, name) {
      const clean = String(name || '').trim() || ('Batter ' + (inn.batters.length + 1));
      const batter = {
        id: uid('bat'),
        name: clean,
        runs: 0, balls: 0, fours: 0, sixes: 0,
        isOut: false,
        dismissalText: 'not out'
      };
      inn.batters.push(batter);
      return batter;
    }

    function findOrCreateBowler(inn, name) {
      const clean = String(name || '').trim() || ('Bowler ' + (inn.bowlers.length + 1));
      const existing = inn.bowlers.find(b => b.name.toLowerCase() === clean.toLowerCase());
      if (existing) return existing;
      const bwl = {
        id: uid('bwl'),
        name: clean,
        legalBalls: 0, maidens: 0, runsConceded: 0, wickets: 0,
        currentOverRuns: 0, currentOverLegalBalls: 0
      };
      inn.bowlers.push(bwl);
      return bwl;
    }

    function computeAutoResult(match) {
      const i1 = match.innings[0];
      const i2 = match.innings[1];
      if (i2.runs > i1.runs) {
        const w = Math.max(1, 10 - i2.wickets);
        return i2.battingTeam + ' won by ' + w + ' wicket' + (w !== 1 ? 's' : '');
      }
      if (i1.runs > i2.runs) {
        const r = i1.runs - i2.runs;
        return i1.battingTeam + ' won by ' + r + ' run' + (r !== 1 ? 's' : '');
      }
      return 'Match Tied';
    }

    /*************************************************************************
     * 5. PERSISTENCE LAYER (FIREBASE CLOUD SYNC + LOCAL FALLBACK)
     *************************************************************************/
    function updateSyncPill() {
      const pill = document.getElementById('sync-status-pill');
      const txt = document.getElementById('sync-status-text');
      if (!pill || !txt) return;
      if (state.syncState === 'cloud') {
        pill.className = 'sync-pill sync-cloud';
        txt.textContent = 'Live Cloud';
      } else if (state.syncState === 'syncing') {
        pill.className = 'sync-pill sync-working';
        txt.textContent = 'Syncing...';
      } else {
        pill.className = 'sync-pill sync-local';
        txt.textContent = 'Local Mode';
      }
    }

    function loadLocalMatches() {
      try {
        const raw = safeGetItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            state.matches = parsed.map(sanitizeMatch).filter(Boolean);
            sortMatches();
          }
        }
        const savedId = safeGetItem(ACTIVE_KEY);
        if (savedId && state.matches.some(m => m.id === savedId)) {
          state.activeMatchId = savedId;
        } else if (state.matches.length > 0) {
          state.activeMatchId = state.matches[0].id;
        }
      } catch (e) {
        state.matches = [];
      }
    }

    function saveLocalMatches() {
      sortMatches();
      safeSetItem(STORAGE_KEY, JSON.stringify(state.matches));
      if (state.activeMatchId) safeSetItem(ACTIVE_KEY, state.activeMatchId);
      else safeRemoveItem(ACTIVE_KEY);
    }

    async function persistMatch(match) {
      if (!match) return;
      match.updatedAt = Date.now();
      const idx = state.matches.findIndex(m => m.id === match.id);
      if (idx >= 0) state.matches[idx] = match;
      else state.matches.unshift(match);
      sortMatches();

      if (state.mode === 'cloud' && fb.enabled && fb.db && fb.api) {
        if (!isAdmin()) {
          showToast('Admin access required to save changes', true);
          return;
        }
        try {
          state.syncState = 'syncing';
          updateSyncPill();
          const ref = fb.api.doc(fb.db, 'artifacts', APP_ID, 'public', 'data', 'tcp_matches', match.id);
          await fb.api.setDoc(ref, match);
          state.syncState = 'cloud';
          updateSyncPill();
        } catch (err) {
          state.syncState = 'cloud';
          updateSyncPill();
          showToast('Cloud save failed: ' + (err.message || 'Check permissions'), true);
        }
      } else {
        saveLocalMatches();
      }
    }

    async function removeMatch(matchId) {
      state.matches = state.matches.filter(m => m.id !== matchId);
      if (state.activeMatchId === matchId) {
        state.activeMatchId = state.matches.length > 0 ? state.matches[0].id : null;
      }

      if (state.mode === 'cloud' && fb.enabled && fb.db && fb.api) {
        if (!isAdmin()) {
          showToast('Admin access required', true);
          return;
        }
        try {
          state.syncState = 'syncing';
          updateSyncPill();
          const ref = fb.api.doc(fb.db, 'artifacts', APP_ID, 'public', 'data', 'tcp_matches', matchId);
          await fb.api.deleteDoc(ref);
          state.syncState = 'cloud';
          updateSyncPill();
        } catch (err) {
          state.syncState = 'cloud';
          updateSyncPill();
          showToast('Cloud delete failed', true);
        }
      } else {
        saveLocalMatches();
      }
    }

    async function saveAdminListToCloud(newEmails, primaryEmail) {
      if (!fb.enabled || !fb.db || !fb.api) return;
      try {
        state.syncState = 'syncing';
        updateSyncPill();
        const ref = fb.api.doc(fb.db, 'artifacts', APP_ID, 'public', 'data', 'tcp_config', 'admins');
        await fb.api.setDoc(ref, {
          emails: newEmails,
          primaryAdmin: primaryEmail || newEmails[0] || '',
          updatedAt: Date.now()
        });
        state.syncState = 'cloud';
        updateSyncPill();
      } catch (err) {
        state.syncState = 'cloud';
        updateSyncPill();
        showToast('Could not update admin list: ' + (err.message || ''), true);
      }
    }

    async function initFirebaseIfConfigured() {
      const cfg = resolveFirebaseConfig();
      if (!cfg) {
        state.mode = 'local';
        state.syncState = 'local';
        loadLocalMatches();
        render();
        return;
      }

      try {
        state.syncState = 'syncing';
        updateSyncPill();

        const [appMod, authMod, fsMod] = await Promise.all([
          import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js'),
          import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js'),
          import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')
        ]);

        fb.app = appMod.initializeApp(cfg);
        fb.auth = authMod.getAuth(fb.app);
        fb.db = fsMod.getFirestore(fb.app);
        fb.api = { ...authMod, ...fsMod };
        fb.enabled = true;
        state.mode = 'cloud';

        // Ensure user is authenticated (custom token or anonymous for read-only viewers) BEFORE Firestore queries
        try {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await authMod.signInWithCustomToken(fb.auth, __initial_auth_token);
          } else if (!fb.auth.currentUser) {
            await authMod.signInAnonymously(fb.auth);
          }
        } catch (authErr) {
          // Proceed; onAuthStateChanged will still track login state
        }

        authMod.onAuthStateChanged(fb.auth, (user) => {
          state.user = user || null;
          if (!isAdmin() && (state.currentTab === 'setup' || state.currentTab === 'admins')) {
            state.currentTab = 'live';
          }
          render();
        });

        // Subscribe to authorized admin list
        const adminsDocRef = fsMod.doc(fb.db, 'artifacts', APP_ID, 'public', 'data', 'tcp_config', 'admins');
        fb.unsubAdmins = fsMod.onSnapshot(
          adminsDocRef,
          (snap) => {
            if (snap.exists()) {
              const data = snap.data() || {};
              state.adminEmails = Array.isArray(data.emails)
                ? data.emails.map(e => String(e).trim().toLowerCase()).filter(Boolean)
                : [];
              state.primaryAdminEmail = String(data.primaryAdmin || state.adminEmails[0] || '').toLowerCase();
            } else {
              state.adminEmails = [];
              state.primaryAdminEmail = '';
            }
            render();
          },
          () => { /* fallback silently */ }
        );

        // Subscribe to all matches in real time
        const matchesColRef = fsMod.collection(fb.db, 'artifacts', APP_ID, 'public', 'data', 'tcp_matches');
        fb.unsubMatches = fsMod.onSnapshot(
          matchesColRef,
          (snap) => {
            const list = [];
            snap.forEach((docSnap) => {
              const clean = sanitizeMatch({ id: docSnap.id, ...docSnap.data() });
              if (clean) list.push(clean);
            });
            state.matches = list;
            sortMatches();
            if (!state.activeMatchId || !state.matches.some(m => m.id === state.activeMatchId)) {
              const liveMatch = state.matches.find(m => m.status === 'live');
              state.activeMatchId = liveMatch ? liveMatch.id : (state.matches[0] ? state.matches[0].id : null);
            }
            state.syncState = 'cloud';
            updateSyncPill();
            render();
          },
          (err) => {
            state.syncState = 'local';
            state.mode = 'local';
            loadLocalMatches();
            updateSyncPill();
            render();
            showToast('Cloud unavailable, switched to Local Mode', true);
          }
        );
      } catch (err) {
        state.mode = 'local';
        state.syncState = 'local';
        loadLocalMatches();
        updateSyncPill();
        render();
      }
    }

    /*************************************************************************
     * 6. SCORING ENGINE (ADMIN ONLY)
     *************************************************************************/
    function pushUndo(match) {
      if (!match) return;
      if (!state.undoStacks[match.id]) state.undoStacks[match.id] = [];
      const stack = state.undoStacks[match.id];
      stack.push(JSON.stringify({
        status: match.status,
        resultText: match.resultText,
        currentInningsIndex: match.currentInningsIndex,
        innings: match.innings
      }));
      if (stack.length > 40) stack.shift();
    }

    async function undoLastBall() {
      if (!isAdmin()) return;
      const match = getActiveMatch();
      if (!match) return;
      const stack = state.undoStacks[match.id];
      if (!stack || stack.length === 0) {
        showToast('Nothing to undo', true);
        return;
      }
      try {
        const prev = JSON.parse(stack.pop());
        match.status = prev.status;
        match.resultText = prev.resultText;
        match.currentInningsIndex = prev.currentInningsIndex;
        match.innings = prev.innings;
        await persistMatch(match);
        render();
        showToast('Last delivery undone');
      } catch (err) {
        showToast('Could not undo', true);
      }
    }

    function archivePartialOver(inn, bowler) {
      const runsInOver = inn.currentOverBalls.reduce((s, b) => s + (b.runs || 0), 0);
      inn.oversLog.unshift({
        overNum: Math.floor(inn.legalBalls / 6) + 1,
        bowlerName: bowler ? bowler.name : 'Bowler',
        runsInOver,
        balls: inn.currentOverBalls.slice(),
        scoreAtEnd: inn.runs + '/' + inn.wickets
      });
      inn.currentOverBalls = [];
    }

    async function recordBall(opts) {
      if (!isAdmin()) {
        showToast('Only Admins can update scores', true);
        return;
      }
      const match = getActiveMatch();
      if (!match || match.status !== 'live') return;

      const inn = match.innings[match.currentInningsIndex];
      const striker = getBatter(inn, inn.strikerId);
      const bowler = getBowler(inn, inn.currentBowlerId);
      if (!striker || !bowler) {
        showToast('Set active batters & bowler first', true);
        return;
      }

      pushUndo(match);

      const extraType = opts.extraType || null;
      const runsOffBat = Number(opts.runsOffBat) || 0;
      const extraRuns = Number(opts.extraRuns) || 0;
      const isWicket = Boolean(opts.isWicket);

      let isLegal = true;
      let totalRuns = 0;
      let bowlerRuns = 0;
      let batterFaced = true;
      let rotateRuns = 0;
      let pillLabel = '';
      let pillType = 'run';
      let commentary = '';

      if (extraType === 'wd') {
        isLegal = false;
        batterFaced = false;
        const wdTotal = 1 + extraRuns;
        totalRuns = wdTotal;
        bowlerRuns = wdTotal;
        inn.extras.wd += wdTotal;
        inn.extras.total += wdTotal;
        rotateRuns = extraRuns;
        pillLabel = extraRuns > 0 ? 'WD+' + extraRuns : 'WD';
        pillType = 'extra';
        commentary = 'Wide ball' + (extraRuns > 0 ? ' (+' + extraRuns + ')' : '');
      } else if (extraType === 'nb') {
        isLegal = false;
        batterFaced = true;
        totalRuns = 1 + runsOffBat + extraRuns;
        bowlerRuns = 1 + runsOffBat;
        inn.extras.nb += 1;
        if (extraRuns > 0) inn.extras.b += extraRuns;
        inn.extras.total += (1 + extraRuns);
        rotateRuns = runsOffBat + extraRuns;
        const addSum = runsOffBat + extraRuns;
        pillLabel = addSum > 0 ? 'NB+' + addSum : 'NB';
        pillType = 'extra';
        commentary = 'No ball' + (runsOffBat > 0 ? ', ' + runsOffBat + ' off bat' : extraRuns > 0 ? ', ' + extraRuns + ' bye(s)' : '');
      } else if (extraType === 'b' || extraType === 'lb') {
        isLegal = true;
        batterFaced = true;
        totalRuns = extraRuns;
        bowlerRuns = 0;
        inn.extras[extraType] += extraRuns;
        inn.extras.total += extraRuns;
        rotateRuns = extraRuns;
        pillLabel = extraRuns + extraType.toUpperCase();
        pillType = 'extra';
        commentary = extraRuns + ' ' + (extraType === 'b' ? 'Bye' : 'Leg Bye') + (extraRuns > 1 ? 's' : '');
      } else {
        isLegal = true;
        batterFaced = true;
        totalRuns = runsOffBat;
        bowlerRuns = runsOffBat;
        rotateRuns = runsOffBat;
        if (runsOffBat === 0) {
          pillLabel = '0'; pillType = 'dot'; commentary = 'No run';
        } else if (runsOffBat === 4) {
          pillLabel = '4'; pillType = 'four'; commentary = 'FOUR! Cracked to the boundary';
        } else if (runsOffBat === 6) {
          pillLabel = '6'; pillType = 'six'; commentary = 'SIX! Smashed over the ropes';
        } else {
          pillLabel = String(runsOffBat); pillType = 'run';
          commentary = runsOffBat + ' run' + (runsOffBat > 1 ? 's' : '');
        }
      }

      inn.runs += totalRuns;
      inn.partnership.runs += totalRuns;

      if (batterFaced) striker.balls += 1;
      if (runsOffBat > 0) {
        striker.runs += runsOffBat;
        if (runsOffBat === 4) striker.fours += 1;
        if (runsOffBat === 6) striker.sixes += 1;
      }

      bowler.runsConceded += bowlerRuns;
      bowler.currentOverRuns += bowlerRuns;

      if (isLegal) {
        inn.legalBalls += 1;
        inn.partnership.balls += 1;
        bowler.legalBalls += 1;
        bowler.currentOverLegalBalls += 1;
      }

      const overStamp = isLegal
        ? Math.floor((inn.legalBalls - 1) / 6) + '.' + (((inn.legalBalls - 1) % 6) + 1)
        : Math.floor(inn.legalBalls / 6) + '.' + ((inn.legalBalls % 6) + 1) + '*';

      if (isWicket) {
        inn.wickets += 1;
        pillType = 'wicket';
        pillLabel = totalRuns > 0 ? 'W+' + totalRuns : 'W';

        const dType = opts.dismissalType || 'Bowled';
        const fielder = String(opts.fielderName || '').trim();
        const outBatter = getBatter(inn, opts.outBatterId || inn.strikerId) || striker;
        outBatter.isOut = true;

        if (dType === 'Bowled') outBatter.dismissalText = 'b ' + bowler.name;
        else if (dType === 'Caught') outBatter.dismissalText = fielder ? ('c ' + fielder + ' b ' + bowler.name) : ('c & b ' + bowler.name);
        else if (dType === 'LBW') outBatter.dismissalText = 'lbw b ' + bowler.name;
        else if (dType === 'Stumped') outBatter.dismissalText = fielder ? ('st ' + fielder + ' b ' + bowler.name) : ('st b ' + bowler.name);
        else if (dType === 'Hit Wicket') outBatter.dismissalText = 'hit wicket b ' + bowler.name;
        else if (dType === 'Run Out') outBatter.dismissalText = fielder ? ('run out (' + fielder + ')') : 'run out';
        else outBatter.dismissalText = dType.toLowerCase();

        if (dType !== 'Run Out') bowler.wickets += 1;

        inn.fow.push({
          wicketNum: inn.wickets,
          runs: inn.runs,
          overs: formatOvers(inn.legalBalls),
          batterName: outBatter.name
        });

        commentary = 'OUT! ' + outBatter.name + ' (' + outBatter.dismissalText + ') — ' + outBatter.runs + '(' + outBatter.balls + ')';
        inn.partnership = { runs: 0, balls: 0 };

        if (inn.wickets < 10) {
          const nextBat = addBatter(inn, opts.nextBatterName);
          if (outBatter.id === inn.strikerId) inn.strikerId = nextBat.id;
          else inn.nonStrikerId = nextBat.id;
        } else {
          if (outBatter.id === inn.strikerId) inn.strikerId = null;
          else inn.nonStrikerId = null;
        }
      } else if (rotateRuns % 2 === 1 && inn.strikerId && inn.nonStrikerId) {
        const tmp = inn.strikerId;
        inn.strikerId = inn.nonStrikerId;
        inn.nonStrikerId = tmp;
      }

      inn.currentOverBalls.push({ label: pillLabel, type: pillType, runs: totalRuns, isLegal });
      inn.commentary.unshift({
        overBall: overStamp,
        bowler: bowler.name,
        batter: striker.name,
        text: commentary,
        badge: pillLabel,
        type: pillType
      });

      let overJustCompleted = false;
      if (isLegal && inn.legalBalls > 0 && inn.legalBalls % 6 === 0) {
        overJustCompleted = true;
        if (bowler.currentOverRuns === 0 && bowler.currentOverLegalBalls >= 6) {
          bowler.maidens += 1;
        }
        const completedOverNum = inn.legalBalls / 6;
        const runsInOver = inn.currentOverBalls.reduce((s, b) => s + (b.runs || 0), 0);
        inn.oversLog.unshift({
          overNum: completedOverNum,
          bowlerName: bowler.name,
          runsInOver,
          balls: inn.currentOverBalls.slice(),
          scoreAtEnd: inn.runs + '/' + inn.wickets
        });
        inn.currentOverBalls = [];
        bowler.currentOverRuns = 0;
        bowler.currentOverLegalBalls = 0;

        if (inn.strikerId && inn.nonStrikerId) {
          const tmpEnd = inn.strikerId;
          inn.strikerId = inn.nonStrikerId;
          inn.nonStrikerId = tmpEnd;
        }
      }

      const maxBalls = match.oversPerInnings * 6;
      let inningsEnded = false;
      let matchEnded = false;

      if (match.currentInningsIndex === 0) {
        if (inn.wickets >= 10 || inn.legalBalls >= maxBalls) {
          inningsEnded = true;
          match.status = 'innings_break';
          if (!overJustCompleted && inn.currentOverBalls.length > 0) archivePartialOver(inn, bowler);
        }
      } else {
        const target = match.innings[0].runs + 1;
        if (inn.runs >= target || inn.wickets >= 10 || inn.legalBalls >= maxBalls) {
          matchEnded = true;
          match.status = 'completed';
          match.resultText = computeAutoResult(match);
          if (!overJustCompleted && inn.currentOverBalls.length > 0) archivePartialOver(inn, bowler);
        }
      }

      await persistMatch(match);
      render();

      if (matchEnded) showToast(match.resultText);
      else if (inningsEnded) showToast('1st Innings complete! Ready for 2nd Innings.');
      else if (overJustCompleted) openChangeBowlerModal(true);
    }

    async function swapStrike() {
      if (!isAdmin()) return;
      const match = getActiveMatch();
      if (!match || match.status !== 'live') return;
      const inn = match.innings[match.currentInningsIndex];
      if (!inn.strikerId || !inn.nonStrikerId) return;
      const tmp = inn.strikerId;
      inn.strikerId = inn.nonStrikerId;
      inn.nonStrikerId = tmp;
      await persistMatch(match);
      render();
      showToast('Strike rotated');
    }

    /*************************************************************************
     * 7. VIEW RENDERERS
     *************************************************************************/
    function renderBallPill(ball) {
      const typeMap = { dot: 'pill-dot', run: 'pill-run', four: 'pill-four', six: 'pill-six', wicket: 'pill-wicket', extra: 'pill-extra' };
      return '<span class="ball-pill ' + (typeMap[ball.type] || 'pill-dot') + '">' + escapeHtml(ball.label) + '</span>';
    }

    function updateHeaderUI() {
      updateSyncPill();
      const admin = isAdmin();

      const authBtn = document.getElementById('auth-header-btn');
      const authTxt = document.getElementById('auth-header-text');
      if (authBtn && authTxt) {
        if (state.mode === 'local') {
          authBtn.className = 'auth-pill-btn ' + (admin ? 'auth-pill-admin' : 'auth-pill-viewer');
          authTxt.textContent = admin ? 'Admin ✓ (Local)' : 'Viewer Preview';
        } else if (admin) {
          authBtn.className = 'auth-pill-btn auth-pill-admin';
          authTxt.textContent = 'Admin ✓';
        } else if (isSignedInEmailUser()) {
          authBtn.className = 'auth-pill-btn auth-pill-viewer';
          authTxt.textContent = 'Viewer (Signed In)';
        } else {
          authBtn.className = 'auth-pill-btn auth-pill-viewer';
          authTxt.textContent = 'Admin Login';
        }
      }

      const setupNav = document.getElementById('nav-setup');
      const adminsNav = document.getElementById('nav-admins');
      if (setupNav) setupNav.classList.toggle('hidden', !admin);
      if (adminsNav) adminsNav.classList.toggle('hidden', !admin);

      ['live', 'scorecard', 'history', 'setup', 'admins'].forEach(t => {
        const el = document.getElementById('nav-' + t);
        if (el) el.classList.toggle('active', state.currentTab === t);
      });

      const badge = document.getElementById('nav-history-count');
      if (badge) badge.textContent = String(state.matches.length);
    }

    function renderTopBanners() {
      let html = '';
      if (state.mode === 'local' && !state.dismissLocalBanner) {
        html +=
          '<div class="banner banner-sky">' +
            '<div style="flex:1; min-width:200px;">' +
              '<div class="text-xs font-extrabold text-sky">LOCAL MODE ACTIVE</div>' +
              '<div class="text-xs muted">Add your Firebase keys at the top of this file to enable live cloud sync across phones.</div>' +
            '</div>' +
            '<div class="row">' +
              '<button type="button" class="btn btn-xs btn-sky-soft" data-action="toggle-local-role">' + (isAdmin() ? 'Preview Viewer' : 'Back to Admin') + '</button>' +
              '<button type="button" class="icon-btn" data-action="dismiss-local-banner" title="Dismiss">' + ICONS.close + '</button>' +
            '</div>' +
          '</div>';
      }

      if (canClaimPrimaryAdmin()) {
        html +=
          '<div class="banner banner-emerald">' +
            '<div style="flex:1; min-width:200px;">' +
              '<div class="text-xs font-extrabold text-emerald">NO PRIMARY ADMIN SET YET</div>' +
              '<div class="text-xs muted">Signed in as <strong>' + escapeHtml(state.user.email) + '</strong>. Claim Primary Admin to score &amp; invite others.</div>' +
            '</div>' +
            '<button type="button" class="btn btn-xs btn-primary" data-action="claim-primary-admin">Claim Primary Admin</button>' +
          '</div>';
      }
      return html;
    }

    function render() {
      const main = document.getElementById('app-main');
      if (!main) return;
      try {
        updateHeaderUI();
        let content = '';
        if (state.currentTab === 'live') content = renderLiveView();
        else if (state.currentTab === 'scorecard') content = renderScorecardView();
        else if (state.currentTab === 'history') content = renderHistoryView();
        else if (state.currentTab === 'setup' && isAdmin()) content = renderSetupView();
        else if (state.currentTab === 'admins' && isAdmin()) content = renderAdminsView();
        else content = renderLiveView();

        main.innerHTML = '<div class="stack">' + renderTopBanners() + content + '</div>';
      } catch (err) {
        main.innerHTML =
          '<div class="banner-error stack-sm">' +
            '<div class="font-extrabold text-sm">Display Error</div>' +
            '<div class="text-xs">' + escapeHtml(err && err.message ? err.message : String(err)) + '</div>' +
            '<button type="button" class="btn btn-xs btn-primary" data-action="nav" data-tab="live">Reload View</button>' +
          '</div>';
      }
    }

    /* ---------- VIEW 1: LIVE SCOREBOARD ---------- */
    function renderLiveView() {
      const admin = isAdmin();
      const match = getActiveMatch();
      if (!match) {
        return (
          '<div class="card card-pad text-center stack" style="padding:36px 20px; align-items:center;">' +
            '<div style="width:52px; height:52px; border-radius:16px; background:var(--emerald-bg); color:var(--emerald-bright); display:flex; align-items:center; justify-content:center; border:1px solid var(--emerald-border);">' + ICONS.trophy + '</div>' +
            '<div style="font-size:18px; font-weight:800;">No Active Match Yet</div>' +
            '<div class="text-sm muted">' + (admin ? 'Start a new match or load the demo T20 chase to test live scoring.' : 'Waiting for a TCP Admin to start a match. Live scores will appear here automatically.') + '</div>' +
            (admin
              ? '<div class="row-wrap" style="justify-content:center; margin-top:6px;">' +
                  '<button type="button" class="btn btn-primary btn-sm" data-action="nav" data-tab="setup">Start New Match</button>' +
                  '<button type="button" class="btn btn-subtle btn-sm" data-action="load-demo">' + ICONS.spark + '<span>Load Demo Match</span></button>' +
                '</div>'
              : '<button type="button" class="btn btn-subtle btn-sm" data-action="open-auth">Admin Login</button>') +
          '</div>'
        );
      }

      const inn = match.innings[match.currentInningsIndex];
      const inn1 = match.innings[0];
      const striker = getBatter(inn, inn.strikerId);
      const nonStriker = getBatter(inn, inn.nonStrikerId);
      const bowler = getBowler(inn, inn.currentBowlerId);
      const crr = calcRunRate(inn.runs, inn.legalBalls);
      const maxBalls = match.oversPerInnings * 6;
      const canUndo = (state.undoStacks[match.id] || []).length > 0;

      let statusBadge = '<span class="badge badge-live"><span class="live-dot"></span>LIVE • ' + (match.currentInningsIndex === 0 ? '1st' : '2nd') + ' INN</span>';
      if (match.status === 'innings_break') statusBadge = '<span class="badge badge-break">INNINGS BREAK</span>';
      else if (match.status === 'completed') statusBadge = '<span class="badge badge-done">COMPLETED</span>';

      let footerHtml = '';
      if (match.currentInningsIndex === 1) {
        const target = inn1.runs + 1;
        const needed = Math.max(0, target - inn.runs);
        const ballsLeft = Math.max(0, maxBalls - inn.legalBalls);
        const rrr = ballsLeft > 0 ? ((needed / ballsLeft) * 6).toFixed(2) : (needed > 0 ? '—' : '0.00');
        footerHtml =
          '<div class="row-wrap">' +
            '<span class="target-pill">Target ' + target + '</span>' +
            (match.status === 'live'
              ? '<span>Need <strong style="color:#fff;">' + needed + '</strong> off <strong style="color:#fff;">' + ballsLeft + '</strong> ball' + (ballsLeft !== 1 ? 's' : '') + '</span>'
              : '<strong class="text-emerald">' + escapeHtml(match.resultText || computeAutoResult(match)) + '</strong>') +
          '</div>' +
          '<div>RRR: <strong class="text-amber">' + rrr + '</strong></div>';
      } else {
        footerHtml =
          '<span>Toss: <strong style="color:#fff;">' + escapeHtml(match.tossWinner) + '</strong> (' + escapeHtml(match.tossDecision) + ')</span>' +
          '<span>' + escapeHtml(match.venue) + '</span>';
      }

      let bannerHtml = '';
      if (match.status === 'innings_break') {
        bannerHtml =
          '<div class="banner banner-amber">' +
            '<div>' +
              '<div class="text-xs font-extrabold text-amber" style="text-transform:uppercase;">Innings Break</div>' +
              '<div class="font-extrabold text-sm">' + escapeHtml(match.innings[1].battingTeam) + ' need ' + (inn1.runs + 1) + ' runs in ' + match.oversPerInnings + ' overs</div>' +
            '</div>' +
            '<div class="row">' +
              '<button type="button" class="btn btn-xs btn-wa" data-action="open-share" data-id="' + escapeHtml(match.id) + '" data-tab="quick">' + ICONS.wa + '<span>Share</span></button>' +

            '</div>' +
          '</div>';
      } else if (match.status === 'completed') {
        bannerHtml =
          '<div class="banner banner-emerald">' +
            '<div class="row">' +
              '<div style="width:36px; height:36px; border-radius:10px; background:var(--emerald-dark); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;">' + ICONS.trophy + '</div>' +
              '<div>' +
                '<div class="text-xs font-extrabold text-emerald" style="text-transform:uppercase;">Match Completed</div>' +
                '<div class="font-extrabold text-sm">' + escapeHtml(match.resultText || computeAutoResult(match)) + '</div>' +
              '</div>' +
            '</div>' +

              '<button type="button" class="btn btn-xs btn-primary" data-action="nav" data-tab="scorecard">Full Card</button>' +
            '</div>' +
          '</div>';

      function renderBatterRow(b, isStriker) {
        if (!b) return '<tr><td colspan="6" class="text-xs muted">No batter at this end</td></tr>';

            '<td class="num muted">' + b.sixes + '</td>' +
            '<td class="num muted">' + calcStrikeRate(b.runs, b.balls) + '</td>' +

      return (
        '<section class="scoreboard">' +
          '<div class="sb-top">' +
            '<span class="sb-match-title">' + escapeHtml(match.title) + '</span>' +
            '<div class="row" style="gap:5px; flex-shrink:0;">' +
              statusBadge +
              (admin ? '<button type="button" class="btn btn-xs btn-subtle" data-action="open-edit-match" data-id="' + escapeHtml(match.id) + '" title="Edit match">' + ICONS.edit + '<span>Edit</span></button>' : '') +
              '<button type="button" class="btn btn-xs btn-wa" data-action="open-share" data-id="' + escapeHtml(match.id) + '" data-tab="quick" title="Share to WhatsApp">' + ICONS.wa + '</button>' +
            '</div>' +
          '</div>' +
          '<div class="sb-main">' +
            '<div>' +
              '<div class="sb-team">' + escapeHtml(inn.battingTeam) + ' <span class="text-xs muted" style="font-weight:600;">vs ' + escapeHtml(inn.bowlingTeam) + '</span></div>' +
              '<div class="sb-score-line">' +
                '<span class="sb-score">' + inn.runs + '/' + inn.wickets + '</span>' +
                '<span class="sb-overs">(' + formatOvers(inn.legalBalls) + ' / ' + match.oversPerInnings + ' ov)</span>' +
              '</div>' +
            '</div>' +
            '<div class="sb-crr-box"><div class="sb-crr-label">CRR</div><div class="sb-crr-val">' + crr + '</div></div>' +
          '</div>' +
          '<div class="sb-footer">' + footerHtml + '</div>' +
        '</section>' +

        bannerHtml +

        '<div class="info-grid">' +
          '<div class="info-pill"><span class="info-pill-label">Partnership</span><span class="info-pill-val">' + inn.partnership.runs + ' <span>(' + inn.partnership.balls + ')</span></span></div>' +
          '<div class="info-pill"><span class="info-pill-label">Extras</span><span class="info-pill-val">' + inn.extras.total + ' <span>(' + inn.extras.wd + 'w, ' + inn.extras.nb + 'nb)</span></span></div>' +
        '</div>' +

        '<section class="card">' +
          '<div class="card-header">' +
            '<span class="card-header-title">Batters' + (admin && match.status === 'live' ? ' <span class="muted" style="font-weight:600; text-transform:none;">(tap name to rename)</span>' : '') + '</span>' +
            (admin && match.status === 'live'
              ? '<button type="button" class="btn btn-xs btn-emerald-soft" data-action="swap-strike">' + ICONS.swap + '<span>Swap Strike</span></button>'
              : '') +
          '</div>' +
          '<div class="table-wrap"><table>' +
            '<thead><tr><th>Batter</th><th class="num">R</th><th class="num">B</th><th class="num">4s</th><th class="num">6s</th><th class="num">SR</th></tr></thead>' +
