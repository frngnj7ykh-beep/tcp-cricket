<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tamarind Cricket Players (TCP) — Live Cricket Scorer</title>
  <style>
    /* =========================================================================
       TAMARIND CRICKET PLAYERS (TCP) — DARK BROADCAST THEME
       100% Self-Contained CSS (Zero External CSS/Icon CDNs)
       ========================================================================= */
    :root {
      --bg-page: #0b1120;
      --bg-card: #111827;
      --bg-card-2: #1a2335;
      --bg-input: #0d1526;
      --bg-subtle: #1f2937;
      --border: #243045;
      --border-light: #334155;
      --text-main: #f8fafc;
      --text-sec: #cbd5e1;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --emerald-dark: #059669;
      --emerald-bg: rgba(16, 185, 129, 0.14);
      --emerald-border: rgba(16, 185, 129, 0.36);
      --amber: #f59e0b;
      --amber-bright: #fbbf24;
      --amber-bg: rgba(245, 158, 11, 0.16);
      --amber-border: rgba(245, 158, 11, 0.36);
      --rose: #e11d48;
      --rose-bright: #fb7185;
      --rose-bg: rgba(225, 29, 72, 0.16);
      --rose-border: rgba(225, 29, 72, 0.38);
      --sky: #38bdf8;
      --sky-bg: rgba(56, 189, 248, 0.16);
      --sky-border: rgba(56, 189, 248, 0.36);
      --indigo-bg: rgba(99, 102, 241, 0.22);
      --indigo-text: #a5b4fc;
      --indigo-border: rgba(129, 140, 248, 0.38);
      --wa-green: #25d366;
      --wa-bubble: #005c4b;
      --wa-bubble-border: #0a725e;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.4;
      overscroll-behavior-y: none;
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    a { text-decoration: none; color: inherit; }

    /* ==================== STATIC STICKY COMPACT HEADER ==================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 17, 32, 0.97);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .header-inner {
      max-width: 780px;
      margin: 0 auto;
      padding: 8px 10px 7px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      min-width: 0;
      flex-shrink: 1;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #10b981, #047857);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.35);
      flex-shrink: 0;
    }

    .brand-text-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-top-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title {
      font-weight: 900;
      font-size: 14.5px;
      letter-spacing: 0.02em;
      line-height: 1.05;
      color: var(--emerald-bright);
    }

    .brand-sub {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-sec);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 999px;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .sync-cloud { color: var(--emerald-bright); background: var(--emerald-bg); border: 1px solid var(--emerald-border); }
    .sync-working { color: var(--amber-bright); background: var(--amber-bg); border: 1px solid var(--amber-border); }
    .sync-local { color: var(--sky); background: var(--sky-bg); border: 1px solid var(--sky-border); }

    .sync-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    .auth-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .auth-pill-viewer {
      background: var(--bg-card-2);
      color: var(--text-sec);
      border: 1px solid var(--border-light);
    }

    .auth-pill-admin {
      background: var(--emerald-bg);
      color: var(--emerald-bright);
      border: 1px solid var(--emerald-border);
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 3px;
      background: var(--bg-card);
      padding: 3px;
      border-radius: 11px;
      border: 1px solid var(--border);
      width: 100%;
    }

    .nav-tab {
      flex: 1;
      padding: 6px 4px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      min-width: 0;
    }

    .nav-tab:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }
    .nav-tab.active {
      background: var(--emerald-dark);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
    }

    .nav-tab svg { width: 13px; height: 13px; flex-shrink: 0; }

    .nav-badge {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 999px;
      min-width: 16px;
      text-align: center;
      line-height: 1.3;
    }

    .nav-tab.active .nav-badge { background: rgba(0, 0, 0, 0.25); }

    @media (max-width: 400px) {
      .nav-tab { font-size: 10.5px; gap: 3px; padding: 6px 2px; }
      .nav-tab svg { display: none; }
      .brand-sub { max-width: 135px; }
    }

    /* ==================== MAIN LAYOUT & UTILITIES ==================== */
    .app-main {
      max-width: 780px;
      margin: 0 auto;
      padding: 12px 10px 80px;
    }

    .stack { display: flex; flex-direction: column; gap: 12px; }
    .stack-sm { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .hidden { display: none !important; }

    .text-xs { font-size: 11.5px; }
    .text-sm { font-size: 13px; }
    .text-center { text-align: center; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .muted { color: var(--text-muted); }
    .text-emerald { color: var(--emerald-bright); }
    .text-amber { color: var(--amber-bright); }
    .text-rose { color: var(--rose-bright); }
    .text-sky { color: var(--sky); }

    /* ==================== CARDS & BROADCAST SCOREBOARD ==================== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .card-pad { padding: 14px; }

    .card-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255, 255, 255, 0.02);
    }

    .card-header-title {
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .scoreboard {
      background: linear-gradient(145deg, #13203b 0%, #0f172a 55%, #073b2f 100%);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sb-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sb-match-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-sec);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .sb-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
    .sb-team { font-size: 14px; font-weight: 800; color: var(--text-main); }
    .sb-score-line { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
    .sb-score { font-size: 36px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; color: #ffffff; }
    .sb-overs { font-size: 13px; font-weight: 700; color: var(--emerald-bright); }

    .sb-crr-box {
      background: rgba(11, 17, 32, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 6px 11px;
      text-align: center;
      flex-shrink: 0;
    }

    .sb-crr-label { font-size: 9.5px; font-weight: 800; letter-spacing: 0.08em; color: var(--text-muted); }
    .sb-crr-val { font-size: 17px; font-weight: 900; color: var(--emerald-bright); line-height: 1.15; }

    .sb-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
      color: var(--text-sec);
    }

    .target-pill {
      background: var(--amber-bg);
      color: var(--amber-bright);
      border: 1px solid var(--amber-border);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }

    /* ==================== BADGES & BANNERS ==================== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .badge-live { background: var(--emerald-bg); color: var(--emerald-bright); border: 1px solid var(--emerald-border); }
    .badge-break { background: var(--amber-bg); color: var(--amber-bright); border: 1px solid var(--amber-border); }
    .badge-done { background: var(--sky-bg); color: var(--sky); border: 1px solid var(--sky-border); }
    .badge-active-match { background: var(--indigo-bg); color: var(--indigo-text); border: 1px solid var(--indigo-border); }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald-bright);
      animation: pulse-dot 1.4s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .banner {
      border-radius: var(--radius-md);
      padding: 11px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .banner-amber { background: var(--amber-bg); border: 1px solid var(--amber-border); }
    .banner-emerald { background: var(--emerald-bg); border: 1px solid var(--emerald-border); }
    .banner-sky { background: var(--sky-bg); border: 1px solid var(--sky-border); }
    .banner-error { background: var(--rose-bg); border: 1px solid var(--rose-border); color: #ffe4e6; border-radius: var(--radius-md); padding: 14px; }

    /* ==================== INFO PILLS ==================== */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .info-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .info-pill-label { font-size: 11px; font-weight: 700; color: var(--text-muted); }
    .info-pill-val { font-size: 13px; font-weight: 800; color: var(--text-main); }
    .info-pill-val span { font-size: 11px; font-weight: 600; color: var(--text-muted); }

    /* ==================== BUTTONS ==================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    .btn-sm { padding: 8px 12px; font-size: 12.5px; border-radius: 10px; }
    .btn-xs { padding: 5px 9px; font-size: 11.5px; border-radius: 8px; gap: 4px; }
    .btn-full { width: 100%; }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .btn-subtle { background: var(--bg-subtle); color: var(--text-main); border: 1px solid var(--border-light); }
    .btn-emerald-soft { background: var(--emerald-bg); color: var(--emerald-bright); border: 1px solid var(--emerald-border); }
    .btn-sky-soft { background: var(--sky-bg); color: var(--sky); border: 1px solid var(--sky-border); }
    .btn-rose { background: var(--rose); color: #ffffff; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); }
    .btn-wa { background: var(--wa-green); color: #052e16; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.28); }
    .btn-wa-soft { background: rgba(37, 211, 102, 0.14); color: #4ade80; border: 1px solid rgba(37, 211, 102, 0.35); }
    .btn-google { background: #ffffff; color: #0f172a; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }
    .icon-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.1); }

    /* ==================== TABLES ==================== */
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    thead th {
      text-align: left;
      padding: 8px 10px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody td { padding: 9px 10px; border-bottom: 1px solid rgba(36, 48, 69, 0.7); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .striker-row { background: rgba(16, 185, 129, 0.07); }
    .player-cell { display: flex; align-items: center; gap: 6px; min-width: 110px; }
    .striker-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--emerald-bright); flex-shrink: 0; box-shadow: 0 0 8px rgba(52, 211, 153, 0.8); }
    .nonstriker-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-light); flex-shrink: 0; }
    .player-name { font-weight: 700; color: var(--text-main); }
    .player-name-btn { font-weight: 700; color: var(--text-main); text-align: left; padding: 2px 0; }
    .player-name-btn:hover { color: var(--emerald-bright); }
    .player-dismissal { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

    /* ==================== THIS OVER PILLS ==================== */
    .over-strip {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(11, 17, 32, 0.45);
    }
    .over-strip-label { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); white-space: nowrap; }
    .ball-pills { display: flex; align-items: center; gap: 5px; overflow-x: auto; padding-bottom: 1px; }
    .ball-pills-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .ball-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 27px;
      height: 27px;
      padding: 0 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .pill-dot { background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border-light); }
    .pill-run { background: #1e3a5f; color: #e0f2fe; border: 1px solid rgba(56, 189, 248, 0.35); }
    .pill-four { background: var(--emerald-dark); color: #ffffff; }
    .pill-six { background: #7c3aed; color: #ffffff; }
    .pill-wicket { background: var(--rose); color: #ffffff; }
    .pill-extra { background: var(--amber-bg); color: var(--amber-bright); border: 1px solid var(--amber-border); }

    /* ==================== SCORING KEYPAD ==================== */
    .keypad-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-shadow: var(--shadow-sm);
    }
    .keypad-runs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
    .key-run {
      height: 50px;
      border-radius: 13px;
      background: var(--bg-card-2);
      border: 1px solid var(--border-light);
      color: var(--text-main);
      font-size: 19px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .key-four { background: rgba(16, 185, 129, 0.22); border-color: var(--emerald); color: var(--emerald-bright); }
    .key-six { background: rgba(124, 58, 237, 0.24); border-color: #8b5cf6; color: #ddd6fe; }
    .keypad-extras { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .key-extra {
      height: 42px;
      border-radius: 11px;
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      color: var(--amber-bright);
      font-size: 12.5px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .key-bye { background: var(--sky-bg); border-color: rgba(56, 189, 248, 0.35); color: var(--sky); }
    .key-out { background: var(--rose); border-color: #f43f5e; color: #ffffff; box-shadow: 0 3px 10px rgba(225, 29, 72, 0.35); }
    .keypad-utils { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }

    /* ==================== FORMS & INPUTS ==================== */
    .field-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; }
    .mini-label { display: block; font-size: 10px; font-weight: 700; color: var(--text-dim); margin-bottom: 3px; }
    .field-input, .field-select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 13.5px;
      color: var(--text-main);
      outline: none;
    }
    .field-input:focus, .field-select:focus { border-color: var(--emerald); box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.22); }
    .field-input-sm { padding: 7px 9px; font-size: 12.5px; border-radius: 9px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 520px) { .form-grid-3 { grid-template-columns: 1fr; } }

    .pill-choice {
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border-light);
      color: var(--text-sec);
      font-size: 12.5px;
      font-weight: 800;
      text-align: center;
    }
    .pill-choice.active { background: var(--emerald-bg); border-color: var(--emerald); color: var(--emerald-bright); }

    /* ==================== SEGMENTED TABS & FILTER CHIPS ==================== */
    .seg-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
    }
    .seg-tabs-2 { grid-template-columns: repeat(2, 1fr); }
    .seg-tab {
      padding: 8px 6px;
      border-radius: 9px;

      if (idx >= 0) state.matches[idx] = match;
