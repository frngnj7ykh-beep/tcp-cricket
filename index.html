                '<div class="form-grid-3">' +
                  '<div>' +
                    '<label class="field-label" for="inp-title">Series / Match Title</label>' +
                    '<input id="inp-title" name="title" type="text" class="field-input" value="' + escapeHtml(setupDraft.title) + '" placeholder="e.g., TCP Sunday Cup" />' +
                  '</div>' +
                  '<div>' +
                    '<label class="field-label" for="inp-venue">Venue / Ground</label>' +
                    '<input id="inp-venue" name="venue" type="text" class="field-input" value="' + escapeHtml(setupDraft.venue) + '" placeholder="e.g., Tamarind Ground" />' +
                  '</div>' +
                  '<div>' +
                    '<label class="field-label" for="inp-date">Date</label>' +
                    '<input id="inp-date" name="date" type="date" class="field-input" value="' + escapeHtml(setupDraft.date) + '" />' +
                  '</div>' +
                '</div>' +
              '</div>' +

              '<div class="card card-pad stack">' +
                '<div class="card-header-title">Format &amp; Toss</div>' +
                '<div>' +
                  '<label class="field-label">Overs per Innings</label>' +
                  '<div class="row-wrap">' +
                    presets.map(function (ov) {
                      return '<button type="button" class="pill-choice ' + (Number(setupDraft.overs) === ov ? 'active' : '') + '" data-action="set-overs" data-overs="' + ov + '">' + ov + ' Ov</button>';
                    }).join('') +
                    '<div class="row" style="margin-left:auto;">' +
                      '<span class="text-xs muted font-bold">Custom:</span>' +
                      '<input id="inp-overs" name="overs" type="number" min="1" max="100" required class="field-input field-input-sm" style="width:70px; text-align:center; font-weight:800;" value="' + setupDraft.overs + '" />' +
                    '</div>' +
                  '</div>' +
                '</div>' +

                '<div class="form-grid-2">' +
                  '<div>' +
                    '<label class="field-label">Toss Won By</label>' +
                    '<div class="info-grid">' +
                      '<button type="button" id="toss-t1-btn" class="pill-choice ' + (setupDraft.tossWinner === 'team1' ? 'active' : '') + '" data-action="set-toss-winner" data-val="team1" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + escapeHtml(t1) + '</button>' +
                      '<button type="button" id="toss-t2-btn" class="pill-choice ' + (setupDraft.tossWinner === 'team2' ? 'active' : '') + '" data-action="set-toss-winner" data-val="team2" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + escapeHtml(t2) + '</button>' +
                    '</div>' +
                  '</div>' +
                  '<div>' +
                    '<label class="field-label">Elected To</label>' +
                    '<div class="info-grid">' +
                      '<button type="button" class="pill-choice ' + (setupDraft.tossDecision === 'bat' ? 'active' : '') + '" data-action="set-toss-decision" data-val="bat">Bat First</button>' +
                      '<button type="button" class="pill-choice ' + (setupDraft.tossDecision === 'bowl' ? 'active' : '') + '" data-action="set-toss-decision" data-val="bowl">Bowl First</button>' +
                    '</div>' +
                  '</div>' +
                '</div>' +
              '</div>' +

              '<div class="card card-pad stack">' +
                '<div class="card-header-title">Opening Players</div>' +
                '<div class="form-grid-3">' +
                  '<div><label class="field-label" for="inp-striker">Opening Striker *</label><input id="inp-striker" name="striker" type="text" required class="field-input" value="' + escapeHtml(setupDraft.striker) + '" /></div>' +
                  '<div><label class="field-label" for="inp-nonstriker">Opening Non-Striker *</label><input id="inp-nonstriker" name="nonStriker" type="text" required class="field-input" value="' + escapeHtml(setupDraft.nonStriker) + '" /></div>' +
                  '<div><label class="field-label" for="inp-bowler">Opening Bowler *</label><input id="inp-bowler" name="bowler" type="text" required class="field-input" value="' + escapeHtml(setupDraft.bowler) + '" /></div>' +
                '</div>' +
              '</div>' +

              '<button type="submit" class="btn btn-primary btn-full" style="padding:13px; font-size:15px;">' +
                ICONS.play + '<span>Start Match</span>' +
              '</button>' +
            '</form>' +
          '</div>'
        );
      }

      /* ---------- VIEW 2: LIVE SCORING DASHBOARD ---------- */
      function renderLiveView() {
        var match = getActiveMatch();
        if (!match) {
          return (
            '<div class="card card-pad text-center stack" style="padding:36px 20px; align-items:center;">' +
              '<div style="width:52px; height:52px; border-radius:16px; background:var(--emerald-bg); color:var(--emerald-bright); display:flex; align-items:center; justify-content:center; border:1px solid var(--emerald-border);">' + ICONS.trophy + '</div>' +
              '<div style="font-size:18px; font-weight:800;">No Active Match</div>' +
              '<div class="text-sm muted">Start a new match, open one from History, or test with the Demo T20 chase.</div>' +
              '<div class="row-wrap" style="justify-content:center; margin-top:6px;">' +
                '<button type="button" class="btn btn-primary btn-sm" data-action="nav" data-tab="setup">Start New Match</button>' +
                '<button type="button" class="btn btn-subtle btn-sm" data-action="load-demo">' + ICONS.spark + '<span>Load Demo</span></button>' +
                (state.matches.length > 0 ? '<button type="button" class="btn btn-emerald-soft btn-sm" data-action="nav" data-tab="history">Open History (' + state.matches.length + ')</button>' : '') +
              '</div>' +
            '</div>'
          );
        }

        var inn = match.innings[match.currentInningsIndex];
        var inn1 = match.innings[0];
        var striker = getBatter(inn, inn.strikerId);
        var nonStriker = getBatter(inn, inn.nonStrikerId);
        var bowler = getBowler(inn, inn.currentBowlerId);
        var crr = calcRunRate(inn.runs, inn.legalBalls);
        var maxBalls = match.oversPerInnings * 6;
        var canUndo = (state.undoStacks[match.id] || []).length > 0;

        var statusBadge = '<span class="badge badge-live"><span class="live-dot"></span>LIVE • ' + (match.currentInningsIndex === 0 ? '1st' : '2nd') + ' INN</span>';
        if (match.status === 'innings_break') statusBadge = '<span class="badge badge-break">INNINGS BREAK</span>';
        else if (match.status === 'completed') statusBadge = '<span class="badge badge-done">COMPLETED</span>';

        var footerHtml = '';
        if (match.currentInningsIndex === 1) {
          var target = inn1.runs + 1;
          var needed = Math.max(0, target - inn.runs);
          var ballsLeft = Math.max(0, maxBalls - inn.legalBalls);
          var rrr = ballsLeft > 0 ? ((needed / ballsLeft) * 6).toFixed(2) : (needed > 0 ? '—' : '0.00');
          footerHtml =
            '<div class="row-wrap">' +
              '<span class="target-pill">Target ' + target + '</span>' +
              (match.status === 'live'
                ? '<span>Need <strong style="color:#fff;">' + needed + '</strong> off <strong style="color:#fff;">' + ballsLeft + '</strong> ball' + (ballsLeft !== 1 ? 's' : '') + '</span>'
                : '<strong class="text-emerald">' + escapeHtml(match.resultText || computeAutoResult(match)) + '</strong>') +
            '</div>' +
            '<div>RRR: <strong class="text-amber">' + rrr + '</strong></div>';
        } else {
          footerHtml =
            '<span>Toss: <strong style="color:#fff;">' + escapeHtml(match.tossWinner) + '</strong> (' + escapeHtml(match.tossDecision) + ')</span>' +
            '<span>' + escapeHtml(match.venue) + '</span>';
        }

        var bannerHtml = '';
        if (match.status === 'innings_break') {
          bannerHtml =
            '<div class="banner banner-amber">' +
              '<div>' +
                '<div class="text-xs font-extrabold text-amber" style="text-transform:uppercase;">Innings Break</div>' +
                '<div class="font-extrabold text-sm">' + escapeHtml(match.innings[1].battingTeam) + ' need ' + (inn1.runs + 1) + ' runs in ' + match.oversPerInnings + ' overs</div>' +
              '</div>' +
              '<div class="row">' +
                '<button type="button" class="btn btn-xs btn-wa" data-action="open-share" data-id="' + escapeHtml(match.id) + '" data-tab="quick">' + ICONS.wa + '<span>Share</span></button>' +
                '<button type="button" class="btn btn-xs btn-primary" data-action="open-2nd-inn">Start 2nd Innings</button>' +
              '</div>' +
            '</div>';
        } else if (match.status === 'completed') {
          bannerHtml =
            '<div class="banner banner-emerald">' +
              '<div class="row">' +
                '<div style="width:36px; height:36px; border-radius:10px; background:var(--emerald-dark); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;">' + ICONS.trophy + '</div>' +
                '<div>' +
                  '<div class="text-xs font-extrabold text-emerald" style="text-transform:uppercase;">Match Completed</div>' +
                  '<div class="font-extrabold text-sm">' + escapeHtml(match.resultText || computeAutoResult(match)) + '</div>' +
                '</div>' +
              '</div>' +
              '<div class="row-wrap">' +
                '<button type="button" class="btn btn-xs btn-subtle" data-action="open-edit-match" data-id="' + escapeHtml(match.id) + '">' + ICONS.edit + '<span>Edit</span></button>' +
                '<button type="button" class="btn btn-xs btn-wa" data-action="open-share" data-id="' + escapeHtml(match.id) + '" data-tab="quick">' + ICONS.wa + '<span>WhatsApp</span></button>' +
                '<button type="button" class="btn btn-xs btn-primary" data-action="nav" data-tab="scorecard">Full Card</button>' +
              '</div>' +
            '</div>';
        }

        function renderBatterRow(b, isStriker) {
          if (!b) return '<tr><td colspan="6" class="text-xs muted">No batter at this end — use Edit to assign</td></tr>';
          var nameCell = match.status === 'live'
            ? '<button type="button" class="player-name-btn" data-action="rename-player" data-role="batter" data-id="' + escapeHtml(b.id) + '" title="Tap to rename">' + escapeHtml(b.name) + (isStriker ? '*' : '') + '</button>'
            : '<span class="player-name">' + escapeHtml(b.name) + (isStriker ? '*' : '') + '</span>';
          return (
            '<tr class="' + (isStriker ? 'striker-row' : '') + '">' +
              '<td><div class="player-cell">' +
                '<span class="' + (isStriker ? 'striker-dot' : 'nonstriker-dot') + '"></span>' +
                nameCell +
              '</div></td>' +
              '<td class="num font-extrabold">' + b.runs + '</td>' +
              '<td class="num muted">' + b.balls + '</td>' +
              '<td class="num muted">' + b.fours + '</td>' +
              '<td class="num muted">' + b.sixes + '</td>' +
              '<td class="num muted">' + calcStrikeRate(b.runs, b.balls) + '</td>' +
            '</tr>'
          );
        }

        return (
          '<div class="stack">' +
            '<section class="scoreboard">' +
              '<div class="sb-top">' +
                '<span class="sb-match-title">' + escapeHtml(match.title) + '</span>' +
                '<div class="row" style="gap:5px; flex-shrink:0;">' +
                  statusBadge +
                  '<button type="button" class="btn btn-xs btn-subtle" data-action="open-edit-match" data-id="' + escapeHtml(match.id) + '" title="Edit match details">' + ICONS.edit + '<span>Edit</span></button>' +
                  '<button type="button" class="btn btn-xs btn-wa" data-action="open-share" data-id="' + escapeHtml(match.id) + '" data-tab="quick" title="Share to WhatsApp">' + ICONS.wa + '</button>' +
                '</div>' +
              '</div>' +
              '<div class="sb-main">' +
                '<div>' +
                  '<div class="sb-team">' + escapeHtml(inn.battingTeam) + ' <span class="text-xs muted" style="font-weight:600;">vs ' + escapeHtml(inn.bowlingTeam) + '</span></div>' +
                  '<div class="sb-score-line">' +
                    '<span class="sb-score">' + inn.runs + '/' + inn.wickets + '</span>' +
                    '<span class="sb-overs">(' + formatOvers(inn.legalBalls) + ' / ' + match.oversPerInnings + ' ov)</span>' +
                  '</div>' +
                '</div>' +
                '<div class="sb-crr-box">' +
                  '<div class="sb-crr-label">CRR</div>' +
                  '<div class="sb-crr-val">' + crr + '</div>' +
                '</div>' +
              '</div>' +
              '<div class="sb-footer">' + footerHtml + '</div>' +
            '</section>' +

            bannerHtml +

            '<div class="info-grid">' +
              '<div class="info-pill">' +
                '<span class="info-pill-label">Partnership</span>' +
                '<span class="info-pill-val">' + inn.partnership.runs + ' <span>(' + inn.partnership.balls + ')</span></span>' +
              '</div>' +
              '<div class="info-pill">' +
                '<span class="info-pill-label">Extras</span>' +
                '<span class="info-pill-val">' + inn.extras.total + ' <span>(' + inn.extras.wd + 'w, ' + inn.extras.nb + 'nb)</span></span>' +
              '</div>' +
            '</div>' +

            '<section class="card">' +
              '<div class="card-header">' +
                '<span class="card-header-title">Batters <span class="muted" style="font-weight:600; text-transform:none;">(tap name to rename)</span></span>' +
                (match.status === 'live'
                  ? '<button type="button" class="btn btn-xs btn-emerald-soft" data-action="swap-strike">' + ICONS.swap + '<span>Swap Strike</span></button>'
                  : '') +
              '</div>' +
              '<div class="table-wrap">' +
                '<table>' +
                  '<thead><tr><th>Batter</th><th class="num">R</th><th class="num">B</th><th class="num">4s</th><th class="num">6s</th><th class="num">SR</th></tr></thead>' +
                  '<tbody>' + renderBatterRow(striker, true) + renderBatterRow(nonStriker, false) + '</tbody>' +
                '</table>' +
              '</div>' +
            '</section>' +

            '<section class="card">' +
              '<div class="card-header">' +
                '<span class="card-header-title">Bowler</span>' +
                (match.status === 'live'
                  ? '<button type="button" class="btn btn-xs btn-subtle" data-action="change-bowler">' + ICONS.refresh + '<span>Change Bowler</span></button>'
                  : '') +
              '</div>' +
              (bowler
                ? '<div class="table-wrap"><table>' +
                    '<thead><tr><th>Name</th><th class="num">O</th><th class="num">M</th><th class="num">R</th><th class="num">W</th><th class="num">Econ</th></tr></thead>' +
                    '<tbody><tr>' +
                      '<td><div class="player-cell">' +
                        (match.status === 'live'
                          ? '<button type="button" class="player-name-btn" data-action="rename-player" data-role="bowler" data-id="' + escapeHtml(bowler.id) + '" title="Tap to rename">' + escapeHtml(bowler.name) + '</button>'
                          : '<span class="player-name">' + escapeHtml(bowler.name) + '</span>') +
                      '</div></td>' +
                      '<td class="num font-bold">' + formatOvers(bowler.legalBalls) + '</td>' +
                      '<td class="num muted">' + bowler.maidens + '</td>' +
                      '<td class="num">' + bowler.runsConceded + '</td>' +
                      '<td class="num font-extrabold text-emerald">' + bowler.wickets + '</td>' +
                      '<td class="num muted">' + calcEconomy(bowler.runsConceded, bowler.legalBalls) + '</td>' +
                    '</tr></tbody>' +
                  '</table></div>'
                : '<div class="card-pad text-xs muted">No bowler selected.</div>') +
              '<div class="over-strip">' +
                '<span class="over-strip-label">This Over</span>' +
                '<div class="ball-pills">' +
                  (inn.currentOverBalls.length === 0
                    ? '<span class="text-xs muted" style="font-style:italic;">Waiting for next ball...</span>'
                    : inn.currentOverBalls.map(renderBallPill).join('')) +
                '</div>' +
              '</div>' +
            '</section>' +

            (match.status === 'live'
              ? '<section class="keypad-card">' +
                  '<div class="keypad-runs">' +
                    '<button type="button" class="key-run" data-action="score-run" data-runs="0">0</button>' +
                    '<button type="button" class="key-run" data-action="score-run" data-runs="1">1</button>' +
                    '<button type="button" class="key-run" data-action="score-run" data-runs="2">2</button>' +
                    '<button type="button" class="key-run" data-action="score-run" data-runs="3">3</button>' +
                    '<button type="button" class="key-run key-four" data-action="score-run" data-runs="4">4</button>' +
                    '<button type="button" class="key-run key-six" data-action="score-run" data-runs="6">6</button>' +
                  '</div>' +
                  '<div class="keypad-extras">' +
                    '<button type="button" class="key-extra" data-action="open-extra" data-type="wd">WD</button>' +
                    '<button type="button" class="key-extra" data-action="open-extra" data-type="nb">NB</button>' +
                    '<button type="button" class="key-extra key-bye" data-action="open-extra" data-type="b">B</button>' +
                    '<button type="button" class="key-extra key-bye" data-action="open-extra" data-type="lb">LB</button>' +
                    '<button type="button" class="key-extra key-out" data-action="open-wicket">OUT</button>' +
                  '</div>' +
                  '<div class="keypad-utils">' +
                    '<button type="button" class="btn btn-sm btn-subtle" data-action="undo" ' + (!canUndo ? 'disabled' : '') + '>' + ICONS.undo + '<span>Undo</span></button>' +
                    '<button type="button" class="btn btn-sm btn-wa-soft" data-action="open-share" data-id="' + escapeHtml(match.id) + '" data-tab="quick">' + ICONS.wa + '<span>WhatsApp</span></button>' +
                    '<button type="button" class="btn btn-sm btn-subtle" data-action="end-innings">' + ICONS.flag + '<span>' + (match.currentInningsIndex === 0 ? 'End Inn' : 'Finish') + '</span></button>' +
                  '</div>' +
                '</section>'
              : '') +
          '</div>'
        );
      }

      /* ---------- VIEW 3: FULL SCORECARD ---------- */
      function renderScorecardView() {
        var match = getActiveMatch();
        if (!match) {
          return '<div class="card card-pad text-center muted text-sm">No active match selected. Open a match from History or start a new one.</div>';
        }
        var sub = state.scorecardSubTab;
        var i1 = match.innings[0];
        var i2 = match.innings[1];

        return (
          '<div class="stack">' +
            '<div class="scoreboard">' +
              '<div class="row-between" style="flex-wrap:wrap; gap:10px; align-items:flex-start;">' +
                '<div style="min-width:0;">' +
                  '<div style="font-size:17px; font-weight:900;">' + escapeHtml(match.title) + '</div>' +
                  '<div class="text-xs muted" style="margin-top:2px;">' + escapeHtml(match.venue) + ' • ' + escapeHtml(match.date) + ' • ' + match.oversPerInnings + ' Overs</div>' +
                  (match.resultText ? '<div class="text-xs font-extrabold text-emerald" style="margin-top:5px;">' + escapeHtml(match.resultText) + '</div>' : '') +
                '</div>' +
                '<div class="row-wrap">' +
                  '<button type="button" class="btn btn-xs btn-subtle" data-action="open-edit-match" data-id="' + escapeHtml(match.id) + '">' + ICONS.edit + '<span>Edit Details</span></button>' +
                  '<button type="button" class="btn btn-xs btn-wa" data-action="open-share" data-id="' + escapeHtml(match.id) + '" data-tab="quick">' + ICONS.wa + '<span>Share</span></button>' +
                '</div>' +
              '</div>' +
            '</div>' +

            '<div class="seg-tabs">' +
              '<button type="button" class="seg-tab ' + (sub === 0 ? 'active' : '') + '" data-action="set-card-tab" data-sub="0">1st: ' + escapeHtml(i1.battingTeam) + '</button>' +
              '<button type="button" class="seg-tab ' + (sub === 1 ? 'active' : '') + '" data-action="set-card-tab" data-sub="1">2nd: ' + escapeHtml(i2.battingTeam) + '</button>' +
              '<button type="button" class="seg-tab ' + (sub === 2 ? 'active' : '') + '" data-action="set-card-tab" data-sub="2">Over Log</button>' +
            '</div>' +

            (sub === 0 ? renderInningsCardHtml(i1) : '') +
            (sub === 1 ? renderInningsCardHtml(i2) : '') +
            (sub === 2 ? renderOverLogHtml(match) : '') +
          '</div>'
        );
      }

      function renderInningsCardHtml(inn) {
        if (inn.batters.length === 0 && inn.legalBalls === 0 && inn.runs === 0) {
          return '<div class="card card-pad text-center muted text-sm">Innings has not started yet.</div>';
        }
        return (
          '<div class="stack">' +
            '<div class="card">' +
              '<div class="card-header">' +
                '<span class="card-header-title">' + escapeHtml(inn.battingTeam) + ' Batting</span>' +
                '<span class="font-extrabold text-sm">' + inn.runs + '/' + inn.wickets + ' <span class="text-xs muted">(' + formatOvers(inn.legalBalls) + ' ov)</span></span>' +
              '</div>' +
              '<div class="table-wrap"><table>' +
                '<thead><tr><th>Batter</th><th class="num">R</th><th class="num">B</th><th class="num">4s</th><th class="num">6s</th><th class="num">SR</th></tr></thead>' +
                '<tbody>' +
                  inn.batters.map(function (b) {
                    return (
                      '<tr>' +
                        '<td><div class="player-name">' + escapeHtml(b.name) + (!b.isOut ? '*' : '') + '</div><div class="player-dismissal">' + escapeHtml(b.dismissalText || (b.isOut ? 'out' : 'not out')) + '</div></td>' +
                        '<td class="num font-extrabold">' + b.runs + '</td>' +
                        '<td class="num muted">' + b.balls + '</td>' +
                        '<td class="num muted">' + b.fours + '</td>' +
                        '<td class="num muted">' + b.sixes + '</td>' +
                        '<td class="num muted">' + calcStrikeRate(b.runs, b.balls) + '</td>' +
                      '</tr>'
                    );
                  }).join('') +
                  '<tr style="background:rgba(255,255,255,0.02);">' +
                    '<td class="font-bold muted">Extras</td>' +
                    '<td colspan="5" class="num text-xs muted"><strong style="color:#fff;">' + inn.extras.total + '</strong> (wd ' + inn.extras.wd + ', nb ' + inn.extras.nb + ', b ' + inn.extras.b + ', lb ' + inn.extras.lb + ')</td>' +
                  '</tr>' +
                  '<tr style="background:rgba(16,185,129,0.08);">' +
                    '<td class="font-extrabold">Total</td>' +
                    '<td colspan="5" class="num font-extrabold">' + inn.runs + '/' + inn.wickets + ' <span class="text-xs muted">(' + formatOvers(inn.legalBalls) + ' ov, RR ' + calcRunRate(inn.runs, inn.legalBalls) + ')</span></td>' +
                  '</tr>' +
                '</tbody>' +
              '</table></div>' +
            '</div>' +

            (inn.fow.length > 0
              ? '<div class="card card-pad stack-sm">' +
                  '<div class="card-header-title">Fall of Wickets</div>' +
                  '<div class="row-wrap">' +
                    inn.fow.map(function (f) {
                      return '<span style="background:var(--bg-input); border:1px solid var(--border); padding:4px 9px; border-radius:8px; font-size:11.5px;"><strong>' + f.wicketNum + '-' + f.runs + '</strong> (' + escapeHtml(f.batterName) + ', ' + escapeHtml(f.overs) + ')</span>';
                    }).join('') +
                  '</div>' +
                '</div>'
              : '') +

            '<div class="card">' +
              '<div class="card-header"><span class="card-header-title">' + escapeHtml(inn.bowlingTeam) + ' Bowling</span></div>' +

          '<div class="stack">' +

      /* ---------- VIEW 4: PERSISTENT MATCH HISTORY ---------- */
      function renderHistoryView() {
        var q = state.historySearch.trim().toLowerCase();
        var filter = state.historyFilter;

        var filtered = state.matches.filter(function (m) {
          if (filter === 'live' && m.status === 'completed') return false;
          if (filter === 'completed' && m.status !== 'completed') return false;
          if (!q) return true;
          var hay = (m.title + ' ' + m.venue + ' ' + m.team1 + ' ' + m.team2 + ' ' + m.date).toLowerCase();
          return hay.indexOf(q) >= 0;
        });

        return (
          '<div class="stack">' +
            '<div class="card card-pad stack-sm">' +
              '<div class="row-between" style="flex-wrap:wrap; gap:8px;">' +
                '<div>' +
                  '<div style="font-size:17px; font-weight:900;">Match History (' + state.matches.length + ')</div>' +
                  '<div class="text-xs muted">Auto-saved after every ball, wicket &amp; edit.</div>' +
                '</div>' +
                '<div class="row-wrap">' +
                  '<button type="button" class="btn btn-xs btn-subtle" data-action="export-json" title="Backup matches to JSON">' + ICONS.download + '<span>Export</span></button>' +
                  '<button type="button" class="btn btn-xs btn-subtle" data-action="import-json" title="Restore matches from JSON">' + ICONS.upload + '<span>Import</span></button>' +
                  '<button type="button" class="btn btn-xs btn-primary" data-action="nav" data-tab="setup">' + ICONS.plus + '<span>New</span></button>' +
                '</div>' +
              '</div>' +

              '<input id="history-search-input" type="search" class="field-input field-input-sm" value="' + escapeHtml(state.historySearch) + '" placeholder="Search by team, series, or venue..." />' +
              '<div class="row-wrap">' +
                '<button type="button" class="filter-chip ' + (filter === 'all' ? 'active' : '') + '" data-action="set-history-filter" data-filter="all">All (' + state.matches.length + ')</button>' +
                '<button type="button" class="filter-chip ' + (filter === 'live' ? 'active' : '') + '" data-action="set-history-filter" data-filter="live">Live</button>' +
                '<button type="button" class="filter-chip ' + (filter === 'completed' ? 'active' : '') + '" data-action="set-history-filter" data-filter="completed">Completed</button>' +
              '</div>' +
            '</div>' +

            (filtered.length === 0
              ? '<div class="card card-pad text-center stack-sm" style="padding:32px 16px; align-items:center;">' +
                  '<div style="font-size:15px; font-weight:800;">' + (state.matches.length === 0 ? 'No Saved Matches Yet' : 'No Matching Matches') + '</div>' +
                  '<div class="text-xs muted">' + (state.matches.length === 0 ? 'Start a new match or load the demo T20 chase to see it saved here.' : 'Try clearing your search or filter.') + '</div>' +
                  (state.matches.length === 0
                    ? '<div class="row-wrap" style="justify-content:center; margin-top:4px;"><button type="button" class="btn btn-primary btn-sm" data-action="nav" data-tab="setup">New Match</button><button type="button" class="btn btn-subtle btn-sm" data-action="load-demo">' + ICONS.spark + '<span>Load Demo</span></button></div>'
                    : '') +
                '</div>'
              : filtered.map(function (m) {
                  var i1 = m.innings[0];
                  var i2 = m.innings[1];
                  var isActive = m.id === state.activeMatchId;
                  var eq = getEquation(m);
                  var statusBadge = m.status === 'live'
                    ? '<span class="badge badge-live"><span class="live-dot"></span>LIVE</span>'
                    : (m.status === 'completed' ? '<span class="badge badge-done">COMPLETED</span>' : '<span class="badge badge-break">INNINGS BREAK</span>');

                  var openTab = m.status === 'completed' ? 'scorecard' : 'live';
                  var openLabel = m.status === 'completed' ? 'Open Card' : 'Resume Live';

                  return (
                    '<div class="card card-pad stack-sm" style="' + (isActive ? 'border-color:var(--emerald); box-shadow:0 0 0 1px rgba(16,185,129,0.25);' : '') + '">' +
                      '<div class="row-between" style="align-items:flex-start;">' +
                        '<div style="min-width:0;">' +
                          '<div class="row-wrap" style="gap:6px;">' +
                            '<span class="font-extrabold text-sm">' + escapeHtml(m.title) + '</span>' +
                            statusBadge +
                            (isActive ? '<span class="badge badge-active-match">LOADED</span>' : '') +
                          '</div>' +
                          '<div class="text-xs muted" style="margin-top:3px;">' + escapeHtml(m.venue) + ' • ' + escapeHtml(m.date) + ' • ' + m.oversPerInnings + ' Overs</div>' +
                        '</div>' +
                        '<button type="button" class="icon-btn" data-action="delete-match" data-id="' + escapeHtml(m.id) + '" title="Delete match">' + ICONS.trash + '</button>' +
                      '</div>' +

                      '<div style="background:var(--bg-input); border:1px solid var(--border); border-radius:12px; padding:10px 12px;" class="stack-sm">' +
                        '<div class="row-between text-sm">' +
                          '<span class="font-bold">' + escapeHtml(i1.battingTeam) + '</span>' +
                          '<span class="font-extrabold">' + i1.runs + '/' + i1.wickets + ' <span class="text-xs muted">(' + formatOvers(i1.legalBalls) + ' ov)</span></span>' +
                        '</div>' +
                        '<div class="row-between text-sm">' +
                          '<span class="font-bold">' + escapeHtml(i2.battingTeam) + '</span>' +
                          '<span class="font-extrabold">' + (i2.legalBalls > 0 || i2.runs > 0 ? (i2.runs + '/' + i2.wickets + ' <span class="text-xs muted">(' + formatOvers(i2.legalBalls) + ' ov)</span>') : '<span class="text-xs muted">Yet to bat</span>') + '</span>' +
                        '</div>' +
                      '</div>' +

                      '<div class="text-xs font-bold text-emerald">' + escapeHtml(eq.text) + '</div>' +

                      '<div class="row-wrap" style="margin-top:2px;">' +
                        '<button type="button" class="btn btn-xs btn-primary" style="flex:1;" data-action="load-match" data-id="' + escapeHtml(m.id) + '" data-tab="' + openTab + '">' + openLabel + '</button>' +
                        '<button type="button" class="btn btn-xs btn-subtle" style="flex:1;" data-action="open-edit-match" data-id="' + escapeHtml(m.id) + '">' + ICONS.edit + '<span>Edit Details</span></button>' +
                        '<button type="button" class="btn btn-xs btn-wa" data-action="open-share" data-id="' + escapeHtml(m.id) + '" data-tab="quick" title="Share to WhatsApp">' + ICONS.wa + '<span>WhatsApp</span></button>' +
                      '</div>' +
                    '</div>'
                  );
                }).join('')) +
          '</div>'
        );
      }

      /***********************************************************************
       * 8. COMPREHENSIVE 3-TAB EDIT MATCH DETAILS MODAL
       ***********************************************************************/
      function openEditMatchModal(matchId) {
        var match = getMatchById(matchId) || getActiveMatch();
        if (!match) return;
        state.editState = {
          matchId: match.id,
          tab: 'info',
          innIdx: match.currentInningsIndex,
          draft: JSON.parse(JSON.stringify(match))
        };
        renderEditMatchModal();
      }

      function syncEditInputsToDraft() {
        var es = state.editState;
        if (!es) return;
        var d = es.draft;

        if (es.tab === 'info') {
          function getVal(id) { var el = document.getElementById(id); return el ? el.value : null; }
          var newTitle = getVal('ed-title');
          var newVenue = getVal('ed-venue');
          var newDate = getVal('ed-date');
          var newOvers = getVal('ed-overs');
          var newT1 = getVal('ed-team1');
          var newT2 = getVal('ed-team2');
          var newTossWin = getVal('ed-toss-win');
          var newTossDec = getVal('ed-toss-dec');
          var newStatus = getVal('ed-status');
          var newResult = getVal('ed-result');

          var oldT1 = d.team1;
          var oldT2 = d.team2;
          if (newTitle !== null) d.title = newTitle.trim() || d.title;
          if (newVenue !== null) d.venue = newVenue.trim() || 'Tamarind Ground';
          if (newDate !== null && newDate) d.date = newDate;
          if (newOvers !== null) d.oversPerInnings = Math.max(1, parseInt(newOvers, 10) || 20);

          var cleanT1 = newT1 !== null ? (newT1.trim() || oldT1) : oldT1;
          var cleanT2 = newT2 !== null ? (newT2.trim() || oldT2) : oldT2;

          if (cleanT1 !== oldT1 || cleanT2 !== oldT2) {
            d.innings.forEach(function (inn) {
              if (inn.battingTeam === oldT1) inn.battingTeam = cleanT1;
              else if (inn.battingTeam === oldT2) inn.battingTeam = cleanT2;
              if (inn.bowlingTeam === oldT1) inn.bowlingTeam = cleanT1;
              else if (inn.bowlingTeam === oldT2) inn.bowlingTeam = cleanT2;
            });
            if (d.tossWinner === oldT1) d.tossWinner = cleanT1;
            else if (d.tossWinner === oldT2) d.tossWinner = cleanT2;
            d.team1 = cleanT1;
            d.team2 = cleanT2;
          }

          if (newTossWin === 'team1') d.tossWinner = d.team1;
          else if (newTossWin === 'team2') d.tossWinner = d.team2;
          if (newTossDec === 'bat' || newTossDec === 'bowl') d.tossDecision = newTossDec;
          if (newStatus) d.status = newStatus;
          if (newResult !== null) d.resultText = newResult.trim();
        } else if (es.tab === 'batters') {
          var inn = d.innings[es.innIdx];
          inn.batters.forEach(function (b, idx) {
            var nameEl = document.getElementById('ed-bat-name-' + idx);
            var rEl = document.getElementById('ed-bat-r-' + idx);
            var bEl = document.getElementById('ed-bat-b-' + idx);
            var f4El = document.getElementById('ed-bat-4-' + idx);
            var f6El = document.getElementById('ed-bat-6-' + idx);
            var outEl = document.getElementById('ed-bat-out-' + idx);
            var disEl = document.getElementById('ed-bat-dis-' + idx);
            if (nameEl) b.name = nameEl.value.trim() || b.name;
            if (rEl) b.runs = Math.max(0, parseInt(rEl.value, 10) || 0);
            if (bEl) b.balls = Math.max(0, parseInt(bEl.value, 10) || 0);
            if (f4El) b.fours = Math.max(0, parseInt(f4El.value, 10) || 0);
            if (f6El) b.sixes = Math.max(0, parseInt(f6El.value, 10) || 0);
            if (outEl) b.isOut = outEl.value === 'out';
            if (disEl) b.dismissalText = disEl.value.trim() || (b.isOut ? 'out' : 'not out');
          });
          var wdEl = document.getElementById('ed-ex-wd');
          var nbEl = document.getElementById('ed-ex-nb');
          var bExEl = document.getElementById('ed-ex-b');
          var lbEl = document.getElementById('ed-ex-lb');
          if (wdEl) inn.extras.wd = Math.max(0, parseInt(wdEl.value, 10) || 0);
          if (nbEl) inn.extras.nb = Math.max(0, parseInt(nbEl.value, 10) || 0);
          if (bExEl) inn.extras.b = Math.max(0, parseInt(bExEl.value, 10) || 0);
          if (lbEl) inn.extras.lb = Math.max(0, parseInt(lbEl.value, 10) || 0);
          inn.extras.total = inn.extras.wd + inn.extras.nb + inn.extras.b + inn.extras.lb;

          var totREl = document.getElementById('ed-inn-runs');
          var totWEl = document.getElementById('ed-inn-wkts');
          var totOvEl = document.getElementById('ed-inn-overs');
          if (totREl) inn.runs = Math.max(0, parseInt(totREl.value, 10) || 0);
          if (totWEl) inn.wickets = Math.max(0, Math.min(10, parseInt(totWEl.value, 10) || 0));
          if (totOvEl) inn.legalBalls = parseOversToBalls(totOvEl.value);
        } else if (es.tab === 'bowlers') {
          var innB = d.innings[es.innIdx];
          innB.bowlers.forEach(function (bw, idx) {
            var nameEl = document.getElementById('ed-bwl-name-' + idx);
            var ovEl = document.getElementById('ed-bwl-o-' + idx);
            var mEl = document.getElementById('ed-bwl-m-' + idx);
            var rEl = document.getElementById('ed-bwl-r-' + idx);
            var wEl = document.getElementById('ed-bwl-w-' + idx);
            if (nameEl) bw.name = nameEl.value.trim() || bw.name;
            if (ovEl) bw.legalBalls = parseOversToBalls(ovEl.value);
            if (mEl) bw.maidens = Math.max(0, parseInt(mEl.value, 10) || 0);
            if (rEl) bw.runsConceded = Math.max(0, parseInt(rEl.value, 10) || 0);
            if (wEl) bw.wickets = Math.max(0, parseInt(wEl.value, 10) || 0);
          });
        }
      }

      function saveEditMatchChanges() {
        var es = state.editState;
        if (!es) return;
        syncEditInputsToDraft();

        var updated = sanitizeMatch(es.draft);
        if (!updated) return;

        updated.innings.forEach(function (inn) {
          if (inn.batters.length > 0) {
            if (!getBatter(inn, inn.strikerId)) {
              var notOut = inn.batters.find(function (b) { return !b.isOut; });
              inn.strikerId = notOut ? notOut.id : inn.batters[0].id;
            }
            if (!getBatter(inn, inn.nonStrikerId) || inn.nonStrikerId === inn.strikerId) {
              var other = inn.batters.find(function (b) { return !b.isOut && b.id !== inn.strikerId; });
              inn.nonStrikerId = other ? other.id : null;
            }
          }
          if (inn.bowlers.length > 0 && !getBowler(inn, inn.currentBowlerId)) {
            inn.currentBowlerId = inn.bowlers[0].id;
          }
        });

        updated.updatedAt = Date.now();
        var idx = state.matches.findIndex(function (m) { return m.id === es.matchId; });
        if (idx >= 0) state.matches[idx] = updated;
        else state.matches.unshift(updated);

        state.editState = null;
        saveState();
        closeModal();
        render();
        showToast('Match details saved!');
      }

      function compactPlayerName(name) {
        var clean = String(name || '').trim();
        var parts = clean.split(/\s+/);
        if (parts.length <= 1 || clean.length <= 14) return clean;
        return parts[0].charAt(0).toUpperCase() + '. ' + parts.slice(1).join(' ');
      }

      function getEquation(match) {
        var i1 = match.innings[0];
        var i2 = match.innings[1];
        if (match.status === 'completed') {
          return { emoji: '🏆', text: match.resultText || computeAutoResult(match) };
        }
        if (match.status === 'innings_break') {
          return { emoji: '🎯', text: i2.battingTeam + ' need ' + (i1.runs + 1) + ' runs in ' + match.oversPerInnings + ' overs' };
        }
        if (match.currentInningsIndex === 1) {
          var target = i1.runs + 1;
          var needed = Math.max(0, target - i2.runs);
          var ballsLeft = Math.max(0, (match.oversPerInnings * 6) - i2.legalBalls);
          var rrr = ballsLeft > 0 ? ((needed / ballsLeft) * 6).toFixed(2) : '—';
          return { emoji: '🔥', text: i2.battingTeam + ' need ' + needed + ' run' + (needed !== 1 ? 's' : '') + ' in ' + ballsLeft + ' ball' + (ballsLeft !== 1 ? 's' : '') + ' (RRR: ' + rrr + ')' };
        }
        return { emoji: '🔴', text: '1st Innings Live • CRR: ' + calcRunRate(i1.runs, i1.legalBalls) };
      }

      function getTopPerformers(inn, isLive) {
        var batters = [];
        if (isLive) {
          var activeIds = [inn.strikerId, inn.nonStrikerId].filter(Boolean);
          var active = activeIds.map(function (id) { return getBatter(inn, id); }).filter(Boolean);
          var restBat = inn.batters.filter(function (b) { return activeIds.indexOf(b.id) < 0; })
            .sort(function (a, b) { return (b.runs - a.runs) || (a.balls - b.balls); });
          batters = active.concat(restBat).slice(0, 2);
        } else {
          batters = inn.batters.slice().sort(function (a, b) { return (b.runs - a.runs) || (a.balls - b.balls); }).slice(0, 2);
        }

        var bowlers = [];
        if (isLive && inn.currentBowlerId) {
          var curr = getBowler(inn, inn.currentBowlerId);
          var restBwl = inn.bowlers.filter(function (b) { return b.id !== inn.currentBowlerId; })
            .sort(function (a, b) { return (b.wickets - a.wickets) || (a.runsConceded - b.runsConceded); });
          bowlers = (curr ? [curr].concat(restBwl) : restBwl).slice(0, 2);
        } else {
          bowlers = inn.bowlers.slice().sort(function (a, b) { return (b.wickets - a.wickets) || (a.runsConceded - b.runsConceded); }).slice(0, 2);
        }
        return { batters: batters, bowlers: bowlers };
      }

      function buildQuickWhatsApp(match) {
        var DIV = '──────────────';
        var i1 = match.innings[0];
        var i2 = match.innings[1];
        var eq = getEquation(match);
        var hasInn2 = i2.legalBalls > 0 || i2.runs > 0 || match.currentInningsIndex === 1;

        var lines = [
          '🏏 *Tamarind Cricket Players (TCP)*',
          '*' + match.title.toUpperCase() + '*',
          '📍 _' + match.venue + ' • ' + match.date + '_',
          DIV,
          '*' + i1.battingTeam.toUpperCase() + ':* *' + i1.runs + '/' + i1.wickets + '* (' + formatOvers(i1.legalBalls) + ' ov)'
        ];
        if (hasInn2) {
          lines.push('*' + i2.battingTeam.toUpperCase() + ':* *' + i2.runs + '/' + i2.wickets + '* (' + formatOvers(i2.legalBalls) + ' ov)');
        }
        lines.push('');
        lines.push(eq.emoji + ' *' + eq.text + '*');

        if (match.status === 'live') {
          var activeInn = match.innings[match.currentInningsIndex];
          if (activeInn.partnership.balls > 0 || activeInn.partnership.runs > 0) {
            lines.push('🤝 Partnership: ' + activeInn.partnership.runs + ' (' + activeInn.partnership.balls + ')');
          }
          if (activeInn.currentOverBalls.length > 0) {
            lines.push('🎯 This Over: ' + activeInn.currentOverBalls.map(function (b) { return b.label; }).join(' '));
          } else if (activeInn.oversLog.length > 0) {
            var last = activeInn.oversLog[0];
            lines.push('🎯 Last Over (' + last.overNum + '): ' + last.balls.map(function (b) { return b.label; }).join(' ') + ' (' + last.runsInOver + 'r)');
          }
        }

        lines.push(DIV);

        function pushHighlights(inn, isLive) {
          var top = getTopPerformers(inn, isLive);
          if (top.batters.length > 0) {
            lines.push('*Batting (' + inn.battingTeam + '):*');
            top.batters.forEach(function (b) {
              var notOut = !b.isOut ? '✱' : '';
              var bdry = (b.fours > 0 || b.sixes > 0) ? ' _(' + b.fours + '×4, ' + b.sixes + '×6)_' : '';
              lines.push('• *' + compactPlayerName(b.name) + notOut + '* — ' + b.runs + ' (' + b.balls + ')' + bdry);
            });
          }
          if (top.bowlers.length > 0) {
            lines.push('');
            lines.push('*Bowling (' + inn.bowlingTeam + '):*');
            top.bowlers.forEach(function (bw) {
              lines.push('• *' + compactPlayerName(bw.name) + '* — ' + formatOvers(bw.legalBalls) + '-' + bw.maidens + '-' + bw.runsConceded + '-' + bw.wickets + ' _(Econ ' + calcEconomy(bw.runsConceded, bw.legalBalls) + ')_');
            });
          }
        }

        if (match.status === 'completed' && hasInn2) {
          pushHighlights(i1, false);
          lines.push(DIV);
          pushHighlights(i2, false);
        } else {
          pushHighlights(match.innings[match.currentInningsIndex], match.status === 'live');
        }

        lines.push(DIV);
        lines.push('_Scored via Tamarind Cricket Players (TCP)_');
        return lines.join('\n');
      }

      function buildFullWhatsApp(match) {
        var DIV = '──────────────';
        var eq = getEquation(match);
        var lines = [
          '🏏 *Tamarind Cricket Players (TCP)*',
          '*' + match.title.toUpperCase() + '*',
          '📍 _' + match.venue + ' • ' + match.date + ' • ' + match.oversPerInnings + ' Overs_',
          '🪙 _Toss: ' + match.tossWinner + ' elected to ' + match.tossDecision + '_',
          eq.emoji + ' *' + eq.text + '*'
        ];

        match.innings.forEach(function (inn, idx) {
          if (inn.batters.length === 0 && inn.legalBalls === 0 && inn.runs === 0) return;
          lines.push('');
          lines.push(DIV);
          lines.push('📋 *' + (idx === 0 ? '1ST' : '2ND') + ' INNINGS — ' + inn.battingTeam.toUpperCase() + '*');
          lines.push('*Total: ' + inn.runs + '/' + inn.wickets + '* _(' + formatOvers(inn.legalBalls) + ' ov | RR: ' + calcRunRate(inn.runs, inn.legalBalls) + ')_');
          lines.push('');
          lines.push('*BATTING:*');
          inn.batters.forEach(function (b) {
            var notOut = !b.isOut ? '✱' : '';
            lines.push('• *' + b.name + notOut + '* — ' + b.runs + ' (' + b.balls + ') | 4s: ' + b.fours + ', 6s: ' + b.sixes);
            if (b.isOut && b.dismissalText) lines.push('  _' + b.dismissalText + '_');
          });
          lines.push('• *Extras:* ' + inn.extras.total + ' _(wd ' + inn.extras.wd + ', nb ' + inn.extras.nb + ', b ' + inn.extras.b + ', lb ' + inn.extras.lb + ')_');

          if (inn.fow.length > 0) {
            lines.push('');
            lines.push('*FALL OF WICKETS:*');
            lines.push('_' + inn.fow.map(function (f) { return f.wicketNum + '-' + f.runs + ' (' + compactPlayerName(f.batterName) + ', ' + f.overs + ')'; }).join(' • ') + '_');
          }

          if (inn.bowlers.length > 0) {
            lines.push('');
            lines.push('*BOWLING (' + inn.bowlingTeam + '):*');
            inn.bowlers.forEach(function (bw) {
              lines.push('• *' + bw.name + '* — ' + formatOvers(bw.legalBalls) + '-' + bw.maidens + '-' + bw.runsConceded + '-' + bw.wickets + ' | Econ: ' + calcEconomy(bw.runsConceded, bw.legalBalls));
            });
          }
        });

        lines.push(DIV);
        lines.push('_Scored via Tamarind Cricket Players (TCP)_');
        return lines.join('\n');
      }

      function copyTextToClipboard(text) {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) { showToast('Copied for WhatsApp!'); return; }
        } catch (e) { /* fallback */ }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text)
            .then(function () { showToast('Copied for WhatsApp!'); })
            .catch(function () { showToast('Could not copy text', true); });
        } else {
          showToast('Could not copy text', true);
        }
      }

      function roundRectPath(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function exportHistoryJson() {

          showToast('No matches to export', true);
          return;
        }
        try {
          var blob = new Blob([JSON.stringify(state.matches, null, 2)], { type: 'application/json' });

          var a = document.createElement('a');
          a.href = url;
          a.download = 'tcp_cricket_matches_backup.json';

          a.click();
          document.body.removeChild(a);

        } catch (err) {
          showToast('Export failed', true);
        }
      }

      function handleImportFile(file) {
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(String(reader.result || ''));
            var list = Array.isArray(parsed) ? parsed : [parsed];
            var valid = list.map(sanitizeMatch).filter(Boolean);
            if (valid.length === 0) {
              showToast('No valid matches found in file', true);
              return;
            }
            var added = 0;
            valid.forEach(function (m) {
              var existingIdx = state.matches.findIndex(function (x) { return x.id === m.id; });
              if (existingIdx >= 0) {
                state.matches[existingIdx] = m;
              } else {
                state.matches.unshift(m);
                added += 1;
              }
            });
            if (!state.activeMatchId && state.matches.length > 0) state.activeMatchId = state.matches[0].id;
            saveState();
            render();
            showToast('Imported ' + valid.length + ' match(es) (' + added + ' new)');
          } catch (err) {
            showToast('Invalid JSON backup file', true);
          }
        };
        reader.readAsText(file);
      }

      /***********************************************************************
       * 13. UNIFIED EVENT DELEGATION ON DOCUMENT.BODY
       ***********************************************************************/
      document.body.addEventListener('click', function (e) {
        if (e.target && e.target.id === 'modal-backdrop') {
          closeModal();
          return;
        }
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        var action = btn.getAttribute('data-action');

        if (action === 'nav') {
          var tab = btn.getAttribute('data-tab');
          state.currentTab = tab;
          if (tab === 'scorecard') {
            var m = getActiveMatch();
            if (m) state.scorecardSubTab = m.currentInningsIndex;
          }
          render();
          window.scrollTo(0, 0);
        } else if (action === 'load-demo') {
          loadDemoMatch();
        } else if (action === 'reset-all-data') {
          resetAllSavedData();
        } else if (action === 'set-overs') {
          setupDraft.overs = parseInt(btn.getAttribute('data-overs'), 10) || 20;
          render();
        } else if (action === 'set-toss-winner') {
          setupDraft.tossWinner = btn.getAttribute('data-val');
          render();
        } else if (action === 'set-toss-decision') {
          setupDraft.tossDecision = btn.getAttribute('data-val');
          render();
        } else if (action === 'score-run') {
          recordBall({ runsOffBat: parseInt(btn.getAttribute('data-runs'), 10) || 0 });
        } else if (action === 'open-extra') {
          openExtraModal(btn.getAttribute('data-type'));
        } else if (action === 'submit-extra') {
          var type = btn.getAttribute('data-type');
          var runs = parseInt(btn.getAttribute('data-runs'), 10) || 0;
          if (type === 'nb') {
            var checked = document.querySelector('input[name="nb-source"]:checked');
            var src = checked ? checked.value : 'bat';
            closeModal();
            recordBall({ extraType: 'nb', runsOffBat: src === 'bat' ? runs : 0, extraRuns: src === 'bye' ? runs : 0 });
          } else {
            closeModal();
            recordBall({ extraType: type, extraRuns: runs });
          }
        } else if (action === 'open-wicket') {
          openWicketModal();
        } else if (action === 'swap-strike') {
          swapStrike();
        } else if (action === 'change-bowler') {
          openChangeBowlerModal(false);
        } else if (action === 'pick-bowler') {
          var matchPick = getActiveMatch();
          if (matchPick) {
            matchPick.innings[matchPick.currentInningsIndex].currentBowlerId = btn.getAttribute('data-id');
            matchPick.updatedAt = Date.now();
            saveState();
            closeModal();
            render();
            showToast('Bowler updated');
          }
        } else if (action === 'rename-player') {
          openRenameModal(btn.getAttribute('data-role'), btn.getAttribute('data-id'));
        } else if (action === 'undo') {
          undoLastBall();
        } else if (action === 'end-innings') {
          openEndInningsModal();
        } else if (action === 'confirm-end-innings') {
          var matchEnd = getActiveMatch();
          if (!matchEnd) return;
          pushUndo(matchEnd);
          var innEnd = matchEnd.innings[matchEnd.currentInningsIndex];
          var bwlEnd = getBowler(innEnd, innEnd.currentBowlerId);
          if (innEnd.currentOverBalls.length > 0) archivePartialOver(innEnd, bwlEnd);
          if (matchEnd.currentInningsIndex === 0) {
            matchEnd.status = 'innings_break';
          } else {
            matchEnd.status = 'completed';
            matchEnd.resultText = computeAutoResult(matchEnd);
          }
          matchEnd.updatedAt = Date.now();
          saveState();
          closeModal();
          render();
          showToast(matchEnd.status === 'completed' ? matchEnd.resultText : '1st Innings ended');
        } else if (action === 'open-2nd-inn') {
          openSecondInningsModal();
        } else if (action === 'set-card-tab') {
          state.scorecardSubTab = parseInt(btn.getAttribute('data-sub'), 10) || 0;
          render();
        } else if (action === 'set-history-filter') {
          state.historyFilter = btn.getAttribute('data-filter') || 'all';
          render();
        } else if (action === 'export-json') {
          exportHistoryJson();
        } else if (action === 'import-json') {
          var inp = document.getElementById('import-json-input');
          if (inp) { inp.value = ''; inp.click(); }
        } else if (action === 'load-match') {
          state.activeMatchId = btn.getAttribute('data-id');
          state.currentTab = btn.getAttribute('data-tab') || 'live';
          var mLoad = getActiveMatch();
          if (mLoad && state.currentTab === 'scorecard') state.scorecardSubTab = mLoad.currentInningsIndex;
          saveState();
          render();
          window.scrollTo(0, 0);
        } else if (action === 'delete-match') {
          openDeleteMatchModal(btn.getAttribute('data-id'));
        } else if (action === 'confirm-delete-match') {
          var delId = btn.getAttribute('data-id');
          state.matches = state.matches.filter(function (m) { return m.id !== delId; });
          if (state.activeMatchId === delId) {
            state.activeMatchId = state.matches.length > 0 ? state.matches[0].id : null;
          }
          saveState();
          closeModal();
          render();
          showToast('Match deleted from history');
        } else if (action === 'open-edit-match') {
          openEditMatchModal(btn.getAttribute('data-id'));
        } else if (action === 'edit-set-tab') {
          syncEditInputsToDraft();
          if (state.editState) {
            state.editState.tab = btn.getAttribute('data-tab') || 'info';
            renderEditMatchModal();
          }
        } else if (action === 'edit-set-inn') {
          syncEditInputsToDraft();
          if (state.editState) {
            state.editState.innIdx = parseInt(btn.getAttribute('data-idx'), 10) === 1 ? 1 : 0;
            renderEditMatchModal();
          }
        } else if (action === 'edit-autocalc-result') {
          syncEditInputsToDraft();
          if (state.editState) {
            state.editState.draft.resultText = computeAutoResult(state.editState.draft);
            var resInp = document.getElementById('ed-result');
            if (resInp) resInp.value = state.editState.draft.resultText;
            showToast('Result calculated');
          }
        } else if (action === 'edit-recalc-total') {
          syncEditInputsToDraft();
          if (state.editState) {
            var innRec = state.editState.draft.innings[state.editState.innIdx];
            var batSum = innRec.batters.reduce(function (s, b) { return s + (Number(b.runs) || 0); }, 0);
            var outCount = innRec.batters.filter(function (b) { return b.isOut; }).length;
            innRec.extras.total = innRec.extras.wd + innRec.extras.nb + innRec.extras.b + innRec.extras.lb;
            innRec.runs = batSum + innRec.extras.total;
            innRec.wickets = Math.min(10, outCount);
            renderEditMatchModal();
            showToast('Total recalculated: ' + innRec.runs + '/' + innRec.wickets);
          }
        } else if (action === 'edit-add-batter') {
          syncEditInputsToDraft();
          if (state.editState) {
            addBatter(state.editState.draft.innings[state.editState.innIdx], '');
            renderEditMatchModal();
          }
        } else if (action === 'edit-remove-batter') {
          syncEditInputsToDraft();
          if (state.editState) {
            var idxB = parseInt(btn.getAttribute('data-idx'), 10);
            var innRB = state.editState.draft.innings[state.editState.innIdx];
            if (!isNaN(idxB) && idxB >= 0 && idxB < innRB.batters.length) {
              innRB.batters.splice(idxB, 1);
              renderEditMatchModal();
            }
          }
        } else if (action === 'edit-add-bowler') {
          syncEditInputsToDraft();
          if (state.editState) {
            var innAB = state.editState.draft.innings[state.editState.innIdx];
            innAB.bowlers.push({
              id: uid('bwl'),
              name: 'Bowler ' + (innAB.bowlers.length + 1),
              legalBalls: 0, maidens: 0, runsConceded: 0, wickets: 0,
              currentOverRuns: 0, currentOverLegalBalls: 0
            });
            renderEditMatchModal();
          }
        } else if (action === 'edit-remove-bowler') {
          syncEditInputsToDraft();
          if (state.editState) {
            var idxBw = parseInt(btn.getAttribute('data-idx'), 10);
            var innRBw = state.editState.draft.innings[state.editState.innIdx];
            if (!isNaN(idxBw) && idxBw >= 0 && idxBw < innRBw.bowlers.length) {
              innRBw.bowlers.splice(idxBw, 1);
              renderEditMatchModal();
            }
          }
        } else if (action === 'edit-save-all') {
          saveEditMatchChanges();
        } else if (action === 'open-share') {
          openShareModal(btn.getAttribute('data-id'), btn.getAttribute('data-tab') || 'quick');
        } else if (action === 'set-share-tab') {
          state.shareTab = btn.getAttribute('data-tab') || 'quick';
          renderShareModal();
        } else if (action === 'copy-wa-text') {
          var mCopy = getMatchById(state.shareMatchId) || getActiveMatch();
          if (mCopy) copyTextToClipboard(state.shareTab === 'full' ? buildFullWhatsApp(mCopy) : buildQuickWhatsApp(mCopy));
        } else if (action === 'native-share-text') {
          var mShare = getMatchById(state.shareMatchId) || getActiveMatch();
          if (mShare && navigator.share) {
            var txt = state.shareTab === 'full' ? buildFullWhatsApp(mShare) : buildQuickWhatsApp(mShare);
            navigator.share({ title: mShare.title, text: txt }).catch(function (err) {
              if (err && err.name !== 'AbortError') copyTextToClipboard(txt);
            });
          }
        } else if (action === 'download-png') {
          downloadCanvasPng();
        } else if (action === 'share-png') {
          shareCanvasPng();
        } else if (action === 'close-modal') {
          closeModal();
        }
      });

      document.body.addEventListener('input', function (e) {
        var t = e.target;
        if (!t) return;
        if (t.id === 'history-search-input') {
          state.historySearch = t.value;
          var pos = t.selectionStart;
          render();
          var el = document.getElementById('history-search-input');
          if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) {} }
          return;
        }
        if (t.form && t.form.id === 'setup-form' && t.name) {
          setupDraft[t.name] = t.name === 'overs' ? Math.max(1, parseInt(t.value, 10) || 1) : t.value;
          if (t.name === 'team1') {
            var b1 = document.getElementById('toss-t1-btn');
            if (b1) b1.textContent = t.value.trim() || 'Team A';
          } else if (t.name === 'team2') {
            var b2 = document.getElementById('toss-t2-btn');
            if (b2) b2.textContent = t.value.trim() || 'Team B';
          }
        }
      });

      document.body.addEventListener('change', function (e) {
        var t = e.target;
        if (!t) return;
        if (t.id === 'wkt-type') {
          var val = t.value;
          var fw = document.getElementById('wkt-fielder-wrap');
          var rw = document.getElementById('wkt-runout-wrap');
          if (fw) fw.classList.toggle('hidden', !(val === 'Caught' || val === 'Run Out' || val === 'Stumped'));
          if (rw) rw.classList.toggle('hidden', val !== 'Run Out');
        } else if (t.id === 'import-json-input' && t.files && t.files[0]) {
          handleImportFile(t.files[0]);
        }
      });

      document.body.addEventListener('submit', function (e) {
        var form = e.target;
        if (!form || !form.id) return;
        e.preventDefault();

        if (form.id === 'setup-form') {
          var t1 = String(setupDraft.team1 || '').trim() || 'Team A';
          var t2 = String(setupDraft.team2 || '').trim() || 'Team B';
          var tossWin = setupDraft.tossWinner === 'team1' ? t1 : t2;
          var other = setupDraft.tossWinner === 'team1' ? t2 : t1;
          var batFirst = setupDraft.tossDecision === 'bat' ? tossWin : other;
          var bowlFirst = batFirst === t1 ? t2 : t1;

          var i1 = createEmptyInnings(batFirst, bowlFirst);
          var i2 = createEmptyInnings(bowlFirst, batFirst);
          var s = addBatter(i1, setupDraft.striker);
          var ns = addBatter(i1, setupDraft.nonStriker);
          var bw = findOrCreateBowler(i1, setupDraft.bowler);
          i1.strikerId = s.id;
          i1.nonStrikerId = ns.id;
          i1.currentBowlerId = bw.id;

          var match = {
            id: uid('match'),
            title: String(setupDraft.title || '').trim() || (t1 + ' vs ' + t2),
            venue: String(setupDraft.venue || '').trim() || 'Tamarind Cricket Ground',
            date: setupDraft.date || todayStr,
            oversPerInnings: Math.max(1, parseInt(setupDraft.overs, 10) || 20),
            team1: t1,
            team2: t2,
            tossWinner: tossWin,
            tossDecision: setupDraft.tossDecision,
            status: 'live',
            resultText: '',
            currentInningsIndex: 0,
            innings: [i1, i2],
            createdAt: Date.now(),
            updatedAt: Date.now()
          };

          state.matches.unshift(match);
          state.activeMatchId = match.id;
          state.currentTab = 'live';
          setupDraft = createDefaultDraft();
          saveState();
          render();
          showToast('Match started & saved to History!');
        } else if (form.id === 'wicket-form') {
          var matchW = getActiveMatch();
          if (!matchW) return;
          var innW = matchW.innings[matchW.currentInningsIndex];
          var dType = document.getElementById('wkt-type').value;
          var fielder = (document.getElementById('wkt-fielder') || {}).value || '';
          var outBatterId = dType === 'Run Out'
            ? ((document.getElementById('wkt-batter') || {}).value || innW.strikerId)
            : innW.strikerId;
          var runsOffBat = dType === 'Run Out'
            ? (parseInt((document.getElementById('wkt-runs') || {}).value, 10) || 0)
            : 0;
          var nextBat = (document.getElementById('wkt-next') || {}).value || '';
          closeModal();
          recordBall({
            isWicket: true,
            runsOffBat: runsOffBat,
            dismissalType: dType,
            fielderName: fielder,
            outBatterId: outBatterId,
            nextBatterName: nextBat
          });
        } else if (form.id === 'bowler-form') {
          var matchB = getActiveMatch();
          if (!matchB) return;
          var innB = matchB.innings[matchB.currentInningsIndex];
          var name = (document.getElementById('new-bowler-name') || {}).value || '';
          var bwl = findOrCreateBowler(innB, name);
          innB.currentBowlerId = bwl.id;
          matchB.updatedAt = Date.now();
          saveState();
          closeModal();
          render();
          showToast(bwl.name + ' into the attack');
        } else if (form.id === 'second-inn-form') {
          var match2 = getActiveMatch();
          if (!match2) return;
          pushUndo(match2);
          var i2 = match2.innings[1];
          var s2 = addBatter(i2, document.getElementById('i2-striker').value);
          var ns2 = addBatter(i2, document.getElementById('i2-nonstriker').value);
          var bw2 = findOrCreateBowler(i2, document.getElementById('i2-bowler').value);
          i2.strikerId = s2.id;
          i2.nonStrikerId = ns2.id;
          i2.currentBowlerId = bw2.id;
          match2.currentInningsIndex = 1;
          match2.status = 'live';
          match2.updatedAt = Date.now();
          saveState();
          closeModal();
          render();
          showToast('2nd Innings underway!');
        } else if (form.id === 'rename-form') {
          var matchR = getActiveMatch();
          if (!matchR) return;
          var innR = matchR.innings[matchR.currentInningsIndex];
          var role = form.getAttribute('data-role');
          var id = form.getAttribute('data-id');
          var newName = ((document.getElementById('rename-input') || {}).value || '').trim();
          var player = role === 'batter' ? getBatter(innR, id) : getBowler(innR, id);
          if (player && newName) {
            player.name = newName;
            matchR.updatedAt = Date.now();
            saveState();
            closeModal();
            render();
            showToast('Name updated');
          }
        }
      });

      /***********************************************************************
       * 14. CRASH-PROOF SYNCHRONOUS INIT
       ***********************************************************************/
      function init() {
        try {
          loadState();
          render();
        } catch (err) {
          renderErrorRecovery(err);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
