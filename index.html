              '<div class="seg-tabs seg-tabs-2">' +
                '<button type="button" class="seg-tab ' + (state.editInn === 0 ? 'active' : '') + '" data-action="edit-inn" data-idx="0">1st: ' + esc(d.innings[0].battingTeam) + '</button>' +
                '<button type="button" class="seg-tab ' + (state.editInn === 1 ? 'active' : '') + '" data-action="edit-inn" data-idx="1">2nd: ' + esc(d.innings[1].battingTeam) + '</button>' +
              '</div>' +
              '<div class="form-grid-3">' +
                '<div><label class="mini-label">Runs</label><input type="number" class="field-input field-input-sm" data-inn-edit="runs" value="' + inn.runs + '" /></div>' +
                '<div><label class="mini-label">Wickets</label><input type="number" class="field-input field-input-sm" data-inn-edit="wickets" value="' + inn.wickets + '" /></div>' +
                '<div><label class="mini-label">Balls</label><input type="number" class="field-input field-input-sm" data-inn-edit="balls" value="' + inn.balls + '" /></div>' +
              '</div>' +
              '<div class="edit-stats-grid-4">' +
                '<div><label class="mini-label">WD</label><input type="number" class="field-input field-input-sm" data-ex-edit="wd" value="' + inn.extras.wd + '" /></div>' +
                '<div><label class="mini-label">NB</label><input type="number" class="field-input field-input-sm" data-ex-edit="nb" value="' + inn.extras.nb + '" /></div>' +
                '<div><label class="mini-label">B</label><input type="number" class="field-input field-input-sm" data-ex-edit="b" value="' + inn.extras.b + '" /></div>' +
                '<div><label class="mini-label">LB</label><input type="number" class="field-input field-input-sm" data-ex-edit="lb" value="' + inn.extras.lb + '" /></div>' +
              '</div>' +
            '</div>';
        }

        openModal(
          '<div class="modal-head"><span class="font-extrabold">Edit Match & Squads</span><button type="button" class="icon-btn" data-action="close-modal">✕</button></div>' +
          '<div class="modal-scroll stack-sm">' +
            '<div class="seg-tabs">' +
              '<button type="button" class="seg-tab ' + (state.editTab === 'info' ? 'active' : '') + '" data-action="edit-tab" data-tab="info">Match Info</button>' +
              '<button type="button" class="seg-tab ' + (state.editTab === 'squads' ? 'active' : '') + '" data-action="edit-tab" data-tab="squads">Squads / Players</button>' +
              '<button type="button" class="seg-tab ' + (state.editTab === 'innings' ? 'active' : '') + '" data-action="edit-tab" data-tab="innings">Innings / Reopen</button>' +
            '</div>' +
            body +
          '</div>' +
          '<div class="modal-foot">' +
            '<button type="button" class="btn btn-subtle" style="flex:1;" data-action="close-modal">Cancel</button>' +
            '<button type="button" class="btn btn-primary" style="flex:1;" data-action="save-edit">Save Changes</button>' +
          '</div>',
          true
        );
      }

      /* ======================== EVENT DELEGATION ======================== */
      document.addEventListener('click', async function (e) {
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        var action = btn.dataset.action;

        if (action === 'nav') {
          state.currentTab = btn.dataset.tab;
          if (state.currentTab === 'setup' && !state.setup) initSetupDraft();
          render();
        } else if (action === 'close-modal') {
          closeModal();
        } else if (action === 'open-auth') {
          openAuthModal();
        } else if (action === 'toggle-preview-viewer') {
          state.previewViewer = !state.previewViewer;
          if (state.previewViewer) state.currentTab = 'live';
          render();
          showToast(state.previewViewer ? 'Previewing Read-Only Viewer Mode' : 'Returned to Admin Mode');
        } else if (action === 'toggle-auth-mode') {
          state.authFormMode = state.authFormMode === 'signin' ? 'signup' : 'signin';
          openAuthModal();
        } else if (action === 'google-signin') {
          if (!fb.auth) return;
          var provider = new firebase.auth.GoogleAuthProvider();
          try {
            await fb.auth.signInWithPopup(provider);
            closeModal();
            showToast('Signed in with Google!');
          } catch (err) {
            if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
              fb.auth.signInWithRedirect(provider);
            } else {
              showToast(err.message || 'Google Sign-In failed', true);
            }
          }
        } else if (action === 'sign-out') {
          if (!fb.auth) return;
          await fb.auth.signOut();
          state.previewViewer = false;
          closeModal();
          state.currentTab = 'live';
          render();
          showToast('Signed out (Viewer Mode)');
        } else if (action === 'claim-admin') {
          if (!state.user || !state.user.email) return;
          var em = state.user.email.toLowerCase();
          await saveAdminsCloud(em, [em]);
          closeModal();
          showToast('You are now Primary Admin!');
        } else if (action === 'remove-admin') {
          var remEmail = btn.dataset.email;
          var nextAdmins = state.admins.filter(function (a) { return a !== remEmail; });
          await saveAdminsCloud(state.primaryAdmin, nextAdmins);
          showToast('Admin removed');
        } else if (action === 'load-demo') {
          var dm = createDemoMatch();
          state.matches.unshift(dm);
          state.activeMatchId = dm.id;
          state.currentTab = 'live';
          await persistState();
          render();
          showToast('Demo T20 Chase loaded!');
        }

        /* ---- TEAMS LIBRARY ACTIONS ---- */
        else if (action === 'load-sample-teams') {
          SAMPLE_TEAMS.forEach(function (st) {
            var exists = state.teams.some(function (t) { return t.name.toLowerCase() === st.name.toLowerCase(); });
            if (!exists) state.teams.push(clone(st));
          });
          await persistTeams();
          render();
          showToast('Sample TCP Teams loaded!');
        } else if (action === 'team-new') {
          state.teamEditor = { id: null, name: '', players: [], showBulk: false };
          render();
        } else if (action === 'team-edit') {
          var tFound = state.teams.find(function (t) { return t.id === btn.dataset.id; });
          if (tFound) {
            state.teamEditor = { id: tFound.id, name: tFound.name, players: tFound.players.slice(), showBulk: false };
            render();
          }
        } else if (action === 'team-ed-cancel') {
          state.teamEditor = null;
          render();
        } else if (action === 'team-ed-toggle-bulk') {
          if (state.teamEditor) {
            state.teamEditor.showBulk = !state.teamEditor.showBulk;
            render();
          }
        } else if (action === 'team-ed-add-one') {
          var inp = document.getElementById('team-ed-add-input');
          if (state.teamEditor && inp && inp.value.trim()) {
            var res = addUniquePlayers(state.teamEditor.players, [inp.value]);
            state.teamEditor.players = res.list;
            render();
            var reInp = document.getElementById('team-ed-add-input');
            if (reInp) reInp.focus();
            if (!res.addedCount) showToast('Player already in squad', true);
          }
        } else if (action === 'team-ed-add-bulk') {
          var ta = document.getElementById('team-ed-bulk-text');
          if (state.teamEditor && ta && ta.value.trim()) {
            var parsed = parseBulkPlayers(ta.value);
            var resB = addUniquePlayers(state.teamEditor.players, parsed);
            state.teamEditor.players = resB.list;
            state.teamEditor.showBulk = false;
            render();
            showToast('Added ' + resB.addedCount + ' players!');
          }
        } else if (action === 'team-ed-rem-player') {
          if (state.teamEditor) {
            state.teamEditor.players.splice(Number(btn.dataset.idx), 1);
            render();
          }
        } else if (action === 'team-ed-save') {
          var ed = state.teamEditor;
          if (!ed) return;
          var tName = cleanName(ed.name);
          if (!tName) { showToast('Enter a team name', true); return; }
          if (ed.id) {
            var ti = state.teams.findIndex(function (t) { return t.id === ed.id; });
            if (ti >= 0) {
              state.teams[ti].name = tName;
              state.teams[ti].players = ed.players.slice();
              state.teams[ti].updatedAt = Date.now();
            }
          } else {
            state.teams.push({ id: uid('team'), name: tName, players: ed.players.slice(), updatedAt: Date.now() });
          }
          state.teamEditor = null;
          await persistTeams();
          render();
          showToast('Team "' + tName + '" saved!');
        } else if (action === 'team-delete') {
          var delTid = btn.dataset.id;
          state.teams = state.teams.filter(function (t) { return t.id !== delTid; });
          await persistTeams();
          render();
          showToast('Team deleted');
        }

        /* ---- MATCH SETUP INLINE SQUAD ACTIONS ---- */
        else if (action === 'setup-set-overs') {
          if (state.setup) { state.setup.oversLimit = Number(btn.dataset.ov); render(); }
        } else if (action === 'setup-toggle-bulk') {
          var sd = btn.dataset.side;
          if (sd === 'A') state.setup.showBulkA = !state.setup.showBulkA;
          else state.setup.showBulkB = !state.setup.showBulkB;
          render();
        } else if (action === 'setup-add-one') {
          var sideA = btn.dataset.side;
          var sInp = document.getElementById('setup-add-inp-' + sideA);
          if (sInp && sInp.value.trim()) {
            var key = sideA === 'A' ? 'playersA' : 'playersB';
            var rAdd = addUniquePlayers(state.setup[key], [sInp.value]);
            state.setup[key] = rAdd.list;
            syncSetupOpeners();
            render();
            var ref = document.getElementById('setup-add-inp-' + sideA);
            if (ref) ref.focus();
            if (!rAdd.addedCount) showToast('Player already in Team ' + sideA, true);
          }
        } else if (action === 'setup-add-bulk') {
          var sideB = btn.dataset.side;
          var sTa = document.getElementById('setup-bulk-' + sideB);
          if (sTa && sTa.value.trim()) {
            var keyB = sideB === 'A' ? 'playersA' : 'playersB';
            var rBulk = addUniquePlayers(state.setup[keyB], parseBulkPlayers(sTa.value));
            state.setup[keyB] = rBulk.list;
            if (sideB === 'A') state.setup.showBulkA = false; else state.setup.showBulkB = false;
            syncSetupOpeners();
            render();
            showToast('Added ' + rBulk.addedCount + ' players to Team ' + sideB);
          }
        } else if (action === 'setup-rem-player') {
          var sideR = btn.dataset.side;
          var keyR = sideR === 'A' ? 'playersA' : 'playersB';
          state.setup[keyR].splice(Number(btn.dataset.idx), 1);
          syncSetupOpeners();
          render();
        }

        /* ---- SCORING & MATCH ACTIONS ---- */
        else if (action === 'score') {
          scoreBall(btn.dataset.type, Number(btn.dataset.runs));
        } else if (action === 'open-extra') {
          openExtraModal(btn.dataset.type);
        } else if (action === 'commit-extra') {
          closeModal();
          scoreBall(btn.dataset.type, Number(btn.dataset.runs));
        } else if (action === 'open-wicket') {
          openWicketModal();
        } else if (action === 'wkt-add-fielder') {
          var lf = document.getElementById('wkt-late-fielder');
          var wm = getActiveMatch();
          if (lf && lf.value.trim() && wm) {
            var wInn = wm.innings[wm.currentInnings];
            var fName = cleanName(lf.value);
            wm.squads[wInn.bowlingSide] = addUniquePlayers(wm.squads[wInn.bowlingSide], [fName]).list;
            var fSel = document.getElementById('wkt-fielder');
            if (fSel) {
              var opt = document.createElement('option');
              opt.value = fName; opt.textContent = fName; opt.selected = true;
              fSel.appendChild(opt);
            }
            lf.value = '';
            persistState();
            showToast('Added ' + fName + ' to fielding squad');
          }
        } else if (action === 'wkt-add-batter') {
          var lb = document.getElementById('wkt-late-batter');
          var bm = getActiveMatch();
          if (lb && lb.value.trim() && bm) {
            var bInn = bm.innings[bm.currentInnings];
            var bName = cleanName(lb.value);
            bm.squads[bInn.battingSide] = addUniquePlayers(bm.squads[bInn.battingSide], [bName]).list;
            var bSel = document.getElementById('wkt-new-batter');
            if (bSel) {
              var optB = document.createElement('option');
              optB.value = bName; optB.textContent = bName; optB.selected = true;
              bSel.appendChild(optB);
            }
            lb.value = '';
            persistState();
            showToast('Added ' + bName + ' to batting squad');
          }
        } else if (action === 'undo') {
          undoLastBall();
        } else if (action === 'swap-strike') {
          var sm = getActiveMatch();
          if (!sm || !isAdmin()) return;
          var sinn = sm.innings[sm.currentInnings];
          var tmp = sinn.strikerIdx; sinn.strikerIdx = sinn.nonStrikerIdx; sinn.nonStrikerIdx = tmp;
          await persistState();
          render();
        } else if (action === 'change-bowler') {
          openBowlerModal(false);
        } else if (action === 'pick-squad-bowler') {
          var pm = getActiveMatch();
          if (!pm || !isAdmin()) return;
          var pinn = pm.innings[pm.currentInnings];
          var chosen = btn.dataset.name;
          var bIdx = pinn.bowlers.findIndex(function (bw) { return bw.name.toLowerCase() === chosen.toLowerCase(); });
          if (bIdx < 0) {
            pinn.bowlers.push({ name: chosen, balls: 0, maidens: 0, runs: 0, wickets: 0 });
            bIdx = pinn.bowlers.length - 1;
          }
          pinn.bowlerIdx = bIdx;
          closeModal();
          await persistState();
          render();
        } else if (action === 'open-end-inn1') {
          openEndInnings1Modal();
        } else if (action === 'open-start-inn2') {
          openStartInnings2Modal();
        } else if (action === 'inn2-add-bat') {
          var i2b = document.getElementById('inn2-late-bat');
          var m2b = getActiveMatch();
          if (i2b && i2b.value.trim() && m2b) {
            var nBat = cleanName(i2b.value);
            m2b.squads[m2b.innings[1].battingSide] = addUniquePlayers(m2b.squads[m2b.innings[1].battingSide], [nBat]).list;
            ['inn2-striker', 'inn2-nonstriker'].forEach(function (id) {
              var s = document.getElementById(id);
              if (s) { var o = document.createElement('option'); o.value = nBat; o.textContent = nBat; s.appendChild(o); }
            });
            i2b.value = '';
            persistState();
            showToast('Added ' + nBat + ' to 2nd innings batting squad');
          }
        } else if (action === 'inn2-add-bowl') {
          var i2bw = document.getElementById('inn2-late-bowl');
          var m2bw = getActiveMatch();
          if (i2bw && i2bw.value.trim() && m2bw) {
            var nBowl = cleanName(i2bw.value);
            m2bw.squads[m2bw.innings[1].bowlingSide] = addUniquePlayers(m2bw.squads[m2bw.innings[1].bowlingSide], [nBowl]).list;
            var sBw = document.getElementById('inn2-bowler');
            if (sBw) { var o2 = document.createElement('option'); o2.value = nBowl; o2.textContent = nBowl; o2.selected = true; sBw.appendChild(o2); }
            i2bw.value = '';
            persistState();
            showToast('Added ' + nBowl + ' to 2nd innings bowling squad');
          }
        } else if (action === 'go-innings-break') {
          var bkm = getActiveMatch();
          if (!bkm || !isAdmin()) return;
          bkm.target = bkm.innings[0].runs + 1;
          bkm.status = 'break';
          closeModal();
          await persistState();
          render();
          showToast('1st Innings ended — Target: ' + bkm.target);
        } else if (action === 'open-end-match') {
          openEndMatchModal();
        } else if (action === 'rename-player') {
          var rm = getActiveMatch();
          if (!rm || !isAdmin()) return;
          var rinn = rm.innings[rm.currentInnings];
          var role = btn.dataset.role;
          var cur = role === 'striker' ? rinn.batters[rinn.strikerIdx].name : (role === 'nonstriker' ? rinn.batters[rinn.nonStrikerIdx].name : rinn.bowlers[rinn.bowlerIdx].name);
          openModal(
            '<div class="modal-head"><span class="font-extrabold">Rename Player</span><button type="button" class="icon-btn" data-action="close-modal">✕</button></div>' +
            '<form id="rename-form" data-role="' + role + '" class="modal-scroll stack-sm">' +
              '<input name="newName" class="field-input" value="' + esc(cur) + '" required />' +
              '<button type="submit" class="btn btn-primary btn-full">Save Name</button>' +
            '</form>'
          );
        }

        /* ---- SCORECARD, HISTORY & SHARE ---- */
        else if (action === 'sc-inn') {
          state.scorecardInn = Number(btn.dataset.idx);
          render();
        } else if (action === 'hist-filter') {
          state.historyFilter = btn.dataset.val;
          render();
        } else if (action === 'open-match') {
          state.activeMatchId = btn.dataset.id;
          var om = getActiveMatch();
          state.currentTab = om && om.status === 'completed' ? 'scorecard' : 'live';
          if (isAdmin()) await persistState();
          render();
        } else if (action === 'confirm-delete') {
          var delId = btn.dataset.id;
          openModal(
            '<div class="modal-head"><span class="font-extrabold text-rose">Delete Match?</span><button type="button" class="icon-btn" data-action="close-modal">✕</button></div>' +
            '<div class="modal-scroll text-sm muted">This will permanently remove this match from TCP history.</div>' +
            '<div class="modal-foot">' +
              '<button type="button" class="btn btn-subtle" style="flex:1;" data-action="close-modal">Cancel</button>' +
              '<button type="button" class="btn btn-rose" style="flex:1;" data-action="do-delete" data-id="' + delId + '">Delete</button>' +
            '</div>'
          );
        } else if (action === 'do-delete') {
          var idToDel = btn.dataset.id;
          state.matches = state.matches.filter(function (x) { return x.id !== idToDel; });
          if (state.activeMatchId === idToDel) state.activeMatchId = state.matches[0] ? state.matches[0].id : null;
          closeModal();
          await persistState();
          render();
          showToast('Match deleted');
        } else if (action === 'open-share') {
          state.shareTab = 'quick';
          openShareModal(btn.dataset.id);
        } else if (action === 'share-tab') {
          state.shareTab = btn.dataset.tab;
          openShareModal(state.shareMatchId);
        } else if (action === 'copy-share') {
          var cm = state.matches.find(function (x) { return x.id === state.shareMatchId; }) || getActiveMatch();
          var ctxt = state.shareTab === 'full' ? buildWhatsAppFull(cm) : buildWhatsAppQuick(cm);
          var cTa = document.createElement('textarea');
          cTa.value = ctxt; document.body.appendChild(cTa); cTa.select();
          document.execCommand('copy'); document.body.removeChild(cTa);
          showToast('Copied for WhatsApp!');
        } else if (action === 'native-share') {
          var nm = state.matches.find(function (x) { return x.id === state.shareMatchId; }) || getActiveMatch();
          var ntxt = state.shareTab === 'full' ? buildWhatsAppFull(nm) : buildWhatsAppQuick(nm);
          if (navigator.share) navigator.share({ title: nm.title, text: ntxt }).catch(function () {});
          else showToast('Use Copy Text or WhatsApp button', true);
        } else if (action === 'download-png') {
          var canvas = document.getElementById('share-scorecard-canvas');
          if (!canvas) return;
          var a = document.createElement('a');
          a.download = 'TCP_Scorecard.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
          showToast('HD PNG downloaded!');
        } else if (action === 'share-png') {
          var sc = document.getElementById('share-scorecard-canvas');
          if (!sc) return;
          sc.toBlob(async function (blob) {
            if (blob && navigator.share && navigator.canShare) {
              var file = new File([blob], 'TCP_Scorecard.png', { type: 'image/png' });
              if (navigator.canShare({ files: [file] })) {
                try { await navigator.share({ files: [file], title: 'TCP Scorecard' }); return; } catch (err) {}
              }
            }
            var link = document.createElement('a');
            link.download = 'TCP_Scorecard.png';
            link.href = sc.toDataURL('image/png');
            link.click();
            showToast('PNG saved to device!');
          }, 'image/png');
        }

        /* ---- EDIT MATCH & SQUADS MODAL ACTIONS ---- */
        else if (action === 'open-edit' || action === 'open-edit-squads') {
          var emMatch = state.matches.find(function (x) { return x.id === btn.dataset.id; }) || getActiveMatch();
          if (!emMatch || !isAdmin()) return;
          state.editDraft = clone(emMatch);
          state.editTab = action === 'open-edit-squads' ? 'squads' : 'info';
          state.editInn = emMatch.currentInnings || 0;
          renderEditModal();
        } else if (action === 'edit-tab') {
          state.editTab = btn.dataset.tab;
          renderEditModal();
        } else if (action === 'edit-inn') {
          state.editInn = Number(btn.dataset.idx);
          renderEditModal();
        } else if (action === 'edit-auto-result') {
          if (state.editDraft) { state.editDraft.result = computeResult(state.editDraft); renderEditModal(); }
        } else if (action === 'edit-sq-add') {
          var eSide = btn.dataset.side;
          var eInp = document.getElementById('edit-add-sq-' + eSide);
          if (state.editDraft && eInp && eInp.value.trim()) {
            var rSq = addUniquePlayers(state.editDraft.squads[eSide], [eInp.value]);
            state.editDraft.squads[eSide] = rSq.list;
            renderEditModal();
          }
        } else if (action === 'edit-sq-del') {
          var dSide = btn.dataset.side;
          if (state.editDraft) {
            state.editDraft.squads[dSide].splice(Number(btn.dataset.idx), 1);
            renderEditModal();
          }
        } else if (action === 'save-edit') {
          var d = state.editDraft;
          if (!d) return;
          var mIdx = state.matches.findIndex(function (x) { return x.id === d.id; });
          if (mIdx >= 0) {
            var old = state.matches[mIdx];
            if (old.teamA !== d.teamA || old.teamB !== d.teamB) {
              d.innings.forEach(function (inn) {
                if (inn.battingSide === 'A') inn.battingTeam = d.teamA;
                else inn.battingTeam = d.teamB;
                if (inn.bowlingSide === 'A') inn.bowlingTeam = d.teamA;
                else inn.bowlingTeam = d.teamB;
              });
            }
            d.updatedAt = Date.now();
            state.matches[mIdx] = normalizeMatch(d);
          }
          closeModal();
          await persistState();
          render();
          showToast('Match & squads saved!');
        } else if (action === 'export-json') {
          var blob = new Blob([JSON.stringify({ matches: state.matches, teams: state.teams }, null, 2)], { type: 'application/json' });
          var dl = document.createElement('a');
          dl.href = URL.createObjectURL(blob);
          dl.download = 'tcp_cricket_backup.json';
          dl.click();
          showToast('Backup exported!');
        } else if (action === 'import-json') {
          document.getElementById('import-json-input').click();
        }
      });

      /* Live Input & Select Change Listeners */
      document.addEventListener('change', function (e) {
        var el = e.target;
        if (el.id === 'wkt-kind') {
          var fw = document.getElementById('wkt-fielder-wrap');
          if (fw) fw.classList.toggle('hidden', ['Caught', 'Run Out', 'Stumped'].indexOf(el.value) < 0);
        } else if (el.dataset.setupLoadTeam) {
          var side = el.dataset.setupLoadTeam;
          var team = state.teams.find(function (t) { return t.id === el.value; });
          if (team && state.setup) {
            if (side === 'A') { state.setup.teamA = team.name; state.setup.playersA = team.players.slice(); }
            else { state.setup.teamB = team.name; state.setup.playersB = team.players.slice(); }
            state.setup.customStriker = false;
            state.setup.customNonStriker = false;
            state.setup.customBowler = false;
            syncSetupOpeners();
            render();
            showToast('Loaded ' + team.name + ' (' + team.players.length + ' players)');
          }
        } else if (el.dataset.setupField && state.setup) {
          var f = el.dataset.setupField;
          state.setup[f] = el.type === 'number' ? Number(el.value) : el.value;
          if (f === 'wicketsLimit') state.setup.wicketsManual = true;
          if (f === 'tossWinner' || f === 'tossDecision') {
            state.setup.customStriker = false;
            state.setup.customNonStriker = false;
            state.setup.customBowler = false;
            syncSetupOpeners();
            render();
          }
        } else if (el.dataset.setupCheck && state.setup) {
          state.setup[el.dataset.setupCheck] = el.checked;
        } else if (el.dataset.setupOpener && state.setup) {
          var op = el.dataset.setupOpener;
          if (el.value === '__NEW__') {
            if (op === 'striker') { state.setup.customStriker = true; state.setup.striker = ''; }
            if (op === 'nonStriker') { state.setup.customNonStriker = true; state.setup.nonStriker = ''; }
            if (op === 'bowler') { state.setup.customBowler = true; state.setup.bowler = ''; }
          } else {
            if (op === 'striker') { state.setup.customStriker = false; state.setup.striker = el.value; }
            if (op === 'nonStriker') { state.setup.customNonStriker = false; state.setup.nonStriker = el.value; }
            if (op === 'bowler') { state.setup.customBowler = false; state.setup.bowler = el.value; }
          }
          syncSetupOpeners();
          render();
        } else if (el.dataset.sqRenameSide && state.editDraft) {
          var rSide = el.dataset.sqRenameSide;
          var oldN = el.dataset.sqOld;
          var newN = cleanName(el.value);
          if (newN && newN !== oldN) {
            renamePlayerInMatch(state.editDraft, rSide, oldN, newN);
            el.dataset.sqOld = newN;
          }
        }
      });

      document.addEventListener('input', function (e) {
        var el = e.target;
        if (el.id === 'history-search-input') {
          state.historySearch = el.value;
          render();
          var f = document.getElementById('history-search-input');
          if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
        } else if (el.id === 'team-ed-name' && state.teamEditor) {
          state.teamEditor.name = el.value;
        } else if (el.dataset.setupField && state.setup && el.tagName !== 'SELECT') {
          state.setup[el.dataset.setupField] = el.type === 'number' ? Number(el.value) : el.value;
          if (el.dataset.setupField === 'wicketsLimit') state.setup.wicketsManual = true;
        } else if (el.id === 'setup-custom-striker' && state.setup) {
          state.setup.striker = el.value;
        } else if (el.id === 'setup-custom-nonstriker' && state.setup) {
          state.setup.nonStriker = el.value;
        } else if (el.id === 'setup-custom-bowler' && state.setup) {
          state.setup.bowler = el.value;
        } else if (state.editDraft) {
          if (el.dataset.edit) {
            state.editDraft[el.dataset.edit] = el.type === 'number' ? Number(el.value) : el.value;
          } else if (el.dataset.innEdit) {
            state.editDraft.innings[state.editInn][el.dataset.innEdit] = Number(el.value) || 0;
          } else if (el.dataset.exEdit) {
            state.editDraft.innings[state.editInn].extras[el.dataset.exEdit] = Number(el.value) || 0;
          }
        }
      });

      /* Enter key support for quick player add inputs */
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        var id = e.target.id;
        if (id === 'team-ed-add-input') {
          e.preventDefault();
          var b = document.querySelector('[data-action="team-ed-add-one"]');
          if (b) b.click();
        } else if (id === 'setup-add-inp-A' || id === 'setup-add-inp-B') {
          e.preventDefault();
          var side = id.slice(-1);
          var sb = document.querySelector('[data-action="setup-add-one"][data-side="' + side + '"]');
          if (sb) sb.click();
        }
      });

      /* Form Submissions */
      document.addEventListener('submit', async function (e) {
        e.preventDefault();
        var form = e.target;

        if (form.id === 'new-match-form') {
          var s = state.setup;
          var striker = cleanName(s.striker) || 'Opener 1';
          var nonStriker = cleanName(s.nonStriker) || 'Opener 2';
          var bowler = cleanName(s.bowler) || 'Bowler 1';
          if (striker.toLowerCase() === nonStriker.toLowerCase()) {
            showToast('Striker and Non-Striker cannot be the same player', true);
            return;
          }
          var nm = createNewMatch({
            title: cleanName(s.title) || 'TCP Match',
            venue: cleanName(s.venue) || 'Tamarind Ground',
            date: s.date || todayStr(),
            oversLimit: Number(s.oversLimit) || 10,
            wicketsLimit: Number(s.wicketsLimit) || 10,
            teamA: cleanName(s.teamA) || 'Team A',
            teamB: cleanName(s.teamB) || 'Team B',
            playersA: s.playersA,
            playersB: s.playersB,
            tossWinner: s.tossWinner,
            tossDecision: s.tossDecision,
            striker: striker,
            nonStriker: nonStriker,
            bowler: bowler
          });

          // Optionally save/update squads to Saved Teams library
          if (s.saveToLibrary) {
            [{ name: nm.teamA, players: nm.squads.A }, { name: nm.teamB, players: nm.squads.B }].forEach(function (item) {
              if (!item.name || !item.players.length) return;
              var ex = state.teams.find(function (t) { return t.name.toLowerCase() === item.name.toLowerCase(); });
              if (ex) { ex.players = item.players.slice(); ex.updatedAt = Date.now(); }
              else state.teams.push({ id: uid('team'), name: item.name, players: item.players.slice(), updatedAt: Date.now() });
            });
            await persistTeams();
          }

          state.matches.unshift(nm);
          state.activeMatchId = nm.id;
          state.setup = null;
          state.currentTab = 'live';
          await persistState();
          render();
          showToast('Live match started!');
        } else if (form.id === 'end-inn1-form' || form.id === 'start-inn2-form') {
          var fd2 = new FormData(form);
          var m2 = getActiveMatch();
          if (!m2 || !isAdmin()) return;
          var st2 = cleanName(fd2.get('striker')) || 'Opener 1';
          var ns2 = cleanName(fd2.get('nonStriker')) || 'Opener 2';
          var bw2 = cleanName(fd2.get('bowler')) || 'Bowler 1';
          if (st2.toLowerCase() === ns2.toLowerCase()) {
            showToast('Striker and Non-Striker must be different players', true);
            return;
          }
          m2.target = m2.innings[0].runs + 1;
          m2.currentInnings = 1;
          m2.status = 'live';
          var i2 = m2.innings[1];
          i2.batters = [
            { name: st2, runs: 0, balls: 0, fours: 0, sixes: 0, out: false, retiredHurt: false, dismissal: '' },
            { name: ns2, runs: 0, balls: 0, fours: 0, sixes: 0, out: false, retiredHurt: false, dismissal: '' }
          ];
          i2.bowlers = [{ name: bw2, balls: 0, maidens: 0, runs: 0, wickets: 0 }];
          i2.strikerIdx = 0; i2.nonStrikerIdx = 1; i2.bowlerIdx = 0;
          closeModal();
          await persistState();
          render();
          showToast('2nd Innings started! Target: ' + m2.target);
        } else if (form.id === 'end-match-form') {
          var fdE = new FormData(form);
          var mE = getActiveMatch();
          if (!mE || !isAdmin()) return;
          var rType = fdE.get('resType');
          if (rType === 'auto') mE.result = computeResult(mE);
          else if (rType === 'tie') mE.result = 'Match Tied';
          else if (rType === 'nr') mE.result = 'No Result / Abandoned';
          else mE.result = cleanName(fdE.get('customResult')) || computeResult(mE);
          mE.status = 'completed';
          closeModal();
          await persistState();
          render();
          showToast('Match completed!');
        } else if (form.id === 'wicket-form') {
          var fdW = new FormData(form);
          var wm = getActiveMatch();
          var wInn = wm.innings[wm.currentInnings];
          var bowlerName = wInn.bowlers[wInn.bowlerIdx] ? wInn.bowlers[wInn.bowlerIdx].name : '';
          var kind = fdW.get('kind');
          var fielder = cleanName(fdW.get('fielder'));
          var dismissalText = kind;
          if (kind === 'Bowled') dismissalText = 'b ' + bowlerName;
          else if (kind === 'LBW') dismissalText = 'lbw b ' + bowlerName;
          else if (kind === 'Caught') dismissalText = (fielder ? 'c ' + fielder + ' ' : 'c & ') + 'b ' + bowlerName;
          else if (kind === 'Stumped') dismissalText = (fielder ? 'st ' + fielder + ' ' : 'st ') + 'b ' + bowlerName;
          else if (kind === 'Run Out') dismissalText = fielder ? 'run out (' + fielder + ')' : 'run out';
          else if (kind === 'Hit Wicket') dismissalText = 'hit wicket b ' + bowlerName;

          var newBat = cleanName(fdW.get('newBatter'));
          var isLast = (wInn.wickets + 1) >= (wm.wicketsLimit || 10);
          if (!newBat && !isLast) {
            showToast('Select or add the next batter', true);
            return;
          }
          closeModal();
          scoreBall('wicket', Number(fdW.get('runs')), {
            kind: kind,
            outRole: fdW.get('outRole'),
            dismissalText: dismissalText,
            newBatter: newBat
          });
        } else if (form.id === 'late-bowler-form') {
          var bName = cleanName(document.getElementById('late-bowler-name').value);
          var mB = getActiveMatch();
          if (mB && bName) {
            var bInn = mB.innings[mB.currentInnings];
            mB.squads[bInn.bowlingSide] = addUniquePlayers(mB.squads[bInn.bowlingSide], [bName]).list;
            bInn.bowlers.push({ name: bName, balls: 0, maidens: 0, runs: 0, wickets: 0 });
            bInn.bowlerIdx = bInn.bowlers.length - 1;
            closeModal();
            await persistState();
            render();
            showToast(bName + ' added to squad & bowling');
          }
        } else if (form.id === 'rename-form') {
          var newName = cleanName(new FormData(form).get('newName'));
          var mR = getActiveMatch();
          if (mR && newName) {
            var rInn = mR.innings[mR.currentInnings];
            var role = form.dataset.role;
            var oldName = role === 'striker' ? rInn.batters[rInn.strikerIdx].name : (role === 'nonstriker' ? rInn.batters[rInn.nonStrikerIdx].name : rInn.bowlers[rInn.bowlerIdx].name);
            var side = role === 'bowler' ? rInn.bowlingSide : rInn.battingSide;
            renamePlayerInMatch(mR, side, oldName, newName);
            closeModal();
            await persistState();
            render();
          }
        } else if (form.id === 'email-auth-form') {
          if (!fb.auth) return;
          var em = document.getElementById('auth-email').value.trim();
          var pw = document.getElementById('auth-pass').value;
          try {
            if (state.authFormMode === 'signup') await fb.auth.createUserWithEmailAndPassword(em, pw);
            else await fb.auth.signInWithEmailAndPassword(em, pw);
            closeModal();
            showToast('Signed in!');
          } catch (err) {
            showToast(err.message || 'Auth failed', true);
          }
        } else if (form.id === 'add-admin-form') {
          var aEm = document.getElementById('new-admin-email').value.trim().toLowerCase();
          if (aEm && state.admins.indexOf(aEm) < 0) {
            await saveAdminsCloud(state.primaryAdmin, state.admins.concat([aEm]));
            document.getElementById('new-admin-email').value = '';
            showToast('Admin added!');
          }
        }
      });

      /* JSON Backup Import */
      document.getElementById('import-json-input').addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = async function () {
          try {
            var imported = JSON.parse(reader.result);
            if (Array.isArray(imported)) {
              state.matches = imported.map(normalizeMatch).concat(state.matches);
            } else if (imported && Array.isArray(imported.matches)) {
              state.matches = imported.matches.map(normalizeMatch).concat(state.matches);
              if (Array.isArray(imported.teams)) {
                state.teams = imported.teams;
                await persistTeams();
              }
            }
            await persistState();
            render();
            showToast('Backup imported!');
          } catch (err) { showToast('Invalid JSON file', true); }
        };
        reader.readAsText(file);
        e.target.value = '';
      });

      /* ======================== BOOTSTRAP (INSTANT RENDER) ======================== */
      loadLocal();
      render();
      initFirebaseAsync();
    })();
  </script>
</body>
</html>
